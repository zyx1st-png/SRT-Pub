  </g>
</g>

<path d="M438 493 H535" fill="none" stroke="#31415F" stroke-width="5" marker-end="url(#arrow)"/>
<text x="485" y="474" text-anchor="middle" class="small">确定化候选</text>

<g id="operator-layer" transform="translate(535,278)">
  <rect x="0" y="0" width="260" height="430" rx="42" fill="#FFFFFF" stroke="#D5DDE9" filter="url(#shadow)"/>
  <text x="130" y="42" text-anchor="middle" class="section">G<tspan baseline-shift="sub" font-size="14">θ</tspan></text>
