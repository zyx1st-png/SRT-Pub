<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">SRT 核心机制图</title>
<desc id="desc">开放潜在域经过选择算子形成现实切片，历史锁存为收敛结构并反馈重塑下一轮景观；图中同时展示 d-value、Psi_f、遮蔽、未来再选择空间与本体论时间。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F8FAFF"/><stop offset="1" stop-color="#EEF2F8"/>
  </linearGradient>
  <radialGradient id="potential" cx="45%" cy="45%" r="60%">
    <stop offset="0" stop-color="#DDF8FA" stop-opacity=".95"/><stop offset=".55" stop-color="#DCE7FF" stop-opacity=".75"/><stop offset="1" stop-color="#CBBEFF" stop-opacity=".12"/>
  </radialGradient>
  <linearGradient id="manifest" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10BFC7"/><stop offset="1" stop-color="#5377F2"/>
  </linearGradient>
  <linearGradient id="history" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6657D9"/><stop offset="1" stop-color="#8F5FD7"/>
  </linearGradient>
  <linearGradient id="futureGood" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0BBF9A"/><stop offset="1" stop-color="#10BFC7"/>
  </linearGradient>
  <linearGradient id="futureBad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#D77B75"/><stop offset="1" stop-color="#9D6675"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14213D" flood-opacity=".12"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#31415F"/>
  </marker>
  <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#0D9FA9"/>
  </marker>
  <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#6A58CF"/>
  </marker>
  <style>
    .title{font:400 38px 'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#15213A;letter-spacing:.5px}
    .subtitle{font:500 16px 'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#65718A;letter-spacing:1.8px}
    .section{font:400 24px 'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#17233B}
    .label{font:400 19px 'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#1E2A43}
    .small{font:500 14px 'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#53617A}
    .tiny{font:500 12px 'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#68758B}
    .math{font:700 18px 'STIX Two Math','Times New Roman',serif;fill:#25324D}
    .white{fill:white}
  </style>
</defs>

<rect width="1600" height="1000" fill="url(#bg)"/>
<path d="M0 118 H1600" stroke="#DDE3ED" stroke-width="1"/>
<text x="76" y="64" class="title">SRT 核心机制图</text>
<text x="78" y="94" class="subtitle">SELECTIVE REALITY THEORY · FROM OPEN POSSIBILITY TO RE-SELECTABLE ORDER</text>
<g transform="translate(1220,43)">
  <rect width="300" height="48" rx="24" fill="#FFFFFF" stroke="#DCE3EE"/>
  <circle cx="24" cy="24" r="6" fill="#0BBF9A"/><text x="40" y="29" class="small">选择不是发生在存在之中，而是产生稳定存在</text>
</g>

