    <text x="85" y="98" text-anchor="middle" class="tiny">把开放可能性压成现实的可支付阻抗</text>
  </g>
</g>

<path d="M795 493 H885" fill="none" stroke="#31415F" stroke-width="5" marker-end="url(#arrow)"/>
