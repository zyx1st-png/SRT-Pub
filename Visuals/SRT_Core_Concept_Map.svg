      <rect x="151" width="135" height="34" rx="17" fill="#EAF8FA"/><text x="218" y="23" text-anchor="middle" class="small">可协调</text>
      <rect x="302" width="135" height="34" rx="17" fill="#EEF0FC"/><text x="369" y="23" text-anchor="middle" class="small">不外包</text>
