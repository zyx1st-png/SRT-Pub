  <g transform="translate(525,58)"><circle r="9" fill="#7C61D4"/><text x="0" y="34" text-anchor="middle" class="small">不可撤回</text></g>
  <g transform="translate(685,58)"><circle r="9" fill="#8F5FD7"/><text x="0" y="34" text-anchor="middle" class="small">时间序</text></g>
