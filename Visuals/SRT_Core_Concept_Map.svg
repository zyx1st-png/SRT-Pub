  </g>
  <text x="175" y="191" text-anchor="middle" class="white" style="font:400 23px 'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">L2</text>
  <text x="175" y="218" text-anchor="middle" class="white" style="font:400 16px 'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">历史锁存</text>
