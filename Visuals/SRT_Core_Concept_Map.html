<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRT 核心机制图</title>
<style>
:root{--ink:#15213a;--muted:#64718a;--line:#d7dfeb;--bg:#eef2f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
header{max-width:1540px;margin:auto;padding:18px 22px 8px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:21px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:4px}.tools{display:flex;gap:8px;flex-wrap:wrap}
button,a.control{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer;color:var(--ink);text-decoration:none}
button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:1540px;margin:auto;padding:10px 18px 30px}.stage{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 16px 40px rgba(28,42,69,.08)}
object{display:block;width:100%;aspect-ratio:8/5}.note{font-size:13px;color:var(--muted);margin:10px 4px 0}.hidden-layer{opacity:.06;pointer-events:none}
@media(max-width:720px){header{align-items:flex-start}button,a.control{padding:8px 11px}}
</style>
</head>
<body>
<header>
  <div><h1>SRT 核心机制图</h1><div class="sub">切换图层查看选择、历史写回、遮蔽与未来分叉之间的结构关系。</div></div>
  <div class="tools">
    <button type="button" data-target="feedback-layer" aria-pressed="true">历史反馈</button>
    <button type="button" data-target="occlusion-layer" aria-pressed="true">遮蔽</button>
    <button type="button" data-target="future-layer" aria-pressed="true">未来分叉</button>
    <button type="button" data-target="time-layer" aria-pressed="true">本体时间</button>
    <a class="control" href="SRT_Core_Concept_Map.svg" target="_blank" rel="noopener">打开 SVG</a>
  </div>
</header>
<main>
  <div class="stage"><object id="diagram" data="SRT_Core_Concept_Map.svg" type="image/svg+xml" aria-label="SRT 核心机制图"></object></div>
  <p class="note">网页分享建议：将本目录部署到 GitHub Pages；微信、公众号或 PPT 请使用由 SVG 导出的高清 PNG。</p>
</main>
<script>
const object=document.getElementById('diagram');
function findLayer(id){return object.contentDocument ? object.contentDocument.getElementById(id) : null}
document.querySelectorAll('button[data-target]').forEach(button=>{
  button.addEventListener('click',()=>{
    const layer=findLayer(button.dataset.target);if(!layer)return;
    const active=button.getAttribute('aria-pressed')==='true';
    button.setAttribute('aria-pressed',String(!active));
    layer.classList.toggle('hidden-layer',active);
  });
});
object.addEventListener('load',()=>{
  const style=object.contentDocument.createElementNS('http://www.w3.org/2000/svg','style');
  style.textContent='.hidden-layer{opacity:.06!important;pointer-events:none} g{transition:opacity .25s ease}';
  object.contentDocument.documentElement.appendChild(style);
});
</script>
</body>
</html>
