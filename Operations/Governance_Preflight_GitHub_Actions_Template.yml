# INSTALL (one manual step; pushing .github/workflows/ needs a credential with
# `workflow` scope, e.g. after `gh auth refresh -s workflow`):
#   mkdir -p .github/workflows
#   cp Operations/Governance_Preflight_GitHub_Actions_Template.yml .github/workflows/governance-preflight.yml
#   then strip this INSTALL comment block, commit, push.
# 2026-07-07: push trigger narrowed to main only; agent branches (codex/**,
# claude/**) are covered by pull_request, avoiding double runs.
name: Governance Preflight

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check split metadata freshness
        run: uv run python scripts/refresh_split_metadata.py --check

      - name: Run governance preflight
        run: uv run python scripts/governance_preflight.py --skip-write-report --strict-split-metadata
