name: TEMP Cycle1 Final Closure

on:
  push:
    branches:
      - theory/author-reentry-cycle1-one-formation-20260905

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: theory/author-reentry-cycle1-one-formation-20260905

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply final discriminator-or-stop closure
        shell: bash
        run: |
          python - <<'PY'
          import base64
          exec(base64.b64decode(''))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Operations/Proposals/SRT_AUTHOR_REENTRY_CYCLE1_CLOSURE_2026-09-05.md STATUS.md
          git commit -m 'Close Cycle 1 discriminator-or-stop analysis'

      - name: Regenerate deterministic context bundles
        shell: bash
        run: |
          uv run python scripts/build_srt_context_bundles.py
          git add Operations/Context_Bundles
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh context bundles after Cycle 1 final closure'
          fi

      - name: Push closure commits
        shell: bash
        run: |
          git push origin HEAD:theory/author-reentry-cycle1-one-formation-20260905
