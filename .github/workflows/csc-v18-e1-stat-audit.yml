name: CSC v18 E1 statistical sensitivity audit

on:
  push:
    branches:
      - publication/csc-artificial-life-v18-e1e2e3-20260915

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute paired sensitivity without retraining
        working-directory: papers/costly_selective_closure_supplement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import random
          import statistics

          def paired_values(name):
              d = json.loads((Path('results') / name).read_text())
              by = {(r['regime'], r['seed']): r['post_coop'] for r in d['runs']}
              seeds = d['seeds']
              a = [by[('real', s)] for s in seeds]
              b = [by[('resettable', s)] for s in seeds]
              return d, seeds, a, b

          def signflip_exact_or_mc(diffs, n=20000, seed=20260915):
              obs = sum(diffs) / len(diffs)
              rng = random.Random(seed)
              c = 0
              for _ in range(n):
                  stat = sum((1 if rng.random() < .5 else -1) * d for d in diffs) / len(diffs)
                  if abs(stat) >= abs(obs) - 1e-15:
                      c += 1
              return (c + 1) / (n + 1)

          for name in ['main_results.json', 'zero_penalty_results.json']:
              raw, seeds, a, b = paired_values(name)
              diffs = [x-y for x,y in zip(a,b)]
              p = signflip_exact_or_mc(diffs)
              historical = raw['tests']['real_vs_resettable__post_coop']
              print(name)
              print('  historical two-sample label-permutation diff =', historical['diff'])
              print('  historical two-sample label-permutation p =', historical['p'])
              print('  paired mean difference =', statistics.fmean(diffs))
              print('  paired sign-flip sensitivity p =', p)
              print('  positive paired differences =', sum(d > 0 for d in diffs), '/', len(diffs))
              print('  zero paired differences =', sum(d == 0 for d in diffs), '/', len(diffs))
          PY
