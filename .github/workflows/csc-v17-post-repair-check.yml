name: CSC v17 post-repair check

on:
  push:
    branches:
      - publication/csc-artificial-life-v17-20260915

permissions:
  contents: read

jobs:
  artifact-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build submission artifact
        run: python papers/build_artificial_life_v17_submission.py | tee /tmp/csc-v17-post-repair-build.txt
      - name: Verify post-repair artifact
        run: |
          set -euo pipefail
          OUT=papers/CostlySelectiveClosure_v17_ArtificialLife_submission.md
          test -s "$OUT"
          grep -n 'costly_selective_closure_supplement/figures/figure1_design_v17.svg' "$OUT"
          ! grep -n 'costly_selective_closure_supplement/figures/figure2_design.png' "$OUT"
          grep -n '## AI Assistance Disclosure' "$OUT"
          grep -n '^\*\*Keywords\*\*:' "$OUT"
          ! grep -nE 'Repository note\.|CostlySelectiveClosure_v16\.md|Adaptive Behavior v16|v17-specific supplement note|historical supplement README|d_cog|Ψ_f' "$OUT"
          wc -w "$OUT"
      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: csc-v17-post-repair-check
          path: |
            papers/CostlySelectiveClosure_v17_ArtificialLife_submission.md
            /tmp/csc-v17-post-repair-build.txt
          retention-days: 1
