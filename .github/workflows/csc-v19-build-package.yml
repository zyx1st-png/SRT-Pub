name: CSC v19 one-shot build and package

on:
  pull_request:
    branches:
      - research/csc-consequence-scope-mechanism-audit-20260915
    paths:
      - '.github/workflows/csc-v19-build-package.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install figure dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib

      - name: Build submission and evidence figure
        run: |
          set -euo pipefail
          python papers/build_artificial_life_v19_submission.py | tee /tmp/v19-builder.log
          python papers/costly_selective_closure_supplement/generate_v19_evidence_summary.py | tee /tmp/v19-figure.log

      - name: Mechanical audit and build report
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          p = Path('papers/CostlySelectiveClosure_v19_ArtificialLife_submission.md')
          text = p.read_text(encoding='utf-8')
          words = re.findall(r"[A-Za-z0-9]+(?:[-'][A-Za-z0-9]+)*", text)
          n = len(words)
          refs = text.split('## References', 1)[1].split('## Appendix A.', 1)[0]
          body = text.split('## References', 1)[0]
          authors = []
          for line in refs.splitlines():
              m = re.match(r'- ([A-Za-z][A-Za-z-]+),', line)
              if m:
                  authors.append(m.group(1))
          missing = [a for a in authors if a not in body]

          svg = Path('papers/costly_selective_closure_supplement/figures/figure2_evidence_summary_v19.svg')
          if not svg.is_file():
              raise SystemExit('missing v19 evidence SVG')
          sha = hashlib.sha256(svg.read_bytes()).hexdigest()

          if not (6000 <= n <= 12000):
              raise SystemExit(f'word count outside Artificial Life Article range: {n}')
          if missing:
              raise SystemExit(f'unreferenced first authors: {missing}')

          report = f'''---
id: CSC-V19-BUILD-REPORT
type: publication_build_report
status: active
canonical: false
---

# CSC v19 Build Report

Generated from the publication branch by the one-shot build workflow.

```text
submission builder = PASS
approximate guarded word count = {n}
Artificial Life 6,000-12,000 Article range = PASS
reference entries = {len(authors)}
reference first-author closure = PASS
E1-E4 evidence SVG = PASS
E1-E4 evidence SVG sha256 = {sha}
```

The report records mechanical packaging checks only. Scientific claims remain governed by the E1-E4 result records, preregistrations, adjudications, and manuscript text.
'''
          Path('papers/CostlySelectiveClosure_v19_BUILD_REPORT.md').write_text(report, encoding='utf-8')
          print(report)
          PY

      - name: Build reviewer-safe static reproduction package
        run: |
          set -euo pipefail
          rm -rf /tmp/csc-v19-reviewer-package
          mkdir -p /tmp/csc-v19-reviewer-package/supplement/src
          mkdir -p /tmp/csc-v19-reviewer-package/supplement/results
          mkdir -p /tmp/csc-v19-reviewer-package/supplement/figures

          cp papers/CostlySelectiveClosure_v19_ArtificialLife_submission.md /tmp/csc-v19-reviewer-package/
          cp papers/CostlySelectiveClosure_v19_E1_E4_RECONSTRUCTION_DECISION.md /tmp/csc-v19-reviewer-package/
          cp papers/CostlySelectiveClosure_v19_STRONGEST_NEIGHBOR_AUDIT.md /tmp/csc-v19-reviewer-package/
          cp papers/CostlySelectiveClosure_v19_REVIEWER_PRESSURE_AUDIT.md /tmp/csc-v19-reviewer-package/
          cp papers/build_artificial_life_v19_submission.py /tmp/csc-v19-reviewer-package/

          find papers/costly_selective_closure_supplement -maxdepth 1 -type f \
            \( -name '*.py' -o -name '*PREREGISTRATION*.md' -o -name '*ADJUDICATION*.md' -o -name '*AUDIT*.md' \) \
            -exec cp {} /tmp/csc-v19-reviewer-package/supplement/ \;
          cp papers/costly_selective_closure_supplement/src/*.py /tmp/csc-v19-reviewer-package/supplement/src/
          cp papers/costly_selective_closure_supplement/results/*.json /tmp/csc-v19-reviewer-package/supplement/results/
          cp papers/costly_selective_closure_supplement/figures/figure1_design_v18.svg /tmp/csc-v19-reviewer-package/supplement/figures/
          cp papers/costly_selective_closure_supplement/figures/figure2_evidence_summary_v19.svg /tmp/csc-v19-reviewer-package/supplement/figures/

          cat > /tmp/csc-v19-reviewer-package/README.md <<'EOF'
# Reviewer reproduction package - CSC v19

This static package accompanies the manuscript **Who Bears Failure? Consequence Scope and Terminality in Survival-Coupled Artificial Agents**.

It contains the reviewer-facing submission Markdown, the E1-E4 implementation/result/preregistration materials needed to inspect the reported sequence, and the source figures. It intentionally does not depend on expiring GitHub Actions artifacts.

Preregistration commits reported in the manuscript:

- E2: `5852e60d82efc14748ae3478ee2400b4d3600839`
- E3: `0c599c14ea24196c6e2d411ecd0e4e17124f18f1`
- E4: `66cb46c45e99c5535c1f63b9c200ff9dbe911506`

Experiment 1 was not preregistered. E2-E4 were sequentially designed after earlier results were known and locked before their own confirmatory execution.
EOF

          (cd /tmp && zip -qr csc-v19-reviewer-reproduction.zip csc-v19-reviewer-package)
          sha256sum /tmp/csc-v19-reviewer-reproduction.zip | tee /tmp/reproduction.sha256

      - name: Upload reviewer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: csc-v19-reviewer-artifacts
          path: |
            papers/CostlySelectiveClosure_v19_ArtificialLife_submission.md
            papers/CostlySelectiveClosure_v19_BUILD_REPORT.md
            papers/costly_selective_closure_supplement/figures/figure2_evidence_summary_v19.svg
            papers/costly_selective_closure_supplement/figures/figure2_evidence_summary_v19.png
            /tmp/csc-v19-reviewer-reproduction.zip
            /tmp/reproduction.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit permanent build products
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/CostlySelectiveClosure_v19_BUILD_REPORT.md
          git add papers/costly_selective_closure_supplement/figures/figure2_evidence_summary_v19.svg
          if git diff --cached --quiet; then
            echo 'No permanent build products changed.'
          else
            git commit -m 'publication: record v19 build and E1-E4 evidence figure'
            git push origin HEAD:"${HEAD_BRANCH}"
          fi
