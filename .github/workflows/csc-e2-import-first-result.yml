name: CSC E2 import first confirmatory result

on:
  push:
    branches:
      - experiment/csc-v17-recoverability-e2-20260915

permissions:
  contents: write

jobs:
  import-first-result:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download immutable first-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/zyx1st-png/SRT-Pub/actions/artifacts/10393443723/zip \
            -o /tmp/csc-e2-first.zip
          echo "9adafeeba7e9c78a7c8a935313fa29d31c6996bcaaeb050f901276df9e103dbd  /tmp/csc-e2-first.zip" | sha256sum -c -
          rm -rf /tmp/csc-e2-first
          mkdir -p /tmp/csc-e2-first
          unzip -q /tmp/csc-e2-first.zip -d /tmp/csc-e2-first
          SRC=/tmp/csc-e2-first/home/runner/work/SRT-Pub/SRT-Pub/papers/costly_selective_closure_supplement/results/recoverability_gradient_results.json
          test -s "$SRC"
          cp "$SRC" papers/costly_selective_closure_supplement/results/recoverability_gradient_results.json
      - name: Verify preserved result identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('papers/costly_selective_closure_supplement/results/recoverability_gradient_results.json')
          d = json.loads(p.read_text())
          assert len(d['runs']) == 120
          assert d['primary_test']['tie_aware_spearman_rho'] == 0.05480746826452501
          assert d['primary_test']['blocked_by_seed_two_sided_p'] == 0.07079646017699115
          assert d['primary_test']['supported'] is False
          assert d['endpoint_tau_inf_minus_tau0']['mean_difference'] == 0.0059066666666666824
          assert d['strong_manuscript_support'] is False
          print('PASS: exact first-run E2 result recovered from artifact 10393443723')
          PY
      - name: Commit preserved first result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/costly_selective_closure_supplement/results/recoverability_gradient_results.json
          git commit -m "experiment: preserve first preregistered E2 result"
          git push origin HEAD:experiment/csc-v17-recoverability-e2-20260915
