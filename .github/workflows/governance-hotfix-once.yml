name: Governance Hotfix Once

on:
  push:
    branches:
      - hotfix/governance-preflight-20260808
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  hotfix:
    if: github.head_ref == 'hotfix/governance-preflight-20260808' || github.ref_name == 'hotfix/governance-preflight-20260808'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/governance-preflight-20260808
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply narrow governance metadata fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          status_targets = [
              Path("Neuroscience/INTEROCEPTIVE_PRECISION_SRT_BRIDGE.md"),
              Path("03_Bridges/SRT_Ruliad_Limited_Rendering_Observer_Theory_Bridge_2026-08-08.md"),
          ]
          for path in status_targets:
              text = path.read_text(encoding="utf-8")
              old = "status: active_v1\n"
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one {old.strip()!r} in {path}, found {text.count(old)}")
              path.write_text(text.replace(old, "status: active\n", 1), encoding="utf-8")

          hook = Path("Neuroscience/hooks/NEURAL23_Embodied_Rhythmic_Eligibility_Integration_Hook.md")
          text = hook.read_text(encoding="utf-8")
          old = '''  - target: "Neuroscience/SRT_Neuroscience_Hardening_N1_N13_v0_2.md"\n    state: pending\n    blocked_by: "Await the planned neuroscience hardening synthesis; integrate after the transition-field/selection-architecture section and before downstream L1-to-L2 plasticity eligibility."\n'''
          new = '''  - target: "Neuroscience/SRT_Neuroscience_Hardening_N1_N13_v0_2.md"\n    state: pending\n    target_status: planned\n    blocked_by: "Await the planned neuroscience hardening synthesis; integrate after the transition-field/selection-architecture section and before downstream L1-to-L2 plasticity eligibility."\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one planned hardening ledger block in {hook}, found {text.count(old)}")
          hook.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit metadata repairs before regeneration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Neuroscience/INTEROCEPTIVE_PRECISION_SRT_BRIDGE.md \
            03_Bridges/SRT_Ruliad_Limited_Rendering_Observer_Theory_Bridge_2026-08-08.md \
            Neuroscience/hooks/NEURAL23_Embodied_Rhythmic_Eligibility_Integration_Hook.md
          git diff --cached --check
          git commit -m "Fix governance metadata debt"

      - name: Regenerate context bundles from a clean tree
        run: uv run python scripts/build_srt_context_bundles.py

      - name: Commit regenerated context bundles
        shell: bash
        run: |
          git add Operations/Context_Bundles
          git diff --cached --check
          git commit -m "Refresh context bundles"

      - name: Verify governance preflight
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/refresh_split_metadata.py --check
          uv run python scripts/governance_preflight.py --skip-write-report --strict-split-metadata

      - name: Push generated hotfix commits
        shell: bash
        run: git push origin HEAD:hotfix/governance-preflight-20260808
