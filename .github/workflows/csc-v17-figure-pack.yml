name: CSC v17 figure pack

on:
  push:
    branches:
      - publication/csc-artificial-life-v17-20260915

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build submission manuscript
        run: python papers/build_artificial_life_v17_submission.py
      - name: Verify figure sources
        run: |
          test -s papers/costly_selective_closure_supplement/figures/figure2_design.png
          test -s papers/costly_selective_closure_supplement/figures/figure3_results.png
          test -s papers/costly_selective_closure_supplement/figures/figure4_common_state_probe.png
      - name: Upload submission sources
        uses: actions/upload-artifact@v4
        with:
          name: csc-v17-submission-sources
          path: |
            papers/CostlySelectiveClosure_v17_ArtificialLife_submission.md
            papers/CostlySelectiveClosure_v17_ArtificialLife_COVER_LETTER.md
            papers/costly_selective_closure_supplement/figures/figure2_design.png
            papers/costly_selective_closure_supplement/figures/figure3_results.png
            papers/costly_selective_closure_supplement/figures/figure4_common_state_probe.png
          retention-days: 1
