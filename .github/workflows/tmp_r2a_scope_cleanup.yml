name: Temporary R2-A scope cleanup

on:
  push:
    branches:
      - governance/r2a-authority-truth-up-20260912

permissions:
  contents: write

jobs:
  cleanup-unrelated-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/r2a-authority-truth-up-20260912
          fetch-depth: 0
      - name: Restore unrelated generated audit and remove helper
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- Operations/Archive_Records/Large_File_Audit_2026-05-09.md
          rm .github/workflows/tmp_r2a_scope_cleanup.yml
          git diff --check
      - name: Commit scope cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Drop unrelated large-file audit refresh"
          git push origin HEAD:governance/r2a-authority-truth-up-20260912
