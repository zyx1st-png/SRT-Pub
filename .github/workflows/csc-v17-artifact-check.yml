name: CSC v17 artifact check

on:
  push:
    branches:
      - publication/csc-artificial-life-v17-20260915

permissions:
  contents: read

jobs:
  artifact-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build submission artifact
        run: python papers/build_artificial_life_v17_submission.py | tee /tmp/csc-v17-build.txt

      - name: Inspect generated artifact
        run: |
          test -s papers/CostlySelectiveClosure_v17_ArtificialLife_submission.md
          echo '--- residue check ---'
          ! grep -nE 'Repository note\.|CostlySelectiveClosure_v16\.md|Adaptive Behavior v16|v17-specific supplement note|historical supplement README|d_cog|Ψ_f' papers/CostlySelectiveClosure_v17_ArtificialLife_submission.md
          echo '--- AI disclosure ---'
          grep -n '## AI Assistance Disclosure' papers/CostlySelectiveClosure_v17_ArtificialLife_submission.md
          echo '--- keywords ---'
          grep -n '^\*\*Keywords\*\*:' papers/CostlySelectiveClosure_v17_ArtificialLife_submission.md
          echo '--- approximate shell word count ---'
          wc -w papers/CostlySelectiveClosure_v17_ArtificialLife_submission.md

      - name: Upload generated manuscript
        uses: actions/upload-artifact@v4
        with:
          name: csc-v17-artifact-check
          path: |
            papers/CostlySelectiveClosure_v17_ArtificialLife_submission.md
            /tmp/csc-v17-build.txt
          retention-days: 1
