name: Governance Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  governance-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply bounded RC-A derivative cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"updated {path}")

          def insert_after_once(path, anchor, addition):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, got {count}: {anchor[:120]!r}")
              p.write_text(text.replace(anchor, anchor + addition, 1), encoding="utf-8")
              print(f"guarded {path}")

          replace_once("CANONICAL_REGISTRY.md", "T-COLL-4 共选真实性判据（P1-T05 集体版）", "T-COLL-4 集体 agency / revision guard（P2/P3 downstream；不是 P1-T05 集体版，也不是 Selection / collective-ISP existence criterion）")
          replace_once("_SRT_DEEP_THEORY_MAP.md", "- `Core/SRT_Core_21b_Constitutive_Theorems.md` (P1-T05 Real Choice Moment; canonical carrier)", "- `Core/SRT_Core_21b_Constitutive_Theorems.md` (P1-T06 Stable ISP is the current P1 carrier; former P1-T05 is retained there only as the RC-A demotion record)")
          replace_once("STATUS.md", "- `CG-0..CG-4` 门槛值仍是审计默认约定，不是已证定理；claim level 全程 P2-P3，不改 P1-T05。", "- `CG-0..CG-4` 门槛值仍是审计默认约定，不是已证定理；claim level 全程 P2-P3。该历史施工当时未改动 P1-T05；现由 2026-08-17 RC-A supersede，former P1-T05 已撤出 P1。")
          replace_once("Core/SRT_Core_21_Formal_Axioms.md", "- cite stable ISP continued selectability, real choice moment, ontological time, absorption, and `L_2` downward constraint from `Core/SRT_Core_21b_Constitutive_Theorems.md`;", "- cite stable ISP continued selectability, ontological time, absorption, and `L_2` downward constraint from `Core/SRT_Core_21b_Constitutive_Theorems.md`; read former Real Choice Moment there only as the RC-A demotion record;")
          replace_once("03_Bridges/BRIDGE_INDEX.md", "**Read this first for \"is this a real choice?\" questions.** Compresses T-D plus the four operational tests and the unified audit protocol into five gates with graded ladders (`DMF`/`NER`/`PEF`/`CBP`/`HEF`), audit-default minima, the non-compensation rule, three threshold tiers, and the no-choice / pseudo-choice / punitive-choice / respected-choice reading.", "**Read this first for bounded Selection-event candidate audit, including legacy \"is this a real choice?\" queries.** Compresses T-D plus the four operational tests and the unified audit protocol into five gates with graded ladders (`DMF`/`NER`/`PEF`/`CBP`/`HEF`), audit-default minima, the non-compensation rule and three threshold tiers. Under RC-A, passing the surface licenses only a bounded Selection-event candidate; it does not define Selection or prove agency, and legacy practice labels do not back-define the ontology.")

          replace_once("Governance/SRT_CLAIM_MODE_AUDIT.md", "| §3.5 T_dir 独立 ODE（弛豫 + r 泵入 + ΔΨ_f^gap 扣除 + S_str 侵蚀 + s_ext 支架） | — | P1-candidate 结构形式；κ_* 五项系数 P2/P3 |", "| §3.5 T_dir 独立 ODE（弛豫 + ΔΨ_f^gap 扣除 + S_str 侵蚀 + s_ext 支架） | — | P1-candidate 结构形式；former-P1-T05-derived `r(t)` pump 已由 RC-A subtractive probe 删除；其余 κ_* 系数 P2/P3 |")
          replace_once("Governance/SRT_CLAIM_MODE_AUDIT.md", "| §5.1 第 6 条\"苦难-可读性正反馈环\"（`S_{str} \\to T_{dir} \\downarrow \\to r \\downarrow \\to S_{sig}` 积压） | — | P1-candidate（2026-04-25 H2 新增，依赖 §3.5） |", "| Former §5.1 第 6 条\"苦难-可读性正反馈环\"（`S_{str} \\to T_{dir} \\downarrow \\to r \\downarrow \\to S_{sig}`） | — | RC-A 已删除该 former-P1-T05-derived feedback path；不再列为当前 P1-candidate 通道 |")
          replace_once("Governance/SRT_CLAIM_MODE_AUDIT.md", "| T-COLL-4 共选真实性判据 | — | P1-candidate（P1-T05 集体版的对应） |", "| T-COLL-4 collective agency / revision guard | — | P2/P3 downstream guard under RC-A；不是 P1-T05 集体版，也不是 Selection occurrence / T-COLL-1 的必要条件 |")
          replace_once("Governance/SRT_CLAIM_MODE_AUDIT.md", "| §4.4.4 T_{dir}^{coll} ODE + 集体层致命 `L_2` 判据 `\\kappa_{mask}^{coll} < \\kappa_{\\mathrm{relax}}^{coll}` | — | P1-candidate 结构形式；κ_*^{coll} 五项 P2/P3 |", "| §4.4.4 T_{dir}^{coll} ODE + 集体层致命 `L_2` 判据 `\\kappa_{mask}^{coll} < \\kappa_{\\mathrm{relax}}^{coll}` | — | P1-candidate 结构形式；RC-A 已删除 former-P1-T05-derived `r^{coll}` pump；其余 κ_*^{coll} 系数 P2/P3 |")
          replace_once("Governance/SRT_CLAIM_MODE_AUDIT.md", "| §4.6 集体病理吸引子 `\\mathcal{A}_{path}^{coll}` / 集体健康区 `\\mathcal{H}^{coll}`（`r^{coll} > r^{coll}_{min}` 硬条件） | — | P1-candidate（T-COLL-4 共选真实性的持续要求在动力学上的形式化） |", "| §4.6 集体病理吸引子 `\\mathcal{A}_{path}^{coll}` / 集体健康区 `\\mathcal{H}^{coll}` | — | P1-candidate / P2-P3 mixed；RC-A 已删除 `r^{coll} > r^{coll}_{min}` 硬条件，generative-health / revision standing 不与 T-COLL-1 混写 |")
          replace_once("Governance/SRT_CLAIM_MODE_AUDIT.md", "**Downstream rule**：T-COLL-1/3/4 须标 `P1-candidate`；三类退化的判据须标 `P2`；", "**Downstream rule**：T-COLL-1 须标 `P1-candidate`；T-COLL-3 / T-COLL-4 须标 `P2/P3 downstream`；三类退化的判据须标 `P2`；")
