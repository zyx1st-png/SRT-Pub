name: Governance Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  r2b-closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply STATUS closeout
        run: python scripts/tmp_r2b_closeout.py
      - name: Commit clean source state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATUS.md
          git commit -m 'Refresh STATUS for R2-B Bearer closeout'
      - name: Regenerate context bundles
        run: uv run python scripts/build_srt_context_bundles.py
      - name: Restore permanent workflow and remove helper
        run: |
          git checkout origin/main -- .github/workflows/governance-preflight.yml
          rm scripts/tmp_r2b_closeout.py
          git add Operations/Context_Bundles .github/workflows/governance-preflight.yml scripts/tmp_r2b_closeout.py
          git commit -m 'Regenerate context bundles after R2-B landing'
      - name: Validate final tree
        run: |
          uv run python scripts/refresh_split_metadata.py --check
          uv run python scripts/governance_preflight.py --skip-write-report --strict-split-metadata
      - name: Push final closeout
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
