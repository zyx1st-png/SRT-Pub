name: Governance Preflight

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repair-l0-local-burdens:
    if: github.event_name == 'pull_request' && github.head_ref == 'theory/post959-l0-thinning-20260913'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out PR head with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore valid L0 local burdens or refresh bundles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("Core_Law/SRT_L0_Metaphysics.md")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              if old in text:
                  text = text.replace(old, new, 1)
              elif new in text:
                  return
              else:
                  raise SystemExit(f"L0 repair anchor not found: {old[:120]!r}")

          replace_once(
              "**选择与推理的区分**：推理可以在一个已形成认知系统中展开、比较和排列可能性；primitive Selection 则是 actual differentiation 本身。历史上“推理→判断→决策→选择→承担→执行”的链条只描述一种上层认知情境，不定义 primitive Selection，也不得把承担或执行写进所有 Selection 的必要组成。",
              "**选择与推理的区分**：推理可以在一个已形成认知系统中展开、比较和排列可能性；primitive Selection 则是 actual differentiation 本身。历史上的“推理→判断→决策→选择→承担→执行”仍可作为一种上层认知链使用：推理展开可能性，判断赋权，决策收窄，选择使某一差异实际化，承担描述更强的后果绑定，执行把选择写入后续现实。但这条链只描述已形成认知系统中的一种组织方式，不定义 primitive Selection，也不得把承担或执行写进所有 Selection 的必要组成。"
          )

          replace_once(
              "**稳定**：不是超历史真理，也不是显现实在性的准入条件；而是反复选择沉积后形成的可复用历史结构。若主张 Stable ISP，还须满足其独立更强条件。",
              "**稳定**：不是超历史真理，也不是显现实在性的准入条件；而是反复选择沉积后形成的可复用历史结构。若主张 Stable ISP，还须满足 P1-T06 所登记的更强 standing 条件（同一过程、视角／历史承载与 continued selectability 等）；这些条件不反向定义第一次 actualisation，也不由本条自动推出。"
          )

          replace_once(
              "**意识**：L0 不提供意识的正面候选读法（见§五禁令式约束）。意识的全部正面理论内容依赖 L1 概念，已降级到 L1 文档。L0 只承诺三条禁令：意识不可被升格为 primitive Selection 的驱动者；不可被写成先于 Selection 的独立实体；上层展开不得违反 L0 正骨架。",
              "**意识**：L0 不提供意识的正面候选读法（见§五禁令式约束）。势差模型、结构性／生成性梯度、秩序缺口感知等正面候选内容仍由 L1 owners 承担；可参见 `Philosophy/SRT_Consciousness_Conditions.md` 与 `Philosophy/SRT_HardProblem_Epistemology.md`。L0 只承诺三条禁令：意识不可被升格为 primitive Selection 的驱动者；不可被写成先于 Selection 的独立实体；上层展开不得违反 L0 正骨架。"
          )

          replace_once(
              "**具身**：不是 primitive Selection 的前提，也不是 finite positionality 的同义词。在已经形成的系统里，具身可用于描述代价、后果回流、感知与行动约束如何进入该系统的实际 Selection；现有“关切范围 + 接地”语义保留为更强关系性描述，但不自动建立 typed Bearer、Concern、subject-position 或 phenomenality。其运作质量指标继续属于 L1 / formal owners。",
              "**具身**：不是 primitive Selection 的前提，也不是 finite positionality 的同义词。对已经形成的系统，既有更强语义继续保留：可用“关切范围 + 接地”描述某些连续性／可支付性条件如何以内生方式进入该系统的实际 Selection，以及行为后果如何回流并改变其后续选择空间；`κ_body > 0` 等指标继续只属于 L1 / formal owners 的运作质量描述。这里保留的是 formed-system 的 stronger relation，不是 universal admission gate：它不因名称中出现“关切”就自动建立本轮 typed Concern，也不自动建立 typed Bearer、subject-position 或 phenomenality。"
          )

          replace_once(
              "**ε（形式性不对称）**：保留其现有 L0 方向公设地位与历史形式化，但它不是 primitive Selection，也不等于 Oriented Openness 本身。post-#957 最低 non-flat modal burden 不预先裁决 ε 与 `κ₀`、不可撤回性之间的独立、依赖或约化关系。尤其：**ε 本身不自动建立 Concern、Bearer 或 subjecthood。** L1 仍可把 ε 驱动的选择积累模式回读命名为「秩序」；L0 本身不承载「秩序」作为内容性属性。",
              "**ε（形式性不对称）**：保留其现有 L0 **方向公设**与历史形式化，而不是把它删除成一个只剩名字的遗留项。现有 stronger local reading 仍可用 `B ≥ 2` / `B ≤ 1` 表达非自我抹除与自我抹除配置之间的结构摩擦差异：前者在 ε 路由下承受较低本体论摩擦、较可被接续，后者更脆弱。**负担不变：ε 是公设，不是定理。** 既有“经验充分性”对全局非任意性的收窄、“可提问性先验”对局部可持续性的收窄，以及 L1 场感知对 ε 内在可读性的讨论，继续属于各自原有层级。post-#957 的变化只在边界：ε 不是 primitive Selection，也不等于 Oriented Openness；它与 `κ₀`、不可撤回性的独立、依赖或约化关系继续 OPEN。过去把 ε 称作规范性的“论域地板”时，只能保留为**形式上的非自我抹除最低条件**，不得再读成“每一个 Selection 已经预设 typed Concern”。因此 **ε 本身不自动建立 Concern、Bearer 或 subjecthood。** L1 仍可把 ε 驱动的选择积累模式回读命名为「秩序」；L0 本身不承载「秩序」作为内容性属性。"
          )

          replace_once(
              "**承担**：保留为更强的后果关系术语，而不是所有 Selection 的定义成分。它不能仅凭“发生了动作”或“有因果后果”推出，也不再承担 primitive Selection 与主体选择之间的普遍分界定义。当前 typed Bearer 与实际“承担”的精确等价关系仍 OPEN；不得用本条绕过 P+E Bearer owner。",
              "**承担**：保留其既有的 **non-outsourcing / 后果不可完全外部化** 核心：当“由这个单位承担某后果”的关系被主张时，不能一边把该后果完全重分配给另一个单位，一边又声称原承担关系丝毫不变。它是更强的后果绑定关系，不是所有 Selection 的定义成分，也不能仅凭“发生了动作”或“有因果后果”推出；同时不再承担 primitive Selection 与主体选择之间的普遍分界定义。当前 typed Bearer 与实际“承担”的精确等价关系仍 OPEN；不得用本条绕过 P+E Bearer owner。"
          )

          replace_once(
              "**初心（B-A）**：L1 概念，不在 L0 术语裁决范围内。初心是 L1 对更强方向性结构在有限处境中显现结果的体验性／解释性命名。就初心这条关系而言，当前 canonical 不承认一个独立的 L0 内容性目标；若要重开，须新的作者裁决与独立准入检验。",
              "**初心（B-A）**：L1 概念，不在 L0 术语裁决范围内。既有 crosswalk 仍可把初心理解为有限处境中对 ε 或其他更强方向性结构之显现结果的体验性／解释性命名（包括“基础方向场”等 L1 表述）；这保留原来的上层研究内容，但不把 ε 改名为 Oriented Openness，也不为 L0 增加独立的内容性目标。若要重新主张一个独立 L0 前身，须新的作者裁决与独立准入检验。"
          )

          replace_once(
              "**秩序增益**：L1 概念（暂定锚——方向已定，逐条精确重写待完成）。四判据（可延续、可协调、不外包、可再选择）是 L1 对更强方向性结构在具体选择中是否被满足的展开衡量。全部内容见 L1 owner。",
              "**秩序增益**：L1 概念（暂定锚——方向已定，逐条精确重写待完成）。既有四判据继续保留：**可延续、可协调、不外包、可再选择**；其中“不外包”关注后果回流通道完整性。它们是 L1 对更强方向性结构在具体选择中是否被满足的展开衡量，不是 primitive Selection 的组成部分。前向判据、时间结算与 L2 分叉等细节继续见 `Core_Law/SRT_Selection_Argument.md §7b`。"
          )

          replace_once(
              "**遮蔽**：不是认识论的错误；而是有限位置可能产生的结构性视域限制。对 formed / embodied 系统而言，这种受限可以自我强化并锁定；遮蔽动力学的 A/B 分期、阈值、干预窗口等仍属于 L1。finite positionality 本身不自动建立具身、Concern 或主体性。",
              "**遮蔽**：不是认识论的错误；最低层只承认 finite positionality 会带来结构性视域受限。更强的 Occlusion 范畴继续只适用于已经形成、具备相关 embodied / historical organization 的位置：在这类系统里，受限视域可以通过不可撤回历史与代价结构自我强化并锁定；A/B 分期、`d_c` 阈值、缺口感知、干预窗口、解耦触发等动力学仍属于 L1 owners。**finite positionality 本身不自动建立具身、Concern 或主体性。**\n\n> **claim-level guard（保留）**：此前“当前架构下的 LLM 属零算子／伪锚定候选”的 repo 判断继续只是一条边界／bridge 层 P3 判定，不是 L0 定理。它依赖当前架构、接地／stake 解释与 `Ψ_f` 代理，不构成对未来人工架构的终局排除；相关范围护栏继续由 `_SRT_SYMBOL_TABLE.md` Usage Rule 5/9、`AI/Ontology_Annex/00_General_Boundary_Block.md` 与 `Core/SRT_OPEN_TENSIONS.md §6` 承担。本轮 L0 thinning 不撤销这项 claim-level 更正。"
          )

          replace_once(
              "**死亡**：不是把既有事件改写为从未发生；而是维持某一历史承载过程的收敛条件被破坏、代价不可支付、稳态解锚。个体不再作为同一过程持续，不因此把此前 genuine Selection 改写为未发生。",
              "**死亡**：不是把既有事件改写为从未发生；而是维持某一历史承载过程的收敛条件被破坏、代价不可支付、稳态解锚。个体不再作为同一过程持续，不因此把此前 genuine Selection 改写为未发生。若某些选择痕迹此前已经**实际锚定**进集体稳定域，它们也不会仅因个体死亡而被追溯删除；但这是一条以已建立锚定为前提的下游陈述，不能反过来证明每次 Selection 都自动留下 durable collective trace。"
          )

          replace_once(
              "**委托**：当一个已形成选择系统将部分选择权转移给另一个系统时，形成委托关系。其工具型 / 委托型区分、共同目标与健康 / 病态判据均属下游组织与规范分析，不定义 primitive Selection。",
              "**委托**：当一个已形成选择系统将部分选择权转移给另一个系统时，形成委托关系。既有两类区分继续有效：**工具型代理**中委托者保留选择权、代理者主要执行；**委托型代理**中一定范围的选择权被实际转移。健康委托继续关注共同目标是否被维护、委托者的再选择能力是否保留；病态委托则包括代理系统把自身维持伪装成共同目标等结构。这些均属下游组织与规范分析，不定义 primitive Selection，也不自动建立 subjecthood。"
          )

          replace_once(
              "**共同目标**：L1 概念。其判据依赖 L1 的「秩序增益」，见 L1 文档。",
              "**共同目标**：L1 概念（暂定锚）。其判据依赖 L1 的「秩序增益」以及参与位置的再选择能力与后果结构；本轮只保留该下游归属，不把它提升为 L0 primitive。"
          )

          replace_once(
              "**正当性**：L1 概念。其判据依赖 L1 的「共同目标」，见 L1 文档。",
              "**正当性**：L1 概念（暂定锚）。其判据继续依赖 L1 的「共同目标」及相应的选择／后果关系；不由 primitive Selection 本身推出。"
          )

          replace_once(
              "**神圣感**：L1 概念。其全部内容依赖 L1 的「初心」和「秩序」，见 L1 文档。",
              "**神圣感**：L1 概念。既有“与初心方向共振、震悚标记、可能伴随 d 扩张”等研究内容继续归 L1 展开；这些表述依赖「初心」「秩序」及其下游解释，不属于 L0 minimum，也不由本轮 Oriented Openness 直接推出。"
          )

          path.write_text(text, encoding="utf-8")
          PY

          if ! git diff --quiet -- Core_Law/SRT_L0_Metaphysics.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Core_Law/SRT_L0_Metaphysics.md
            git commit -m "theory: restore valid L0 local burdens after thinning"
            git push origin HEAD:${{ github.head_ref }}
            exit 0
          fi

          uv run python scripts/build_srt_context_bundles.py
          if ! git diff --quiet -- Operations/Context_Bundles; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Operations/Context_Bundles
            git commit -m "chore: refresh context bundles after L0 burden repair"
            git push origin HEAD:${{ github.head_ref }}
          fi

  governance-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history is required for changed-file attribution, base-health
          # comparison, baseline monotonicity, and context-bundle provenance.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check base main governance health
        id: base_governance
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          base_ref="origin/${{ github.base_ref }}"
          rm -rf /tmp/srt-governance-base
          trap 'git worktree remove --force /tmp/srt-governance-base >/dev/null 2>&1 || true' EXIT
          git worktree add --detach /tmp/srt-governance-base "$base_ref"
          (
            cd /tmp/srt-governance-base
            uv run python scripts/refresh_split_metadata.py --check
            uv run python scripts/governance_preflight.py \
              --skip-write-report \
              --strict-split-metadata
          ) 2>&1 | tee base-governance-preflight.log

      - name: Check PR-local frontmatter
        id: pr_frontmatter
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/check_frontmatter_changed.py \
            --base-ref "origin/${{ github.base_ref }}" \
            --baseline Governance/Frontmatter_Warning_Baseline.txt \
            --fail-on-new-warnings \
            --suggest-fixes 2>&1 | tee pr-frontmatter.log

      - name: Enforce frontmatter baseline monotonicity
        id: baseline_monotonic
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASELINE_EXPANSION_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'governance-baseline-expansion-approved') }}
        run: |
          set -o pipefail
          args=(
            --base-ref "origin/${{ github.base_ref }}"
            --baseline Governance/Frontmatter_Warning_Baseline.txt
          )
          if [[ "$BASELINE_EXPANSION_APPROVED" == "true" ]]; then
            args+=(--allow-added)
          fi
          uv run python scripts/check_frontmatter_baseline_monotonic.py "${args[@]}" \
            2>&1 | tee baseline-monotonic.log

      - name: Check split metadata freshness
        run: uv run python scripts/refresh_split_metadata.py --check

      - name: Run governance preflight
        id: full_preflight
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/governance_preflight.py \
            --skip-write-report \
            --strict-split-metadata 2>&1 | tee governance-preflight.log

      - name: Classify governance result
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_OUTCOME: ${{ steps.base_governance.outcome }}
          LOCAL_OUTCOME: ${{ steps.pr_frontmatter.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline_monotonic.outcome }}
          FULL_OUTCOME: ${{ steps.full_preflight.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def outcome(name: str) -> str:
              value = os.environ.get(name, "").strip()
              return value or "not-run"

          event_name = outcome("EVENT_NAME")
          base = outcome("BASE_OUTCOME")
          local = outcome("LOCAL_OUTCOME")
          baseline = outcome("BASELINE_OUTCOME")
          full = outcome("FULL_OUTCOME")

          if event_name != "pull_request":
              scope = "main_push"
              disposition = "inspect_full_preflight"
              verdict = "MAIN PUSH CHECK — inspect the full preflight result."
          elif local == "failure":
              scope = "pr_local"
              disposition = "do_not_merge"
              verdict = "PR_LOCAL / LOCAL DIRTY / DO NOT MERGE."
          elif baseline == "failure":
              scope = "baseline_expansion"
              disposition = "do_not_merge"
              verdict = "PR_LOCAL BASELINE DEBT EXPANSION / DO NOT MERGE."
          elif base == "failure" and full == "success":
              scope = "base_main_repaired"
              disposition = "governance_hotfix_only"
              verdict = "BASE_MAIN WAS BLOCKED; THIS PR REPAIRS IT / HOTFIX PATH."
          elif base == "failure":
              scope = "base_main"
              disposition = "governance_hotfix_only"
              verdict = "BASE_MAIN BLOCKED / HOTFIX ONLY."
          elif full == "failure":
              scope = "merged_repository_or_infrastructure"
              disposition = "do_not_merge"
              verdict = "LOCAL FRONTMATTER CLEAN; FULL REPOSITORY OR INFRA FAILURE / DO NOT MERGE."
          else:
              scope = "none"
              disposition = "normal_merge"
              verdict = "LOCAL CLEAN / MAIN HEALTHY / NORMAL MERGE."

          payload = {
              "schema_version": 1,
              "event_name": event_name,
              "failure_scope": scope,
              "merge_disposition": disposition,
              "base_main_health": base,
              "pr_local_frontmatter": local,
              "baseline_monotonicity": baseline,
              "merged_repository_preflight": full,
              "verdict": verdict,
          }
          Path("governance-attribution.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## Governance failure attribution\n\n")
              handle.write("| Scope | Outcome |\n")
              handle.write("|---|---|\n")
              handle.write(f"| base_main_governance | {base} |\n")
              handle.write(f"| pr_local_frontmatter | {local} |\n")
              handle.write(f"| baseline_monotonicity | {baseline} |\n")
              handle.write(f"| merged_repository_preflight | {full} |\n\n")
              handle.write(f"**Verdict:** {verdict}\n")

          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Upload governance preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-preflight-diagnostics
          path: |
            governance-preflight.log
            base-governance-preflight.log
            pr-frontmatter.log
            baseline-monotonic.log
            governance-attribution.json
          if-no-files-found: warn
          retention-days: 14
