name: Governance Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  governance-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply final-review RC-A repair
        run: python scripts/_temp_rca_final_review_fix.py

      - name: Refresh split metadata
        run: uv run python scripts/refresh_split_metadata.py

      - name: Remove temporary machinery and restore workflow
        shell: bash
        run: |
          rm -f scripts/_temp_rca_final_review_fix.py
          git show origin/main:.github/workflows/governance-preflight.yml > .github/workflows/governance-preflight.yml

      - name: Regenerate context bundles
        run: uv run python scripts/build_srt_context_bundles.py

      - name: Verify generated surfaces and governance
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/refresh_split_metadata.py --check
          uv run python scripts/build_srt_context_bundles.py --check
          uv run python scripts/governance_preflight.py --skip-write-report --strict-split-metadata
          git diff --check

      - name: Build strengthened final-review inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          terms = [
              "真实重选率",
              "共选真实性",
              "真实共选",
              "r^{(n→n+1)}",
              "r^{(n\\to n+1)}",
              "r^{coll}",
              "真实选择时刻",
          ]
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          rows = []
          read_errors = 0
          scanned = 0
          for raw in tracked:
              if not raw:
                  continue
              p = Path(raw.decode("utf-8", errors="surrogateescape"))
              if not p.is_file() or p.is_symlink():
                  continue
              try:
                  data = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              scanned += 1
              for lineno, line in enumerate(data.splitlines(), 1):
                  hits = [t for t in terms if t in line]
                  if hits:
                      rows.append((str(p), lineno, hits, line))
          out = Path("rca-final-review-strengthened-inventory.txt")
          with out.open("w", encoding="utf-8") as f:
              f.write(f"tracked={len([x for x in tracked if x])}\n")
              f.write(f"text_scanned={scanned}\n")
              f.write(f"read_errors={read_errors}\n")
              f.write(f"hits={len(rows)}\n\n")
              for path, lineno, hits, line in rows:
                  f.write(f"{path}:{lineno}: {','.join(hits)} :: {line}\n")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Commit functional repair and restored workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zyx1st-png"
          git config user.email "zyx1st@gmail.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No functional changes to commit"
            exit 1
          fi
          git commit -m "Close final RC-A review gaps"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload strengthened inventory
        uses: actions/upload-artifact@v4
        with:
          name: rc-a-final-review-strengthened-inventory
          path: rca-final-review-strengthened-inventory.txt
          retention-days: 14
