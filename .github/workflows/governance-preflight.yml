name: Governance Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-post903-hardening-bundles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target hardening branch
        uses: actions/checkout@v4
        with:
          ref: governance/post903-canonical-hardening-20260905
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rebuild deterministic context bundles
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/build_srt_context_bundles.py

      - name: Commit regenerated bundles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Operations/Context_Bundles; then
            echo "No context bundle changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Operations/Context_Bundles
          git commit -m "Regenerate context bundles after post-903 hardening"
          git push origin HEAD:governance/post903-canonical-hardening-20260905
