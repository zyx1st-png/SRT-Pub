name: Governance Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  wave-b-exact-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact Wave B semantic replacements
        run: python scripts/tmp_wave_b_selection_totality_patch.py

      - name: Commit exact Wave B owner edits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core/SRT_Core_01_Axioms.md Core/SRT_Core_12a_Ontology_L0L1.md Core_Law/SRT_Reference_Axioms.md Core_Law/SRT_Reference_Ontology.md Core_Law/SRT_Reference_Dynamics.md
          git diff --cached --check
          git commit -m "land Selection-totality Wave B owner retyping"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
