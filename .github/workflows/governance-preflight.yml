          replace_once("03_Bridges/SRT_Book_Vocabulary_Theory_Sync_Bridge_2026-07-05.md", "| 三 | **能动性（第三态）** | `P1-T05` + 承担 | ⚑（第三态框架新，见 §2.5） |", "| 三 | **能动性（第三态）** | RC-A Agency / Automation Guard（P2/P3）+ 承担 | ⚑（第三态框架新，见 §2.5） |")
          replace_once("03_Bridges/SRT_Book_Vocabulary_Theory_Sync_Bridge_2026-07-05.md", "- **理论锚点**：`P1-T05` 真实选择时刻 + 承担闭合（`Eq-Evo-03b` 的 `δθ/δσ ≠ 0`）。「第三态」框架（自由意志与机械反馈之间的第三类）是对 P1-T05 的**新articulation**，理论层未以此对立结构登记。", "- **理论锚点（RC-A superseded reading）**：第三态能动性不再回链 `P1-T05`；其 anti-script / consequence-sensitive revision 部分只接 RC-A Agency / Automation Guard（P2/P3），承担闭合（`Eq-Evo-03b` 的 `δθ/δσ ≠ 0`）仍按原层级单独审计。「第三态」是 downstream articulation，不是 Selection 定义。")
          replace_once("03_Bridges/SRT_Book_Vocabulary_Theory_Sync_Bridge_2026-07-05.md", "- **登记等级**：P2 canonical interpretation。「程度而非有无」与 d-value 的连续谱一致，可登记为 P1-T05 的 domain 读法。", "- **登记等级**：P2 canonical interpretation。「程度而非有无」可作为 downstream agency / bearer 读法，但不得登记为 former P1-T05 的 domain reading，也不得反推 Selection occurrence。")
          replace_once("03_Bridges/SRT_Book_Vocabulary_Theory_Sync_Bridge_2026-07-05.md", "- **边界**：不得把「第三态」升格为新公理或第三种本体力；它是 P1-T05 + 承担的白话对立面命名，origin-of-selectability 仍受 `P0-04` 暴露点约束（能动性从回流\"长出\"不等于解决了可选择性起源）。", "- **边界**：不得把「第三态」升格为新公理或第三种本体力；它只是 downstream agency / bearer 层的白话对立面命名，不能替代 Selection ontology。origin-of-selectability 仍受 `P0-04` 暴露点约束（能动性从回流\"长出\"不等于解决了可选择性起源）。")
          replace_once("03_Bridges/SRT_Book_Vocabulary_Theory_Sync_Bridge_2026-07-05.md", "| 第三态能动性 | `Core/SRT_Core_21b P1-T05` 补一条 domain-reading 注（第三态框架） | 低-中（未做） |", "| 第三态能动性 | RC-A 后不再向 `Core_21b` former P1-T05 补 domain reading；如需施工只进入 P2/P3 Agency / Automation Guard 或相应 bearer bridge | 低-中（RC-A 改路由） |")

