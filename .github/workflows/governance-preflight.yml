name: Governance Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-cycle1-bundles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target Cycle 1 branch
        uses: actions/checkout@v4
        with:
          ref: theory/author-reentry-cycle1-one-formation-20260905
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild deterministic context bundles
        shell: bash
        run: |
          python scripts/build_srt_context_bundles.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Operations/Context_Bundles
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate context bundles for Author Re-entry Cycle 1 bootstrap'
            git push origin HEAD:theory/author-reentry-cycle1-one-formation-20260905
          fi