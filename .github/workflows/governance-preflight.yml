name: Governance Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  governance-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: theory/author-reentry-governance-correction-20260905
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerate deterministic context bundles
        run: uv run python scripts/build_srt_context_bundles.py --generated-date 2026-09-05

      - name: Commit regenerated bundles to target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Operations/Context_Bundles
          if git diff --cached --quiet; then
            echo "No generated bundle changes to commit."
            exit 0
          fi
          git commit -m "Refresh context bundles after author re-entry governance correction"
          git push origin HEAD:theory/author-reentry-governance-correction-20260905
