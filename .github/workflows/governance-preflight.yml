name: Governance Preflight

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  post970-status-closeout:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/post970-one-landing-closeout-20260913'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Truth up STATUS after One Formation landing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('STATUS.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '#961 已完成第二只 post-#957 bounded owner landing：L0 targeted thinning。下一只 bounded owner cycle 指向 One Formation，但尚未开启 canonical edit。',
                  '#961 已完成第二只 post-#957 bounded owner landing：L0 targeted thinning。#970 已完成第三只 bounded owner landing：One Formation vertical-reconstitution semantics。post-#970 whole-spine consistency review 判定 L0 / Bearer / Stable ISP / Individuation 不因本轮自动触发 canonical edit；下一 bounded work 指向 Generative Ontology Spine 的小型 post-One 同步审议。'
              ),
              (
                  '#961 L0 targeted thinning = MERGED / 5591c793cd985729a228a22da3a3c8c5fb7a7453\n',
                  '#961 L0 targeted thinning = MERGED / 5591c793cd985729a228a22da3a3c8c5fb7a7453\n#969 vertical-background author checkpoint = MERGED / 345412f627acd17cf0185547b48e34791cd0a9d4\n#970 One Formation vertical-reconstitution landing = MERGED / 0b4ba7dd6a818b70e8cebd7b7f4c681218ef5606\n'
              ),
              (
                  'SECOND BOUNDED OWNER LANDING = COMPLETE IN #961 / L0 METAPHYSICS\nNEXT TARGET OWNER = `Core_Law/SRT_One_Formation.md` / OWNER CYCLE NOT YET OPEN',
                  'SECOND BOUNDED OWNER LANDING = COMPLETE IN #961 / L0 METAPHYSICS\nTHIRD BOUNDED OWNER LANDING = COMPLETE IN #970 / ONE FORMATION\nNEXT BOUNDED WORK PACKAGE = `Core_Law/SRT_Generative_Ontology_Spine.md` / POST-#970 BOUNDED SYNC REVIEW / NOT YET OPEN'
              ),
              (
                  'current L0 scope audit = `Operations/Audits/SRT_POST959_L0_THINNING_LANDING_SCOPE_2026-09-13.md`',
                  'current One landing audit = `Operations/Audits/SRT_ONE_FORMATION_VERTICAL_RECONSTITUTION_CANONICAL_LANDING_SCOPE_2026-09-13.md`\npost-One consistency review = `Operations/Audits/SRT_POST970_ONE_LANDING_WHOLE_SPINE_CONSISTENCY_REVIEW_2026-09-13.md`'
              ),
              (
                  'local One / Selection-position owner = `Core_Law/SRT_One_Formation.md`',
                  'local One / Selection-position owner = `Core_Law/SRT_One_Formation.md` / post-#970 v1 landed'
              ),
              (
                  'The universal formation route now stops at **One**. `Core_Law/SRT_One_Formation.md` remains the local owner for detailed One / Selection-position semantics until its later bounded landing; it may not restore Selection-position as a second universal endpoint merely by local wording.',
                  'The universal formation route now stops at **One**. `Core_Law/SRT_One_Formation.md` is now the post-#970 v1 local owner for detailed One / Selection-position semantics; formed `Selection-position` remains the operative co-aspect of an already formed One and is not a second universal endpoint.'
              ),
          ]

          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'Neither old nor new STATUS form found: {old[:80]!r}')

          if 'NEXT TARGET OWNER = `Core_Law/SRT_One_Formation.md` / OWNER CYCLE NOT YET OPEN' in text:
              raise SystemExit('stale One next-owner routing remains')
          if 'until its later bounded landing' in text:
              raise SystemExit('stale pre-One landing wording remains')

          if changed:
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit STATUS when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATUS.md
          if git diff --cached --quiet; then
            echo 'STATUS already post-970 current.'
            exit 0
          fi
          git commit -m 'ops: close out One Formation landing in STATUS'
          git push origin HEAD:${{ github.head_ref }}

  governance-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history is required for changed-file attribution, base-health
          # comparison, baseline monotonicity, and context-bundle provenance.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check base main governance health
        id: base_governance
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          base_ref="origin/${{ github.base_ref }}"
          rm -rf /tmp/srt-governance-base
          trap 'git worktree remove --force /tmp/srt-governance-base >/dev/null 2>&1 || true' EXIT
          git worktree add --detach /tmp/srt-governance-base "$base_ref"
          (
            cd /tmp/srt-governance-base
            uv run python scripts/refresh_split_metadata.py --check
            uv run python scripts/governance_preflight.py \
              --skip-write-report \
              --strict-split-metadata
          ) 2>&1 | tee base-governance-preflight.log

      - name: Check PR-local frontmatter
        id: pr_frontmatter
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/check_frontmatter_changed.py \
            --base-ref "origin/${{ github.base_ref }}" \
            --baseline Governance/Frontmatter_Warning_Baseline.txt \
            --fail-on-new-warnings \
            --suggest-fixes 2>&1 | tee pr-frontmatter.log

      - name: Enforce frontmatter baseline monotonicity
        id: baseline_monotonic
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASELINE_EXPANSION_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'governance-baseline-expansion-approved') }}
        run: |
          set -o pipefail
          args=(
            --base-ref "origin/${{ github.base_ref }}"
            --baseline Governance/Frontmatter_Warning_Baseline.txt
          )
          if [[ "$BASELINE_EXPANSION_APPROVED" == "true" ]]; then
            args+=(--allow-added)
          fi
          uv run python scripts/check_frontmatter_baseline_monotonic.py "${args[@]}" \
            2>&1 | tee baseline-monotonic.log

      - name: Check split metadata freshness
        run: uv run python scripts/refresh_split_metadata.py --check

      - name: Run governance preflight
        id: full_preflight
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/governance_preflight.py \
            --skip-write-report \
            --strict-split-metadata 2>&1 | tee governance-preflight.log

      - name: Classify governance result
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_OUTCOME: ${{ steps.base_governance.outcome }}
          LOCAL_OUTCOME: ${{ steps.pr_frontmatter.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline_monotonic.outcome }}
          FULL_OUTCOME: ${{ steps.full_preflight.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def outcome(name: str) -> str:
              value = os.environ.get(name, "").strip()
              return value or "not-run"

          event_name = outcome("EVENT_NAME")
          base = outcome("BASE_OUTCOME")
          local = outcome("LOCAL_OUTCOME")
          baseline = outcome("BASELINE_OUTCOME")
          full = outcome("FULL_OUTCOME")

          if event_name != "pull_request":
              scope = "main_push"
              disposition = "inspect_full_preflight"
              verdict = "MAIN PUSH CHECK — inspect the full preflight result."
          elif local == "failure":
              scope = "pr_local"
              disposition = "do_not_merge"
              verdict = "PR_LOCAL / LOCAL DIRTY / DO NOT MERGE."
          elif baseline == "failure":
              scope = "baseline_expansion"
              disposition = "do_not_merge"
              verdict = "PR_LOCAL BASELINE DEBT EXPANSION / DO NOT MERGE."
          elif base == "failure" and full == "success":
              scope = "base_main_repaired"
              disposition = "governance_hotfix_only"
              verdict = "BASE_MAIN WAS BLOCKED; THIS PR REPAIRS IT / HOTFIX PATH."
          elif base == "failure":
              scope = "base_main"
              disposition = "governance_hotfix_only"
              verdict = "BASE_MAIN BLOCKED / HOTFIX ONLY."
          elif full == "failure":
              scope = "merged_repository_or_infrastructure"
              disposition = "do_not_merge"
              verdict = "LOCAL FRONTMATTER CLEAN; FULL REPOSITORY OR INFRA FAILURE / DO NOT MERGE."
          else:
              scope = "none"
              disposition = "normal_merge"
              verdict = "LOCAL CLEAN / MAIN HEALTHY / NORMAL MERGE."

          payload = {
              "schema_version": 1,
              "event_name": event_name,
              "failure_scope": scope,
              "merge_disposition": disposition,
              "base_main_health": base,
              "pr_local_frontmatter": local,
              "baseline_monotonicity": baseline,
              "merged_repository_preflight": full,
              "verdict": verdict,
          }
          Path("governance-attribution.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## Governance failure attribution\n\n")
              handle.write("| Scope | Outcome |\n")
              handle.write("|---|---|\n")
              handle.write(f"| base_main_governance | {base} |\n")
              handle.write(f"| pr_local_frontmatter | {local} |\n")
              handle.write(f"| baseline_monotonicity | {baseline} |\n")
              handle.write(f"| merged_repository_preflight | {full} |\n\n")
              handle.write(f"**Verdict:** {verdict}\n")

          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Upload governance preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-preflight-diagnostics
          path: |
            governance-preflight.log
            base-governance-preflight.log
            pr-frontmatter.log
            baseline-monotonic.log
            governance-attribution.json
          if-no-files-found: warn
          retention-days: 14
