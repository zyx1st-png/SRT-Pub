        run: git show origin/main:.github/workflows/governance-preflight.yml > .github/workflows/governance-preflight.yml

      - name: Regenerate context bundles from cleaned sources
        run: uv run python scripts/build_srt_context_bundles.py

      - name: Verify regenerated context bundles
        run: uv run python scripts/build_srt_context_bundles.py --check

      - name: Build final exhaustive inventory
        shell: bash
        run: |
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = [p.decode("utf-8", errors="surrogateescape") for p in raw.split(b"\0") if p]
          texts, nonregular, binary, errors = {}, [], [], []
          for path in paths:
              p = Path(path)
              if p.is_symlink() or not p.is_file(): nonregular.append(path); continue
              try: data = p.read_bytes()
              except OSError as exc: errors.append({"path":path,"error":repr(exc)}); continue
              if b"\0" in data: binary.append(path); continue
              texts[path] = data.decode("utf-8", errors="replace")
          def linehits(rx):
              return [{"path":p,"line":i,"text":line} for p,t in texts.items() for i,line in enumerate(t.splitlines(),1) if rx.search(line)]
          def both(a,b):
              out=[]
              for p,t in texts.items():
                  if a.search(t) and b.search(t):
                      out += [{"path":p,"line":i,"text":line} for i,line in enumerate(t.splitlines(),1) if a.search(line) or b.search(line)]
              return out
          fam={
            "F1_P1_T05": linehits(re.compile(r"P1-T05",re.I)),
            "F2_Real_Choice_Moment": linehits(re.compile(r"Real\s+Choice\s+Moment",re.I)),
            "F3_real_live_active_choice": linehits(re.compile(r"\b(?:real|live|active)\s+choice\b",re.I)),
            "F4_zh_real_live_L2_substitute": linehits(re.compile(r"真实选择|活选择|L2\s*替代选择",re.I)),
          }
          no_sel=re.compile(r"\bno\s+Selection\b",re.I)
          for tok in ("script","habit","automation","gradient"):
              fam[f"F5_{tok}_plus_no_Selection"]=both(re.compile(rf"\b{tok}\w*\b",re.I),no_sel)
          fam["F6_CG_plus_P1_T05"]=both(re.compile(r"\bCG(?:[-_0-9]|\b)",re.I),re.compile(r"P1-T05",re.I))
          fam["F7_T_dir_plus_real_live_choice"]=both(re.compile(r"T[_\\]?[{]?dir[}]?",re.I),re.compile(r"\b(?:real|live)\s+choice\b|真实选择|活选择",re.I))
          fam["F8_global_r_t_literal"]=linehits(re.compile(r"(?<![A-Za-z0-9_])r\(t\)(?![A-Za-z0-9_])"))
          summary={k:{"hit_count":len(v),"file_count":len({h['path'] for h in v}),"hits":v} for k,v in fam.items()}
          report={"snapshot_kind":"final working tree before closure commit","base_head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"tracked_paths":len(paths),"text_files_scanned":len(texts),"binary_files_skipped":len(binary),"nonregular_or_symlink_paths_skipped":len(nonregular),"skipped_nonregular_paths":nonregular,"read_errors":errors,"families":summary}
          Path("rc-a-final-inventory.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          with Path("rc-a-final-inventory.txt").open("w",encoding="utf-8") as f:
              f.write(f"base_head {report['base_head']}\ntracked_paths {len(paths)}\ntext_files_scanned {len(texts)}\nread_errors {len(errors)}\n\n")
              for k,v in summary.items():
                  f.write(f"## {k}: hits={v['hit_count']} files={v['file_count']}\n")
                  for h in v['hits']: f.write(f"{h['path']}:{h['line']}:{h['text']}\n")
                  f.write("\n")
          if errors: raise SystemExit(f"inventory incomplete: {len(errors)} read errors")
          PY

      - name: Commit cleaned sources, bundles, and restored workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- rc-a-final-inventory.json rc-a-final-inventory.txt || true
          git diff --cached --check
          git commit -m "Complete RC-A exhaustive semantic sync and refresh bundles"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "committed_head=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Attach committed head to inventory
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("rc-a-final-inventory.json")
          d=json.loads(p.read_text(encoding="utf-8")); d["committed_head"]=os.environ["committed_head"]
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          with Path("rc-a-final-inventory.txt").open("a",encoding="utf-8") as f: f.write(f"committed_head {os.environ['committed_head']}\n")
          PY

      - name: Upload final RC-A inventory
        uses: actions/upload-artifact@v4
        with:
          name: rc-a-final-exhaustive-inventory
          path: |
            rc-a-final-inventory.json
            rc-a-final-inventory.txt
          if-no-files-found: error
          retention-days: 7
