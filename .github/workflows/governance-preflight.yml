name: Governance Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  claude-review-fix:
    if: github.event.pull_request.head.ref == 'theory/author-reentry-governance-correction-20260905'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: theory/author-reentry-governance-correction-20260905
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply Claude review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) Restore the material completeness attestation lost during template v2 rewrite.
          replace_once(
              "Operations/Templates/SRT_DOMAIN_RECONSTRUCTION_FRAMEWORK_TEMPLATE.md",
              """### 9.3 Source/synthesis/discrimination separation
""",
              """### 9.3 Material completeness statement

Write a short explicit statement:

```text
All domain-relevant active high/very-high SourceCards identified in the checked surfaces
have a visible disposition in this framework: integrated, routed, deferred-with-blocker,
or excluded-with-reason.
```

If not true, name what remains unpaid.

### 9.4 Source/synthesis/discrimination separation
""",
          )

          # 2) Close the explicit authorization chain for reopening the identity freeze.
          replace_once(
              "Governance/SRT_GOV_AUTHOR_REENTRY_ONTOLOGY_RECONSTRUCTION_AMENDMENT_2026-09-05.md",
              """This amendment changes **programme sequencing and interpretation**, not canonical ontology definitions.

---
""",
              """This amendment changes **programme sequencing and interpretation**, not canonical ontology definitions.

### 0.1 Reopen authority

This amendment is an authorized identity reopen under
`Operations/Proposals/SRT_CONSTITUTION_DOMAIN_RECONSTRUCTION_BLUEPRINT_2026-08-29.md §12`,
condition **#4**:

> the author explicitly reopens the identity after reviewing evidence from the cycle.

The 2026-09-05 author correction is that explicit reopen after review of the first
Neuroscience pilot and the ongoing Epistemology pilot. Condition #4 is sufficient for
this governance action. This amendment does **not** claim that §12 condition #2 has
independently completed, because the second well remains an open bounded pilot rather
than a completed second deep-well verdict.

---
""",
          )

          # 3) Synchronize the bootstrap status surface so the repository has one current truth.
          status = "STATUS.md"
          replacements = [
              ("updated: 2026-09-04", "updated: 2026-09-05"),
              ("> **最后更新**：2026-09-04", "> **最后更新**：2026-09-05"),
              (
                  "> **当前作者级方向**：`Operations/Proposals/SRT_CONSTITUTION_DOMAIN_ARCHITECTURE_V2_2026-09-04.md`",
                  "> **当前作者级方向**：`01_Source_Intuition/SRT_AUTHOR_REENTRY_CORRECTION_2026-09-05.md`",
              ),
              (
                  "> **当前执行计划**：`Operations/Proposals/SRT_CONSTITUTION_DOMAIN_EXECUTION_PLAN_2026-08-29.md`",
                  "> **当前执行计划**：`Governance/SRT_GOV_AUTHOR_REENTRY_ONTOLOGY_RECONSTRUCTION_AMENDMENT_2026-09-05.md §4–§11`",
              ),
              (
                  "> **当前治理**：`Governance/SRT_GOV_CONSTITUTION_DOMAIN_RECONSTRUCTION_2026-08-29.md`",
                  "> **当前治理**：`Governance/SRT_GOV_AUTHOR_REENTRY_ONTOLOGY_RECONSTRUCTION_AMENDMENT_2026-09-05.md`",
              ),
              (
                  "> **作者源直觉**：`01_Source_Intuition/SRT_CONSTITUTION_IDENTITY_AUTHOR_TRACE_2026-08-29.md`",
                  "> **作者源直觉**：`01_Source_Intuition/SRT_AUTHOR_REENTRY_CORRECTION_2026-09-05.md`",
