name: Governance Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  governance-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerate context bundles
        run: uv run python scripts/build_srt_context_bundles.py

      - name: Verify regenerated context bundles
        run: uv run python scripts/build_srt_context_bundles.py --check

      - name: Run RC-A exhaustive tracked-file inventory
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = [p.decode("utf-8", errors="surrogateescape") for p in raw.split(b"\0") if p]

          texts = {}
          skipped_binary = []
          skipped_nonregular = []
          read_errors = []
          for path in paths:
              p = Path(path)
              if p.is_symlink() or not p.is_file():
                  skipped_nonregular.append(path)
                  continue
              try:
                  data = p.read_bytes()
              except OSError as exc:
                  read_errors.append({"path": path, "error": repr(exc)})
                  continue
              if b"\0" in data:
                  skipped_binary.append(path)
                  continue
              texts[path] = data.decode("utf-8", errors="replace")

          def line_hits(rx):
              hits = []
              for path, text in texts.items():
                  for lineno, line in enumerate(text.splitlines(), 1):
                      if rx.search(line):
                          hits.append({"path": path, "line": lineno, "text": line})
              return hits

          def file_conjunction_hits(rx_a, rx_b):
              hits = []
              for path, text in texts.items():
                  if not (rx_a.search(text) and rx_b.search(text)):
                      continue
                  for lineno, line in enumerate(text.splitlines(), 1):
                      if rx_a.search(line) or rx_b.search(line):
                          hits.append({"path": path, "line": lineno, "text": line})
              return hits

          families = {}
          simple = {
              "F1_P1_T05": re.compile(r"P1-T05", re.I),
              "F2_Real_Choice_Moment": re.compile(r"Real\s+Choice\s+Moment", re.I),
              "F3_real_live_active_choice": re.compile(r"\b(?:real|live|active)\s+choice\b", re.I),
              "F4_zh_real_live_L2_substitute": re.compile(r"真实选择|活选择|L2\s*替代选择", re.I),
          }
          for name, rx in simple.items():
              families[name] = line_hits(rx)

          no_sel = re.compile(r"\bno\s+Selection\b", re.I)
          for token in ("script", "habit", "automation", "gradient"):
              families[f"F5_{token}_plus_no_Selection"] = file_conjunction_hits(
                  re.compile(rf"\b{token}\w*\b", re.I), no_sel
              )

          families["F6_CG_plus_P1_T05"] = file_conjunction_hits(
              re.compile(r"\bCG(?:[-_0-9]|\b)", re.I), re.compile(r"P1-T05", re.I)
          )
          families["F7_T_dir_plus_real_live_choice"] = file_conjunction_hits(
              re.compile(r"T[_\\]?[{]?dir[}]?", re.I),
              re.compile(r"\b(?:real|live)\s+choice\b|真实选择|活选择", re.I),
          )

          summary = {}
          for name, hits in families.items():
              summary[name] = {
                  "hit_count": len(hits),
                  "file_count": len({h["path"] for h in hits}),
                  "hits": hits,
              }

          report = {
              "snapshot_kind": "PR head branch",
              "head": head,
              "tracked_paths": len(paths),
              "text_files_scanned": len(texts),
              "binary_files_skipped": len(skipped_binary),
              "nonregular_or_symlink_paths_skipped": len(skipped_nonregular),
              "skipped_nonregular_paths": skipped_nonregular,
              "read_errors": read_errors,
              "families": summary,
          }

          Path("rc-a-exhaustive-inventory.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          with Path("rc-a-exhaustive-inventory.txt").open("w", encoding="utf-8") as out:
              out.write(f"snapshot_kind PR head branch\nHEAD {head}\n")
              out.write(f"tracked_paths {len(paths)}\ntext_files_scanned {len(texts)}\n")
              out.write(f"binary_files_skipped {len(skipped_binary)}\n")
              out.write(f"nonregular_or_symlink_paths_skipped {len(skipped_nonregular)}\n")
              out.write(f"read_errors {len(read_errors)}\n\n")
              for name, item in summary.items():
                  out.write(f"## {name}: hits={item['hit_count']} files={item['file_count']}\n")
                  for h in item["hits"]:
                      out.write(f"{h['path']}:{h['line']}:{h['text']}\n")
                  out.write("\n")
          if read_errors:
              raise SystemExit(f"inventory incomplete: {len(read_errors)} tracked regular files could not be read")
          PY

      - name: Commit regenerated context bundles to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Operations/Context_Bundles/
          if git diff --cached --quiet; then
            echo "Context bundles already fresh; no commit needed."
          else
            git commit -m "Refresh context bundles after RC-A semantic sync"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Upload RC-A exhaustive inventory
        uses: actions/upload-artifact@v4
        with:
          name: rc-a-exhaustive-inventory
          path: |
            rc-a-exhaustive-inventory.json
            rc-a-exhaustive-inventory.txt
          if-no-files-found: error
          retention-days: 2

      - name: Upload regenerated context bundles
        uses: actions/upload-artifact@v4
        with:
          name: rc-a-regenerated-context-bundles
          path: Operations/Context_Bundles/
          if-no-files-found: error
          retention-days: 2
