name: Governance Preflight

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  governance-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply RC-A stale-route cleanup to target branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/srt-rca-stale-route-cleanup-helper'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/srt-rca-stale-route-cleanup
          git switch -C agent/srt-rca-stale-route-cleanup origin/agent/srt-rca-stale-route-cleanup
          python - <<'PY'
          from pathlib import Path
          import re

          tensions = Path('Core/SRT_OPEN_TENSIONS.md')
          text = tensions.read_text(encoding='utf-8')

          sec13 = r'''## 13. Selection Irreducibility / Competitor-Vocabulary Deletion Test (open; post-RC-A status synchronized 2026-08-17)

### Current State

- `Core/SRT_Core_21_Minimal_Axioms.md P0-01` still fixes Selection as the current P0 primitive admission. AM-A keeps the minimal actualisation kernel with Selection; this architectural status is unchanged by the subtractive audits.
- `Governance/SRT_GOV_SUB01_Subtractive_Audit_Protocol_v0_1.md §8.1` remains the controlling deletion test: remove the word and primitive role of Selection while retaining asymmetric constraint, reachable-set restriction, history dependence, cost, and consequence return.
- Pass 1 established literal `K=0` dependence but substantial limited-/broad-K reconstruction, leaving the formal GOV-SUB01 residue **UNASSIGNED**.
- Pass 1.5 showed that the deterministic correct-SHA transaction can pass the bounded CG surface while supplying no independent evidence for the former `Real Choice Moment` boundary. After RC-A this is no longer a Selection paradox: `CG pass != agency proved` and `agency-guard failure != no Selection`.
- A2 produced `NO-D2` against an ordinary causal-history rival. Subsequent rival audit also separated a bounded empirical rival (`R2`) from an unrestricted representational container (`R∞`): only a frozen bounded rival is a fair D2 judge.
- RC-A (2026-08-17) demoted former `P1-T05: Real Choice Moment` out of P1. Its anti-script content now lives only as a P2/P3 agency guard and **must not** be used as a primitive-Selection residue gate.
- The post-RC-A Core 24 audit found current Selection-near `P24-1 / P24-3 / P24-4` signatures prospectively absorbable by bounded R2 families; the module is now a prediction-candidate / falsification-target surface with established D2 count `0`.

### Problem Point

The unresolved question is now cleaner than before:

> After deleting the Selection primitive, can a frozen bounded ordinary causal / adaptive model be made to match the same declared state, history, intervention and observables while still yielding a **different prospective prediction** from SRT?

Vocabulary dependence, classification difference, or forcing a rival to preserve SRT's own metaphysical starting point do not answer this. A future result must isolate a measurable consequence that is not already prospectively generated by the declared rival update family.

### Residue Gate

A GOV-SUB01 residue label may be attached to primitive Selection only after at least one qualifying exhibit survives a frozen bounded rival:

1. `E_cf`: a prospective counterfactual outcome differs (`O_SRT != O_R2`);
2. `E_int`: a declared intervention produces different predicted effects;
3. a domain-level dynamical prediction depends on Selection-specific structure and remains different after rival calibration under frozen complexity / revision cost;
4. `E_phen / E_norm` may support downstream bearer, agency, or normativity distinctions, but **cannot by themselves** establish primitive Selection irreducibility unless they also generate a qualifying D2 consequence against the reduced rival.

Former P1-T05 / `Real Choice Moment` divergence is removed from this gate by RC-A.

### Future Hardening Direction

1. Freeze a bounded `R2` competitor: declared state variables, update family, calibration range, horizon, bearer / boundary where relevant, and model-revision cost.
2. Freeze one common intervention and observable outcome before inspecting the result.
3. Require prospective `O_SRT != O_R2`; D0 vocabulary and D1 classification divergence do not discharge §13.
4. Use Core 24 candidates only as candidate measurement surfaces. If the frozen rival predicts the same observation family, record **NO-GO at specification stage** rather than executing a confirmatory-looking experiment.
5. Keep GOV-SUB01 residue **UNASSIGNED** until a qualifying D2+ exhibit exists.

The P0 primitive admission and the empirical irreducibility question therefore remain separate registers. P0 status is not proof of D2 irreducibility; rival absorption is not proof that the primitive role is absent.
'''

          sec14 = r'''## 14. Selection-Event Threshold Operationalization (open; post-RC-A status synchronized 2026-08-17)

### Current State

- `03_Bridges/SRT_Choice_Generation_Conditions_2026-08-04.md` supplies five P2/P3 functional conditions for a bounded selection-event candidate: difference manifestation (`CG-0`), non-equivalent registration (`CG-1`), path efficacy (`CG-2`), consequence bearing (`CG-3`), and historical efficacy (`CG-4`).
- `Operations/SRT_UNIFIED_SELECTION_EVENT_AUDIT_PROTOCOL_2026-08-04.md` grades the corresponding ladders (`DMF / NER / PEF / CBP / HEF`) and uses audit-default minima `DMF-2 / NER-2 / PEF-2 / CBP-2 / HEF-3` under a non-compensation rule.
- `03_Bridges/SRT_Selection_Event_CompactCore.md` remains the compact discrimination / audit layer.
- Pass 1.5 supplied an important negative control: a deterministic correct-SHA transaction can pass the bounded CG surface. This shows that the five-gate audit is not an agency test.
- RC-A demoted former `P1-T05: Real Choice Moment` out of P1. Therefore there is no longer a requirement to derive a `P1-T05 <-> CG-0..CG-4` necessity / sufficiency mapping.

### Problem Point

Two live exposures remain:

1. **Threshold status.** The audit minima are conventions for comparable review, not P0/P1-derived cross-domain thresholds. They still lack domain calibration and must not be cited as universal Selection criteria.
2. **Discriminating gain.** No executed D2 test shows that a CG-based verdict produces a prospective counterfactual or interventional difference that a frozen bounded ordinary causal / adaptive model cannot already predict.

The five gates therefore remain an **audit surface**, not a completed necessary-and-sufficient definition of Selection, agency, subjecthood, consciousness, freedom, `L_2`, or generative health.

### Future Hardening Direction

Progress would be at least one of:

1. domain-specific calibration of one or more gate minima from independently motivated constraints;
2. a frozen-rival intervention where the CG/SRT formulation and the ordinary causal/adaptive rival predict different future observations (`D2+`);
3. a negative control that forces revision of a gate or threshold because the audit produces a false-positive bounded selection-event candidate under an independently frozen domain criterion;
4. evidence that one gate adds out-of-sample predictive value after matching the rival's declared state/history variables and paying the same model-complexity budget.

Do **not** restore former P1-T05 as the missing positive criterion. The downstream `Agency / Automation Guard` is a separate P2/P3 sufficiency guard and may not be used to decide whether Selection occurred.

Until a qualifying calibration or D2 result exists, `CG-0..CG-4`, the graded ladders, and their minima remain **P2/P3 audit apparatus**. Passing all five gates licenses only the phrase **“bounded selection-event candidate.”**
'''

          new_text, n13 = re.subn(
              r'## 13\. Selection Irreducibility / Competitor-Vocabulary Deletion Test.*?(?=\n---\n\n## 14\.)',
              sec13.rstrip(), text, count=1, flags=re.S)
          if n13 != 1:
              raise SystemExit(f'expected one §13 replacement, got {n13}')
          new_text, n14 = re.subn(
              r'## 14\. Selection-Event Threshold Operationalization.*?(?=\n---\n\n## 15\.)',
              sec14.rstrip(), new_text, count=1, flags=re.S)
          if n14 != 1:
              raise SystemExit(f'expected one §14 replacement, got {n14}')
          tensions.write_text(new_text, encoding='utf-8')

          router = Path('_SRT_CONTEXT_ROUTER.md')
          rtext = router.read_text(encoding='utf-8')
          sec23a = r'''## 23a. Route: Choice Generation Conditions / Selection-Event Audit / Agency Guard

**Use when the query mentions**: 这算不算选择, selection event, 伪选择 / pseudo-choice, 惩罚性选择, "the AI chose", 输出不同是否等于选择, 建议是否等于决策, 后果落到谁身上, consequence-bearing position, 有记忆是否等于历史写回, 选择生成条件, CG-0..CG-4, DMF / NER / PEF / CBP / HEF, 统一选择事件审计, script / habit / gradient / L2 automation, agency guard.

### Primary

- `03_Bridges/SRT_Selection_Event_CompactCore.md` — 快速审计层（五门、五把梯子、三门槛、四类实践判读）
- `03_Bridges/SRT_Choice_Generation_Conditions_2026-08-04.md` — T-D 条件矩阵全文（P2/P3）
- `03_Bridges/SRT_Agency_Automation_Guard_2026-08-17.md` — RC-A 后的 anti-script agency sufficiency guard（P2/P3）
- `Core/SRT_OPEN_TENSIONS.md §14` — 门槛校准与 D2 判别增益仍未闭合
- `Core/SRT_Core_21b_Constitutive_Theorems.md` — 只用于 P1-T06 Stable ISP 与 former P1-T05 demotion record；**不得**再把 former P1-T05 当 Selection 判据

### Secondary

- `Operations/SRT_UNIFIED_SELECTION_EVENT_AUDIT_PROTOCOL_2026-08-04.md` — 分级门定义、边界冻结要求、六种拼接陷阱
- `03_Bridges/SRT_Entropy_Disturbance_Selective_Reorganization_Bridge_2026-08-04.md` — T-B 过程层
- `03_Bridges/SRT_Dissipative_Structures_and_Selection_Structures_Bridge_2026-08-04.md` — T-E 耗散／选择分层
- `03_Bridges/SRT_Selection_Dynamics_MSD_Bridge.md` — 排除／定形／写入／锚定／回流串联
- `Operations/Audits/SRT_SELECTION_IRREDUCIBILITY_PASS1_5_JOINT_REMOVAL_2026-08-16.md` — correct-SHA negative control / `CG != former P1-T05`
- `Operations/Audits/SRT_RC_A_P1_T05_DEMOTION_DERIVATIVE_SYNC_2026-08-17.md` — RC-A 派生重分类记录
- `Operations/Audits/SRT_CHOICE_EVENT_BEHAVIOR_REGRESSION_TESTS_2026-08-06.md` — 历史行为回归题；涉及 former P1-T05 的旧读法由 RC-A supersede

### Boundary

- `CG-0..CG-4`、五把梯子与最低门槛全部是 **P2/P3 audit apparatus**，不是 P0/P1 canonical Selection 定义。
- 五门达标只允许说“**有界选择事件候选**”；`CG pass != agency proved`。
- RC-A 已撤销 `script / habit / gradient / L2 automation -> no Selection` 的推理。脚本化或自动化过程可携带历史选择沉淀，也可与其他层级的持续 Selection 共存。
- anti-script 内容只保留为更强 agency / subject-level standing 的**不足性护栏**：仅靠 script / habit / gradient / L2 automation 不足以证明 agency；反向也不能推出没有 Selection。
- 不可补偿：任一 CG 门未达最低等级，不得由其他门高等级补偿；不同事件、边界或时间尺度证据不得拼接。
- 不要把输出差异（`PEF-0`）、建议接口（`PEF-1`）、一般耗能（`CBP-1`）或短期状态携带（`HEF-1`）读成对应条件已成立。
- 不要把惩罚性选择说成“没有选择”，也不要把“选项少”当作伪选择判据。
- 不要把可再选择性写成每个 Selection event 的必要条件，也不要把耗散结构写成选择的普遍必要前身。
- 选择事件审计、Stable ISP、generative reselectability、agency guard 四者分工固定，不得互相替代。
'''
          rnew, nr = re.subn(
              r'## 23a\. Route:.*?(?=\n---\n\n## 24\.)',
              sec23a.rstrip(), rtext, count=1, flags=re.S)
          if nr != 1:
              raise SystemExit(f'expected one router §23a replacement, got {nr}')
          router.write_text(rnew, encoding='utf-8')
          PY

          # Refresh generated context bundles only if the input closure actually changed.
          uv run python scripts/build_srt_context_bundles.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Core/SRT_OPEN_TENSIONS.md _SRT_CONTEXT_ROUTER.md Operations/Context_Bundles
          if git diff --cached --quiet; then
            echo 'No cleanup changes produced.'
            exit 1
          fi
          git commit -m 'Synchronize RC-A open tensions and selection-event route'
          git push origin HEAD:agent/srt-rca-stale-route-cleanup

      - name: Check base main governance health
        id: base_governance
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          base_ref="origin/${{ github.base_ref }}"
          rm -rf /tmp/srt-governance-base
          trap 'git worktree remove --force /tmp/srt-governance-base >/dev/null 2>&1 || true' EXIT
          git worktree add --detach /tmp/srt-governance-base "$base_ref"
          (
            cd /tmp/srt-governance-base
            uv run python scripts/refresh_split_metadata.py --check
            uv run python scripts/governance_preflight.py \
              --skip-write-report \
              --strict-split-metadata
          ) 2>&1 | tee base-governance-preflight.log

      - name: Check PR-local frontmatter
        id: pr_frontmatter
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/check_frontmatter_changed.py \
            --base-ref "origin/${{ github.base_ref }}" \
            --baseline Governance/Frontmatter_Warning_Baseline.txt \
            --fail-on-new-warnings \
            --suggest-fixes 2>&1 | tee pr-frontmatter.log

      - name: Enforce frontmatter baseline monotonicity
        id: baseline_monotonic
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASELINE_EXPANSION_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'governance-baseline-expansion-approved') }}
        run: |
          set -o pipefail
          args=(
            --base-ref "origin/${{ github.base_ref }}"
            --baseline Governance/Frontmatter_Warning_Baseline.txt
          )
          if [[ "$BASELINE_EXPANSION_APPROVED" == "true" ]]; then
            args+=(--allow-added)
          fi
          uv run python scripts/check_frontmatter_baseline_monotonic.py "${args[@]}" \
            2>&1 | tee baseline-monotonic.log

      - name: Check split metadata freshness
        run: uv run python scripts/refresh_split_metadata.py --check

      - name: Run governance preflight
        id: full_preflight
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/governance_preflight.py \
            --skip-write-report \
            --strict-split-metadata 2>&1 | tee governance-preflight.log

      - name: Classify governance result
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_OUTCOME: ${{ steps.base_governance.outcome }}
          LOCAL_OUTCOME: ${{ steps.pr_frontmatter.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline_monotonic.outcome }}
          FULL_OUTCOME: ${{ steps.full_preflight.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def outcome(name: str) -> str:
              value = os.environ.get(name, "").strip()
              return value or "not-run"

          event_name = outcome("EVENT_NAME")
          base = outcome("BASE_OUTCOME")
          local = outcome("LOCAL_OUTCOME")
          baseline = outcome("BASELINE_OUTCOME")
          full = outcome("FULL_OUTCOME")

          if event_name != "pull_request":
              scope = "main_push"
              disposition = "inspect_full_preflight"
              verdict = "MAIN PUSH CHECK — inspect the full preflight result."
          elif local == "failure":
              scope = "pr_local"
              disposition = "do_not_merge"
              verdict = "PR_LOCAL / LOCAL DIRTY / DO NOT MERGE."
          elif baseline == "failure":
              scope = "baseline_expansion"
              disposition = "do_not_merge"
              verdict = "PR_LOCAL BASELINE DEBT EXPANSION / DO NOT MERGE."
          elif base == "failure" and full == "success":
              scope = "base_main_repaired"
              disposition = "governance_hotfix_only"
              verdict = "BASE_MAIN WAS BLOCKED; THIS PR REPAIRS IT / HOTFIX PATH."
          elif base == "failure":
              scope = "base_main"
              disposition = "governance_hotfix_only"
              verdict = "BASE_MAIN BLOCKED / HOTFIX ONLY."
          elif full == "failure":
              scope = "merged_repository_or_infrastructure"
              disposition = "do_not_merge"
              verdict = "LOCAL FRONTMATTER CLEAN; FULL REPOSITORY OR INFRA FAILURE / DO NOT MERGE."
          else:
              scope = "none"
              disposition = "normal_merge"
              verdict = "LOCAL CLEAN / MAIN HEALTHY / NORMAL MERGE."

          payload = {
              "schema_version": 1,
              "event_name": event_name,
              "failure_scope": scope,
              "merge_disposition": disposition,
              "base_main_health": base,
              "pr_local_frontmatter": local,
              "baseline_monotonicity": baseline,
              "merged_repository_preflight": full,
              "verdict": verdict,
          }
          Path("governance-attribution.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## Governance failure attribution\n\n")
              handle.write("| Scope | Outcome |\n")
              handle.write("|---|---|\n")
              handle.write(f"| base_main_governance | {base} |\n")
              handle.write(f"| pr_local_frontmatter | {local} |\n")
              handle.write(f"| baseline_monotonicity | {baseline} |\n")
              handle.write(f"| merged_repository_preflight | {full} |\n\n")
              handle.write(f"**Verdict:** {verdict}\n")

          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Upload governance preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-preflight-diagnostics
          path: |
            governance-preflight.log
            base-governance-preflight.log
            pr-frontmatter.log
            baseline-monotonic.log
            governance-attribution.json
          if-no-files-found: warn
          retention-days: 14
