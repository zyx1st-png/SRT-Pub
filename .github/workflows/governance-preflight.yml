name: Governance Preflight

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance-preflight:
    runs-on: ubuntu-latest
    env:
      GOVERNANCE_BASE_REF: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history is required both for PR-local diff attribution and for
          # context-bundle source-date provenance.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check split metadata freshness
        run: uv run python scripts/refresh_split_metadata.py --check

      - name: Run governance preflight
        shell: bash
        run: |
          set -o pipefail
          args=()
          if [[ -n "${GOVERNANCE_BASE_REF:-}" ]]; then
            args+=(--base-ref "$GOVERNANCE_BASE_REF")
          fi
          uv run python scripts/governance_preflight.py \
            --skip-write-report \
            --strict-split-metadata \
            --json-report governance-preflight-summary.json \
            "${args[@]}" 2>&1 | tee governance-preflight.log

      - name: Upload governance preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-preflight-diagnostics
          path: |
            governance-preflight.log
            governance-preflight-summary.json
            frontmatter-pr-local.json
            frontmatter-repository.json
          if-no-files-found: warn
          retention-days: 14
