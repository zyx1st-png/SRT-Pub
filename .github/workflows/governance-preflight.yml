          replace_once("Core/SRT_OPEN_TENSIONS.md", "with a five-term ODE (relaxation / real-reselection pump / `\\Delta\\Psi_f^{gap}` deduction / `S_{str}` erosion / `s_{ext}` scaffolding)", "with the former-P1-T05-derived global `r(t)` pump removed by RC-A subtractive probe and no replacement; the current minimal ODE retains relaxation / `\\Delta\\Psi_f^{gap}` deduction / `S_{str}` erosion / `s_{ext}` scaffolding")

          d_anchor = "# 耗散结构与选择结构：P3 对接桥\n"
