name: Governance Preflight

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history: the context-bundle builder records each source file's
          # last-commit date. A shallow clone reports the graft commit's date
          # for every file, so the bundles would claim the whole canonical
          # spine changed today. The builder refuses to run shallow.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check split metadata freshness
        run: uv run python scripts/refresh_split_metadata.py --check

      - name: Run governance preflight
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/governance_preflight.py --skip-write-report --strict-split-metadata 2>&1 | tee governance-preflight.log

      - name: Upload governance preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-preflight-log
          path: governance-preflight.log
          if-no-files-found: error
          retention-days: 14
