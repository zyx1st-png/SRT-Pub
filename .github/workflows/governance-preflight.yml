                  "- **Constitution v1 的非形式化边界**：当前接口保持最低必要对象化，不用公式/阈值/完整 state space 作为 constitutional floor；这不推出未来更成熟的 SRT ontology 永远不形式化，也不推出数学不能表达 indexicality。领域形式化继续允许并可能反向约束本体重构。",
