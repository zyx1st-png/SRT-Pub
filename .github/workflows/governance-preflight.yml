name: Governance Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  governance-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply closure status update
        run: python scripts/_tmp_rca_phase0_closure_update.py

      - name: Remove temporary machinery and restore workflow
        run: |
          rm scripts/_tmp_rca_phase0_closure_update.py
          git show origin/main:.github/workflows/governance-preflight.yml > .github/workflows/governance-preflight.yml

      - name: Verify final closure working tree
        run: |
          uv run python scripts/refresh_split_metadata.py --check
          uv run python scripts/build_srt_context_bundles.py --check
          uv run python scripts/governance_preflight.py --skip-write-report --strict-split-metadata
          git diff --check

      - name: Commit closure status and restored workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Update Phase 0 closure to final engineering status"
          git push origin "HEAD:${{ github.head_ref }}"
