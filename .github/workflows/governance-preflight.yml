name: Temporary review fixes for PR 922 and 923

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-pr-922:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR 922 target branch
        uses: actions/checkout@v4
        with:
          ref: theory/bearer-r-strongest-neighbor-gate-20260907
          fetch-depth: 0

      - name: Apply review fixes to PR 922
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          audit_p = Path('Operations/Audits/SRT_BEARER_RETURN_RECONSTITUTION_R_STRONGEST_NEIGHBOR_PASS1_2026-09-07.md')
          gate_p = Path('Operations/Proposals/SRT_BEARER_RETURN_RECONSTITUTION_R_AUTHOR_GATE_2026-09-07.md')

          audit = audit_p.read_text(encoding='utf-8')
          gate = gate_p.read_text(encoding='utf-8')

          if 'Programme route rank:' not in audit:
              needle = '> **Scope discipline:** `R` is not canonical, not an SRT primitive, and not yet a separately author-adjudicated bearer requirement. The strengthened vertical commitment inherited by #921 also remains **UNAUDITED AT EVERY LEVEL** and does not inherit the older Cycle-2 Level-1 verdict.\n'
              repl = needle + '>\n> **Programme route rank:** this autonomy-matched / non-outsourcing line is retained as a **secondary / deprioritized route relative to IRR-B** under the current `STATUS.md` routing. This pass does not promote it back to first priority.\n'
              if needle not in audit:
                  raise SystemExit('audit scope anchor not found')
              audit = audit.replace(needle, repl, 1)

          if 'habit / sensorimotor-autonomy pass 2' not in audit:
              anchor = 'Next move:\n\n> Ask the author whether the intended deeper relation is no additional R requirement, the minimal non-outsourcable R-B relation, or the stronger reciprocal R-C relation. Only the selected reading may proceed to contradiction / circularity red-team and a final non-substitutability verdict.'
              replacement = '''### Mandatory strongest-neighbor continuation before any final verdict\n\nThe 2009 autonomy paper is a strong first-pass comparator for individuality / adaptivity / self-maintenance, but it is not sufficient to close the narrower history-to-action-organization residual. If the author selects a positive `R` reading (`R-B` or `R-C`), the next strongest-neighbor pass must explicitly test the **habit / sensorimotor-autonomy** family, including at minimum:\n\n- Xabier E. Barandiaran & Ezequiel A. Di Paolo (2014), “A genealogical map of the concept of habit,” *Frontiers in Human Neuroscience* 8:522. DOI `10.3389/fnhum.2014.00522`.\n- Matthew D. Egbert & Xabier E. Barandiaran (2014), “Modeling habits as self-sustaining patterns of sensorimotor behavior,” *Frontiers in Human Neuroscience* 8:590. DOI `10.3389/fnhum.2014.00590`.\n\nThese works are mandatory pressure because they directly address historically reinforced, self-sustaining sensorimotor organization and therefore may absorb much more of `R-B` than the 2009 minimal-agency definition alone. This registration does **not** prejudge the result: the remaining question is whether they also pay the specific same-unit consequence-ownership / non-outsourcing relation to later position reconstitution.\n\n```text\nhabit / sensorimotor-autonomy pass 2: MANDATORY IF R-B OR R-C IS AUTHOR-SELECTED\nR-specific strongest-neighbor PASS1: COMPLETE\ncombined V × C + R strongest-neighbor test: NOT PAID\n```\n\nNext move:\n\n> Ask the author whether the intended deeper relation is no additional R requirement, the minimal non-outsourcable R-B relation, or the stronger reciprocal R-C relation. If `R-0` is selected, no positive `R` increment remains to defend. If `R-B` or `R-C` is selected, run contradiction / circularity red-team **and the mandatory habit / sensorimotor-autonomy pass 2** before any final non-substitutability or Level verdict.'''
              if anchor not in audit:
                  raise SystemExit('audit next-move anchor not found')
              audit = audit.replace(anchor, replacement, 1)

          if 'R-A != R-0' not in gate:
              anchor = 'That question is already too generic.\n\n---\n\n## 3. The actual author question\n'
              insert = '''That question is already too generic.\n\n### 2.1 Label guard — `R-A` is not `R-0`\n\nThe audit and this author gate use two different labels for two different logical roles:\n\n```text\nR-A = positive weak-coupling claim\n      q_t -> O_t -> P_(t+1)\n      as an SRT increment: DROP / ABSORBED\n\nR-0 = null additional-requirement option\n      V and C may jointly suffice without requiring q_t\n      to help reconstitute P_(t+1)\n      as an author-meaning option: STILL OPEN\n\nR-A != R-0\n```\n\nAbsorption of `R-A` therefore does **not** remove `R-0` from the author decision surface and does not force the author to choose `R-B` or `R-C`.\n\n---\n\n## 3. The actual author question\n'''
              if anchor not in gate:
                  raise SystemExit('gate label anchor not found')
              gate = gate.replace(anchor, insert, 1)

          if 'secondary / deprioritized route relative to IRR-B' not in gate:
              needle = '> **Purpose:** present the narrow author decision exposed by the source-native strongest-neighbor pass. No option in this file is an author decision until explicitly selected or reformulated by the author.\n'
              repl = needle + '>\n> **Programme routing:** this autonomy-matched / non-outsourcing line is retained as a **secondary / deprioritized route relative to IRR-B**. Preparing this gate does not restore it to first programme priority.\n'
              if needle not in gate:
                  raise SystemExit('gate purpose anchor not found')
              gate = gate.replace(needle, repl, 1)

          if 'habit / sensorimotor-autonomy strongest-neighbor pass 2' not in gate:
              needle = '''After author selection, governance requires:\n\n```text\nselected meaning\n-> circularity / hidden-premise red-team\n-> final strongest-neighbor non-substitutability test\n-> only then Level 0/1/2 assignment\n```'''
              repl = '''After author selection, governance requires:\n\n```text\nselected meaning\n-> circularity / hidden-premise red-team\n-> if R-B or R-C: habit / sensorimotor-autonomy strongest-neighbor pass 2\n-> final strongest-neighbor non-substitutability test\n-> only then Level 0/1/2 assignment\n```\n\nThe mandatory pass-2 family is Barandiaran & Di Paolo (2014) on habit genealogy and Egbert & Barandiaran (2014) on habits as self-sustaining sensorimotor patterns. Their relevance is not pre-judged as absorption; they must be tested because they target the historically sedimented action-organization burden more directly than the 2009 minimal-agency paper.'''
              if needle not in gate:
                  raise SystemExit('gate governance anchor not found')
              gate = gate.replace(needle, repl, 1)

          audit_p.write_text(audit, encoding='utf-8')
          gate_p.write_text(gate, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Operations/Audits/SRT_BEARER_RETURN_RECONSTITUTION_R_STRONGEST_NEIGHBOR_PASS1_2026-09-07.md Operations/Proposals/SRT_BEARER_RETURN_RECONSTITUTION_R_AUTHOR_GATE_2026-09-07.md
          git diff --cached --check
          git commit -m 'Address review on bearer R gate and neighbor routing'
          git push origin HEAD:theory/bearer-r-strongest-neighbor-gate-20260907

  fix-pr-923:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR 923 target branch
        uses: actions/checkout@v4
        with:
          ref: materials/hirschhorn-moral-status-attribution-20260907
          fetch-depth: 0

      - name: Apply review fixes to PR 923
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root_p = Path('Operations/_SRT_MATERIAL_LOG.md')
          split_p = Path('Operations/Material_Log/README.md')
          src_p = Path('Materials/2026/SRC_2026_09_07_Philosophy_Hirschhorn_Consciousness_Moral_Status_Attributions.md')
          hard_p = Path('Philosophy/_SRT_Philosophy_Hardening_Index.md')
          matreg_p = Path('Registries/material_registry.jsonl')
          patchreg_p = Path('Registries/patch_registry.jsonl')

          root = root_p.read_text(encoding='utf-8')
          if '2026-09_Part01' not in root:
              anchor = '| 2026-08_Part06 | [Material_Log/2026-08_Part06.md](Material_Log/2026-08_Part06.md) | 8 |\n'
              row = anchor + '| 2026-09_Part01 | [Material_Log/2026-09_Part01.md](Material_Log/2026-09_Part01.md) | 1 |\n'
              if anchor not in root:
                  raise SystemExit('root Material Log split anchor not found')
              root = root.replace(anchor, row, 1)
          root = root.replace('- 总提交：240 条', '- 总提交：241 条', 1)
          root = root.replace('- A（融入）：162 条', '- A（融入）：163 条', 1)
          root = root.replace('67.5%', '67.6%', 1)
          root_p.write_text(root, encoding='utf-8')

          split = split_p.read_text(encoding='utf-8')
          if '[2026-09_Part01.md]' not in split:
              anchor = '| [2026-08_Part06.md](2026-08_Part06.md) | 8 | August continuation; seven bounded A-class entries through Nave processual-bearer/FEP pressure plus Wyld/SAT B1 translation-only record on 2026-08-24 |\n'
              row = anchor + '| [2026-09_Part01.md](2026-09_Part01.md) | 1 | September continuation; Hirschhorn / Negro / Mudrik moral-status attribution -> PH-ETH01 bounded A-class interface entry on 2026-09-07 |\n'
              if anchor not in split:
                  raise SystemExit('split README row anchor not found')
              split = split.replace(anchor, row, 1)
          if '**2026-09_Part01 current routing:**' not in split:
              anchor = '## Current note\n\n'
              note = ('## Current note\n\n'
                      '**2026-09_Part01 current routing:** this is now the current dated continuation and contains the Hirschhorn / PH-ETH01 bounded A-class entry. `2026-08_Part06.md` remains the immediately preceding August continuation.\n\n')
              if anchor not in split:
                  raise SystemExit('split README current-note anchor not found')
              split = split.replace(anchor, note, 1)
              split = split.replace('`2026-08_Part06.md` is the current dated continuation', '`2026-08_Part06.md` was the previous dated continuation', 1)
          split_p.write_text(split, encoding='utf-8')

          src = src_p.read_text(encoding='utf-8')
          src = src.replace(
              'reliability_level: high_for_reported_attribution_patterns; bounded_for_metaethical_or_ontological_inference',
              'reliability_level: high_for_reported_attribution_patterns_within_supplied_manuscript; non_peer_reviewed; external_data_code_and_preregistration_locations_source_reported_not_independently_verified; bounded_for_metaethical_or_ontological_inference',
              1,
          )
          old = 'The manuscript reports OSF materials/data, GitHub analysis code and preregistrations. This SourceCard records those claims as source-reported; this writeback does not independently verify the external repositories.'
          new = '''The manuscript reports the following exact external locators:\n\n- OSF data / materials: `https://osf.io/wf7eb`\n- main-survey preregistration: `https://osf.io/x297y`\n- follow-up preregistration: `https://osf.io/2prfx`\n- analysis code: `https://github.com/RonyHirsch/ethics_survey`\n- interactive dataset / visualization site: `https://ronyhirsch.github.io/minds-matter`\n- interactive-site code: `https://github.com/RonyHirsch/minds-matter`\n\nThese are **source-reported external locators** from the supplied manuscript. This writeback does not independently verify the repository contents or convert the manuscript into a peer-reviewed publication.'''
          if old in src:
              src = src.replace(old, new, 1)
          elif 'OSF data / materials:' not in src:
              raise SystemExit('SourceCard locator anchor not found')
          src_p.write_text(src, encoding='utf-8')

          hard = hard_p.read_text(encoding='utf-8')
          if '| PH-ETH01 Moral-status attribution / recognition separation |' not in hard:
              lines = hard.splitlines()
              inserted = False
              out = []
              for line in lines:
                  out.append(line)
                  if line.startswith('| PH-PER01 Perceptual learning / salience reparameterization |'):
                      out.append('| PH-ETH01 Moral-status attribution / recognition separation | `Philosophy/patches/SRT_Philosophy_PH_ETH01_Moral_Status_Attribution_Recognition_Separation_v0_1.md` | separates actual target / bearer / stake facts from moral-status attribution / recognition and from normative legitimacy / governance protection; retains target × attributor × relation/context as a descriptive attribution structure while blocking reverse ontology inference | A / user-supplied preregistered non-peer-reviewed manuscript P3 ethics/consciousness interface; integration hook pending |')
                      inserted = True
              if not inserted:
                  raise SystemExit('hardening index PH-PER01 row anchor not found')
              hard = '\n'.join(out) + ('\n' if hard.endswith('\n') else '')
          hard_p.write_text(hard, encoding='utf-8')

          source_id = 'SRC-2026-09-07-PHIL-HIRSCHHORN-CONSCIOUSNESS-MORAL-STATUS-ATTRIBUTION'
          patch_id = 'PATCH-PHIL-PH-ETH01-MORAL-STATUS-ATTRIBUTION-RECOGNITION-SEPARATION'

          matreg = matreg_p.read_text(encoding='utf-8')
          if source_id not in matreg:
              obj = {
                  'source_id': source_id,
                  'patch_id': patch_id,
                  'domain': 'moral_psychology_consciousness_ethics_ai_welfare',
                  'file': 'Materials/2026/SRC_2026_09_07_Philosophy_Hirschhorn_Consciousness_Moral_Status_Attributions.md',
                  'claim_level': 'P3',
                  'canonical_status': 'non_canonical',
                  'integration_priority': 'high',
                  'evidence_level': 'primary_full_text_preregistered_survey_manuscript_non_peer_reviewed',
                  'status': 'processed',
                  'related_srt_claims': [
                      'consciousness_moral_status_separation',
                      'moral_status_attribution',
                      'moral_recognition',
                      'attributor_dependence',
                      'relational_context',
                      'moral_legitimacy',
                      'AI_welfare_governance',
                      'anti_scalar_collapse',
                  ],
              }
              matreg = matreg.rstrip('\n') + '\n' + json.dumps(obj, ensure_ascii=False, separators=(',', ':')) + '\n'
          matreg_p.write_text(matreg, encoding='utf-8')

          patchreg = patchreg_p.read_text(encoding='utf-8')
          if patch_id not in patchreg:
              obj = {
                  'patch_id': patch_id,
                  'source_ids': [source_id],
                  'domain': 'philosophy_moral_psychology_consciousness_ethics_ai_welfare',
                  'file': 'Philosophy/patches/SRT_Philosophy_PH_ETH01_Moral_Status_Attribution_Recognition_Separation_v0_1.md',
                  'hook_file': 'Philosophy/hooks/PH_ETH01_Moral_Status_Attribution_Recognition_Integration_Hook.md',
                  'claim_level': 'P3',
                  'canonical_status': 'non_canonical',
                  'integration_status': 'pending',
                  'integration_priority': 'high',
                  'status': 'processed',
                  'target_documents': [
                      'AI/Consciousness_Annex/02_Report_Reality_Moral_Status_Interface.md',
                      'AI/SRT_AI_03_Consciousness_Framework.md',
                      'Philosophy/SRT_Subjecthood_Threshold_Interface.md',
                      'Philosophy/SRT_Ethics_PH_SS_Guardrails.md',
                      'Core/SRT_Core_24_Normativity_Anti_Optimization_Interface.md',
                  ],
              }
              patchreg = patchreg.rstrip('\n') + '\n' + json.dumps(obj, ensure_ascii=False, separators=(',', ':')) + '\n'
          patchreg_p.write_text(patchreg, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Operations/_SRT_MATERIAL_LOG.md Operations/Material_Log/README.md Materials/2026/SRC_2026_09_07_Philosophy_Hirschhorn_Consciousness_Moral_Status_Attributions.md Philosophy/_SRT_Philosophy_Hardening_Index.md Registries/material_registry.jsonl Registries/patch_registry.jsonl
          git diff --cached --check
          git commit -m 'Close Pipeline 1 ledger and registry gaps for Hirschhorn packet'
          git push origin HEAD:materials/hirschhorn-moral-status-attribution-20260907
