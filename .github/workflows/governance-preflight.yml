name: Governance Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-sigma-scope-current-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/sigma-scope-current-main-20260905
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh split metadata and status
        shell: bash
        run: |
          python scripts/refresh_split_metadata.py
          python - <<'PY'
          from pathlib import Path
          p = Path('STATUS.md')
          s = p.read_text(encoding='utf-8')
          old = '- **#869 sigma B1 repair** 可独立机械收尾，不得重新成为当前理论主线。'
          new = '- **sigma B1 scope truth-up 已完成 current-main clean replacement**：仅同步既有 owner 已声明的 `σ_{sr}` 规约性 / 可替换阶参地位及其 representation、trace/ext attribution、collective-boundary scope；这是 owner-consistency housekeeping，不是新的 sigma 理论，也不得重新成为当前理论主线。'
          if old not in s:
              raise SystemExit('expected STATUS #869 line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Core/Equations_Split/README.md Core_Law/L1_Formalism_Split/README.md STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Sync sigma scope split metadata and status'
            git push origin HEAD:repair/sigma-scope-current-main-20260905
          fi

      - name: Rebuild deterministic context bundles
        shell: bash
        run: |
          python scripts/build_srt_context_bundles.py
          git add Operations/Context_Bundles
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate context bundles after sigma scope truth-up'
            git push origin HEAD:repair/sigma-scope-current-main-20260905
          fi
