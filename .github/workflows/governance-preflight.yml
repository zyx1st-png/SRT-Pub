name: Governance Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  claude-review-fix:
    if: github.event.pull_request.head.ref == 'tmp/pr903-claude-review-fix'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: theory/author-reentry-governance-correction-20260905
          fetch-depth: 0

      - name: Fetch helper script
        shell: bash
        run: |
          git fetch origin tmp/pr903-claude-review-fix
          git show origin/tmp/pr903-claude-review-fix:scripts/tmp_pr903_claude_review_fix.py > /tmp/pr903_fix.py

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply review fixes and commit source changes
        shell: bash
        run: |
          python /tmp/pr903_fix.py
          git config user.name "srt-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add STATUS.md \
            Governance/SRT_GOV_AUTHOR_REENTRY_ONTOLOGY_RECONSTRUCTION_AMENDMENT_2026-09-05.md \
            Operations/Templates/SRT_DOMAIN_RECONSTRUCTION_FRAMEWORK_TEMPLATE.md
          if ! git diff --cached --quiet; then
            git commit -m "Close #903 governance review findings"
          fi

      - name: Regenerate context bundles
        shell: bash
        run: |
          uv run python scripts/build_srt_context_bundles.py
          git add Operations/Context_Bundles/
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate context bundles after status sync"
          fi

      - name: Push target branch
        shell: bash
        run: git push origin HEAD:theory/author-reentry-governance-correction-20260905
