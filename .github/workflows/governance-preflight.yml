name: Governance Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-l0-death-duplication:
    if: github.event_name == 'pull_request' && github.head_ref == 'theory/post959-l0-thinning-20260913'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Collapse repeated death clause
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Core_Law/SRT_L0_Metaphysics.md')
          text = path.read_text(encoding='utf-8')
          clause = '若某些选择痕迹此前已经**实际锚定**进集体稳定域，它们也不会仅因个体死亡而被追溯删除；但这是一条以已建立锚定为前提的下游陈述，不能反过来证明每次 Selection 都自动留下 durable collective trace。'
          triple = clause + clause + clause
          double = clause + clause
          if triple in text:
              text = text.replace(triple, clause, 1)
          elif double in text:
              text = text.replace(double, clause, 1)
          else:
              count = text.count(clause)
              if count == 1:
                  raise SystemExit(0)
              raise SystemExit(f'unexpected death-clause count: {count}')
          path.write_text(text, encoding='utf-8')
          PY

          if ! git diff --quiet -- Core_Law/SRT_L0_Metaphysics.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Core_Law/SRT_L0_Metaphysics.md
            git commit -m "fix: deduplicate L0 death clause"
            git push origin HEAD:${{ github.head_ref }}
          fi
