name: Governance Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  governance-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply third RC-A cleanup
        run: python scripts/_tmp_rca_phase0_cleanup3.py

      - name: Normalize exact edited Markdown line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('AI/SRT_AI_01_Ontology_CompactCore.md')
          s=p.read_text(encoding='utf-8')
          old='canonical `d-value` 的 stake reading 需要有限性 / 不可转移后果来赋予**关切与主体风险**重量；这不是 Selection occurrence 的必要条件。  \n'
          new='canonical `d-value` 的 stake reading 需要有限性 / 不可转移后果来赋予**关切与主体风险**重量；这不是 Selection occurrence 的必要条件。\n'
          if s.count(old)!=1: raise SystemExit(f'expected one trailing-space target, got {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Refresh split metadata
        run: uv run python scripts/refresh_split_metadata.py

      - name: Remove temporary machinery and restore workflow
        run: |
          rm scripts/_tmp_rca_phase0_cleanup3.py
          git show origin/main:.github/workflows/governance-preflight.yml > .github/workflows/governance-preflight.yml

      - name: Regenerate context bundles
        run: uv run python scripts/build_srt_context_bundles.py

      - name: Verify generated and split freshness
        run: |
          uv run python scripts/refresh_split_metadata.py --check
          uv run python scripts/build_srt_context_bundles.py --check

      - name: Run full governance preflight
        run: uv run python scripts/governance_preflight.py --skip-write-report --strict-split-metadata

      - name: Build third-pass exhaustive inventory
        shell: bash
        run: |
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          raw=subprocess.check_output(['git','ls-files','-z'])
          paths=[x.decode('utf-8',errors='surrogateescape') for x in raw.split(b'\0') if x]
          texts={}; binary=[]; nonregular=[]; errors=[]
          for path in paths:
              p=Path(path)
              if p.is_symlink() or not p.is_file(): nonregular.append(path); continue
              try:data=p.read_bytes()
              except OSError as exc: errors.append({'path':path,'error':repr(exc)}); continue
              if b'\0' in data: binary.append(path); continue
              texts[path]=data.decode('utf-8',errors='replace')
          def lh(rx):return [{'path':p,'line':i,'text':ln} for p,t in texts.items() for i,ln in enumerate(t.splitlines(),1) if rx.search(ln)]
          def both(a,b):
              out=[]
              for p,t in texts.items():
                  if a.search(t) and b.search(t):out += [{'path':p,'line':i,'text':ln} for i,ln in enumerate(t.splitlines(),1) if a.search(ln) or b.search(ln)]
              return out
          fam={
            'F1_P1_T05':lh(re.compile(r'P1-T05',re.I)),
            'F2_Real_Choice_Moment':lh(re.compile(r'Real\s+Choice\s+Moment',re.I)),
            'F3_real_live_active_choice':lh(re.compile(r'\b(?:real|live|active)\s+choice\b',re.I)),
            'F4_zh_real_live_L2_substitute':lh(re.compile(r'真实选择|活选择|L2\s*替代选择',re.I)),
            'F8_global_r_t_literal':lh(re.compile(r'(?<![A-Za-z0-9_])r\(t\)(?![A-Za-z0-9_])')),
            'F9_pseudo_selection':lh(re.compile(r'pseudo[- ]selection|伪选择',re.I)),
          }
          ns=re.compile(r'\bno\s+Selection\b',re.I)
          for tok in ('script','habit','automation','gradient'):fam[f'F5_{tok}_plus_no_Selection']=both(re.compile(rf'\b{tok}\w*\b',re.I),ns)
          fam['F6_CG_plus_P1_T05']=both(re.compile(r'\bCG(?:[-_0-9]|\b)',re.I),re.compile(r'P1-T05',re.I))
          fam['F7_T_dir_plus_real_live_choice']=both(re.compile(r'T[_\\]?[{]?dir[}]?',re.I),re.compile(r'\b(?:real|live)\s+choice\b|真实选择|活选择',re.I))
          summary={k:{'hit_count':len(v),'file_count':len({h['path'] for h in v}),'hits':v} for k,v in fam.items()}
          report={'snapshot_kind':'post-third-RC-A-authority-sync working tree','base_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tracked_paths':len(paths),'text_files_scanned':len(texts),'binary_files_skipped':len(binary),'nonregular_or_symlink_paths_skipped':len(nonregular),'skipped_nonregular_paths':nonregular,'read_errors':errors,'families':summary}
          Path('rc-a-post-third-inventory.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if errors:raise SystemExit(f'inventory incomplete: {len(errors)} read errors')
          PY

      - name: Commit third sync and restored workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- rc-a-post-third-inventory.json || true
          git diff --cached --check
          git commit -m "Close RC-A canonical and active bridge remnants"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "committed_head=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Attach committed head to inventory
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('rc-a-post-third-inventory.json');d=json.loads(p.read_text(encoding='utf-8'));d['committed_head']=os.environ['committed_head'];p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Upload third-pass inventory
        uses: actions/upload-artifact@v4
        with:
          name: rc-a-post-third-inventory
          path: rc-a-post-third-inventory.json
          if-no-files-found: error
          retention-days: 7
