name: Governance Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  governance-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Record immutable start head
        shell: bash
        run: git rev-parse HEAD > /tmp/rca_start_sha

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply final derivative cleanup
        run: python scripts/_temp_rca_final_review_cleanup_v3.py

      - name: Refresh split metadata
        run: uv run python scripts/refresh_split_metadata.py

      - name: Remove temporary helper and restore canonical workflow
        shell: bash
        run: |
          rm -f scripts/_temp_rca_final_review_cleanup_v3.py
          git show origin/main:.github/workflows/governance-preflight.yml > .github/workflows/governance-preflight.yml

      - name: Regenerate context bundles
        run: uv run python scripts/build_srt_context_bundles.py

      - name: Verify generated surfaces and governance
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/refresh_split_metadata.py --check
          uv run python scripts/build_srt_context_bundles.py --check
          uv run python scripts/governance_preflight.py --skip-write-report --strict-split-metadata
          git diff --check

      - name: Build strengthened final inventory artifact
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          terms = [
              "P1-T05", "Real Choice Moment", "real choice", "live choice", "active choice",
              "真实选择", "活选择", "L2 替代选择", "真实重选率", "共选真实性", "真实共选",
              "r^{(n→n+1)}", "r^{(n\\to n+1)}", "r^{coll}", "真实选择时刻",
          ]
          tracked = [x for x in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0") if x]
          rows = []
          text_scanned = 0
          read_errors = 0
          skipped_nonregular = 0
          for raw in tracked:
              p = Path(raw.decode("utf-8", errors="surrogateescape"))
              if not p.is_file() or p.is_symlink():
                  skipped_nonregular += 1
                  continue
              try:
                  data = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              except OSError:
                  read_errors += 1
                  continue
              text_scanned += 1
              for lineno, line in enumerate(data.splitlines(), 1):
                  hits = [t for t in terms if t in line]
                  if hits:
                      rows.append((str(p), lineno, hits, line))
          out = Path("/tmp/rca-final-review-strengthened-inventory.txt")
          with out.open("w", encoding="utf-8") as f:
              f.write(f"tracked={len(tracked)}\ntext_scanned={text_scanned}\nread_errors={read_errors}\nnonregular_skipped={skipped_nonregular}\nhits={len(rows)}\n\n")
              for path, lineno, hits, line in rows:
                  f.write(f"{path}:{lineno}: {','.join(hits)} :: {line}\n")
          print(out.read_text(encoding="utf-8"))
          if read_errors:
              raise SystemExit(f"inventory read_errors={read_errors}")
          PY

      - name: Guard against concurrent branch movement
        shell: bash
        run: |
          set -euo pipefail
          start_sha="$(cat /tmp/rca_start_sha)"
          git fetch origin ${{ github.event.pull_request.head.ref }}
          remote_sha="$(git rev-parse origin/${{ github.event.pull_request.head.ref }})"
          echo "start=$start_sha remote=$remote_sha"
          test "$start_sha" = "$remote_sha"

      - name: Commit and push functional cleanup
        shell: bash
        run: |
          set -euo pipefail
          git switch -c rca-final-cleanup-work
          git config user.name "zyx1st-png"
          git config user.email "zyx1st@gmail.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No functional changes to commit"
            exit 1
          fi
          git commit -m "Close remaining RC-A derivative gaps"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload strengthened inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-a-final-review-strengthened-inventory-v3
          path: /tmp/rca-final-review-strengthened-inventory.txt
          if-no-files-found: warn
          retention-days: 14
