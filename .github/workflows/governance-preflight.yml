name: Governance Preflight

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  refresh-l0-status-and-bundles:
    if: github.event_name == 'pull_request' && github.head_ref == 'theory/post959-l0-thinning-20260913'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out PR head with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Patch STATUS current routing or refresh bundles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("STATUS.md")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              if old in text:
                  text = text.replace(old, new, 1)
              elif new in text:
                  return
              else:
                  raise SystemExit(f"STATUS patch anchor not found: {old[:120]!r}")

          replace_once(
              "#957 已于 2026-09-13 合并为当前 whole-skeleton **非 canonical 作者检查点**；它授权 bounded owner-by-owner landing preparation，但不自动改写 canonical owners。",
              "#957 已于 2026-09-13 合并为 whole-skeleton **非 canonical 作者检查点**；#959 已完成第一只 post-#957 bounded canonical landing，当前 `Core_Law/SRT_Generative_Ontology_Spine.md` 已是 post-#959 cross-owner canonical spine。#960 正在进行第二只 owner cycle：L0 targeted thinning。"
          )

          replace_once(
              "#957 whole-skeleton minimal ontology checkpoint = MERGED / b17d4e6d36ee31e2cfbf465e0578c95be450b97b\n#957 role = NONCANONICAL AUTHOR BASELINE FOR BOUNDED OWNER LANDING\n#949 = SUPERSEDED LIVE GATE / PROVENANCE ONLY\n#956 = SUPERSEDED INTERMEDIATE CHECKPOINT / PROVENANCE ONLY\nBROAD CANONICAL REWRITE = NO\nOWNER-BY-OWNER LANDING PREPARATION = ACTIVE\nFIRST TARGET OWNER = `Core_Law/SRT_Generative_Ontology_Spine.md`",
              "#957 whole-skeleton minimal ontology checkpoint = MERGED / b17d4e6d36ee31e2cfbf465e0578c95be450b97b\n#957 role = NONCANONICAL AUTHOR BASELINE FOR BOUNDED OWNER LANDING\n#958 owner landing scope = MERGED / 2676f20b3ec0c34120870a1a191ce5969f16d45f\n#959 post-#957 Generative Ontology Spine landing = MERGED / 981d544804f935a6399fd3a309dadefc51d8ea5c\n#960 L0 targeted thinning = DRAFT / ACTIVE OWNER CYCLE\n#949 = SUPERSEDED LIVE GATE / PROVENANCE ONLY\n#956 = SUPERSEDED INTERMEDIATE CHECKPOINT / PROVENANCE ONLY\nBROAD CANONICAL REWRITE = NO\nOWNER-BY-OWNER CANONICAL LANDING = ACTIVE\nFIRST BOUNDED OWNER LANDING = COMPLETE IN #959 / GENERATIVE ONTOLOGY SPINE\nCURRENT TARGET OWNER = `Core_Law/SRT_L0_Metaphysics.md` / #960"
          )

          replace_once(
              "latest merged cross-owner canonical spine:\n#947 Land canonical generative ontology spine before old-canonical cleanup\nmerge = 9afe036b1bf35b896afa3b9900613fdfb563cfd9\nstatus = MERGED / CROSS-OWNER CANONICAL SPINE",
              "latest merged cross-owner canonical spine:\n#959 Land post-#957 minimal routing in the Generative Ontology Spine\nmerge = 981d544804f935a6399fd3a309dadefc51d8ea5c\nstatus = MERGED / POST-#957 CROSS-OWNER CANONICAL SPINE"
          )

          replace_once(
              "OLD-CANONICAL REVERSE AUDIT = RETYPED INTO BOUNDED OWNER-BY-OWNER LANDING PREPARATION\nBROAD L0 / MULTI-OWNER CANONICAL REWRITE = PROHIBITED\nFIRST BOUNDED LANDING TARGET = GENERATIVE ONTOLOGY SPINE\nlanding scope audit = `Operations/Audits/SRT_POST957_OWNER_LANDING_SCOPE_AUDIT_2026-09-13.md`",
              "OLD-CANONICAL REVERSE AUDIT = RETYPED INTO BOUNDED OWNER-BY-OWNER LANDING\nBROAD L0 / MULTI-OWNER CANONICAL REWRITE = PROHIBITED\nFIRST BOUNDED LANDING = COMPLETE IN #959 / GENERATIVE ONTOLOGY SPINE\nCURRENT BOUNDED LANDING = #960 / L0 TARGETED THINNING\ncurrent L0 scope audit = `Operations/Audits/SRT_POST959_L0_THINNING_LANDING_SCOPE_2026-09-13.md`"
          )

          replace_once(
              "3. `Core_Law/SRT_Generative_Ontology_Spine.md` — current cross-owner canonical order / non-identity / OPEN-gate owner until separately edited",
              "3. `Core_Law/SRT_Generative_Ontology_Spine.md` — post-#959 cross-owner canonical order / non-identity / OPEN-gate owner"
          )

          replace_once(
              "## Current theory spine — post-#947 canonical reading\n\n> The following remains the **current canonical reading until the bounded landing PR edits its owner**. It is intentionally not silently replaced by the noncanonical #957 checkpoint.",
              "## Current theory spine — post-#959 canonical reading\n\n> #959 has now landed the first post-#957 canonical owner rewrite. The route below is current cross-owner authority; older G0→G5 wording is superseded at the cross-owner level while compatible local-owner content survives until its own bounded cycle."
          )

          replace_once(
              "minimum non-neutrality / pre-object difference\n-> subjectless Selection\n-> manifestation + relative backgrounding\n-> active verticalization / non-flat selectable-space construction\n-> recurrent / re-entering localized vertical organization\n-> One / Selection-position",
              "[modal condition]\nnon-flat / non-neutral openness\n\n-> [primitive generative operation]\nfinite-position-indexed subjectless Selection\n= actual differentiation\n= manifestation / relative backgrounding\n= primitive verticality as same-event structural reading\n\n-- regenerative role recurrence -->\nOne"
          )

          replace_once(
              "This is now the current primary formation axis; its `active vertical organization -> One / Selection-position` semantics are canonically owned by `Core_Law/SRT_One_Formation.md`, while stronger standing remains downstream.",
              "The universal formation route now stops at **One**. `Core_Law/SRT_One_Formation.md` remains the local owner for detailed One / Selection-position semantics until its later bounded landing; it may not restore Selection-position as a second universal endpoint merely by local wording."
          )

          replace_once(
              "History remains important for continuation and lineage without becoming the source of verticality.",
              "Post-#959 guard: genuine Selection may leave an ontic before/after non-equivalence, but irreversible occurrence does not by itself establish durable, localized or recurrent historical efficacy. Where history does become effective, it can condition later Selection without becoming a second primitive source of Selection or verticality."
          )

          replace_once(
              "lineage-relative reconstitution;",
              "role-regenerative recurrence at cross-owner strength; exact lineage identity remains local / OPEN;"
          )

          replace_once(
              "Post-#947 routing:",
              "Post-#959 routing:"
          )

          replace_once(
              "#947 remains the current semantic cross-owner canonical spine **until the first bounded post-#957 landing edits it**. #952 closes the R2-A authority-propagation layer: Registry §C owns the complete citation-priority chain, the Spine owns cross-owner generation order / non-identity / OPEN routing, and compatible local owners retain local definitions. #940/#942 remain compatible local landings; #957 is the merged noncanonical author baseline for the next bounded landing sequence. No merged checkpoint by itself authorizes a broad L0 or multi-owner rewrite.",
              "#959 is the current semantic cross-owner canonical spine. #952 continues to close the R2-A authority-propagation layer: Registry §C owns the complete citation-priority chain, the Spine owns cross-owner generation order / non-identity / OPEN routing, and compatible local owners retain local definitions. #957 remains the noncanonical author baseline; #960 is the active bounded L0 owner cycle. No checkpoint or local landing authorizes a broad multi-owner rewrite."
          )

          replace_once(
              "> **2026-09-13 post-#957 override:** whole-skeleton creator–AI reconstruction has converged and #957 is merged as the noncanonical author baseline. The old `#949 required before L0 rewrite` gate is superseded. The next step is **bounded owner-by-owner landing**, beginning with the cross-owner Generative Ontology Spine. Do not perform a broad L0 rewrite or bulk reverse-audit rewrite.\n\n```text\n1. use `Operations/Audits/SRT_POST957_OWNER_LANDING_SCOPE_AUDIT_2026-09-13.md` as the noncanonical landing plan;\n2. first bounded C-class target: `Core_Law/SRT_Generative_Ontology_Spine.md` only, plus necessary audit/navigation surfaces;\n3. keep current L0 / One / P0 / d definitions binding until each separate owner landing;\n4. preserve P+E Bearer semantics while retyping Bearer placement outside the universal formation trunk;\n5. after Spine landing, run a separate L0 owner cycle for Oriented Openness inheritance, finite positionality, irreversibility and Concern typing;\n6. then run a separate One Formation owner cycle for role recurrence / lineage-presupposition thinning;\n7. Bearer placement/crosswalk and d owner are later bounded cycles only if still required;\n8. P0 minimal axioms are cross-checked throughout but are not automatically edited;\n9. prefer KEEP | RETYPE | DEMOTE | RETIRE | MERGE | SIMPLIFY | OPEN; do not invent replacement theorems to fill retired claims;\n10. preserve Level 2 HOLD, no new Level 1, and no scientific-distinctiveness promotion unless separately earned.\n```",
              "> **2026-09-13 post-#959 override:** #959 has completed the first bounded post-#957 canonical landing. The active owner cycle is now **#960 L0 targeted thinning**. Do not reopen the Spine, perform a broad L0 rewrite, or pull One / P0 / d / Bearer definitions into this PR.\n\n```text\n1. use `Operations/Audits/SRT_POST959_L0_THINNING_LANDING_SCOPE_2026-09-13.md` as the active noncanonical scope guard;\n2. active C-class target: `Core_Law/SRT_L0_Metaphysics.md`;\n3. land Oriented Openness as modal condition, finite-position-indexed primitive Selection, and ontic non-erasure without durable-history inference;\n4. preserve kappa_0 / epsilon as stronger current local commitments while leaving exact inheritance / independence / reduction OPEN;\n5. retain Concern as a relational predicate without nesting it universally with typed Bearer or d;\n6. keep P+E Bearer semantics unchanged;\n7. do not edit One Formation, P0 or d in #960;\n8. after #960, run a separate One Formation owner cycle for role recurrence / lineage-presupposition thinning;\n9. Bearer placement/crosswalk and d owner remain later bounded cycles only if still required;\n10. preserve Level 2 HOLD, no new Level 1, and no scientific-distinctiveness promotion unless separately earned.\n```"
          )

          # Add the new post-#959 OPEN burdens once, near the OPEN register.
          marker = "strict numerical identity;\n"
          addition = "Oriented Openness <-> kappa_0 / epsilon / irreversibility exact inheritance;\nirreversible occurrence -> durable / localized / recurrent historical efficacy;\nfinite positionality <-> formation locus / post-One Position / subject-position;\nConcern <-> typed Bearer exact implication / equivalence;\n"
          if addition not in text:
              if marker not in text:
                  raise SystemExit("OPEN-register insertion anchor not found")
              text = text.replace(marker, addition + marker, 1)

          path.write_text(text, encoding="utf-8")
          PY

          if ! git diff --quiet -- STATUS.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add STATUS.md
            git commit -m "status: route current work through #960 L0 landing"
            git push origin HEAD:${{ github.head_ref }}
            exit 0
          fi

          uv run python scripts/build_srt_context_bundles.py
          if ! git diff --quiet -- Operations/Context_Bundles; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Operations/Context_Bundles
            git commit -m "chore: refresh context bundles after L0 thinning"
            git push origin HEAD:${{ github.head_ref }}
          fi

  governance-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history is required for changed-file attribution, base-health
          # comparison, baseline monotonicity, and context-bundle provenance.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check base main governance health
        id: base_governance
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          base_ref="origin/${{ github.base_ref }}"
          rm -rf /tmp/srt-governance-base
          trap 'git worktree remove --force /tmp/srt-governance-base >/dev/null 2>&1 || true' EXIT
          git worktree add --detach /tmp/srt-governance-base "$base_ref"
          (
            cd /tmp/srt-governance-base
            uv run python scripts/refresh_split_metadata.py --check
            uv run python scripts/governance_preflight.py \
              --skip-write-report \
              --strict-split-metadata
          ) 2>&1 | tee base-governance-preflight.log

      - name: Check PR-local frontmatter
        id: pr_frontmatter
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/check_frontmatter_changed.py \
            --base-ref "origin/${{ github.base_ref }}" \
            --baseline Governance/Frontmatter_Warning_Baseline.txt \
            --fail-on-new-warnings \
            --suggest-fixes 2>&1 | tee pr-frontmatter.log

      - name: Enforce frontmatter baseline monotonicity
        id: baseline_monotonic
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASELINE_EXPANSION_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'governance-baseline-expansion-approved') }}
        run: |
          set -o pipefail
          args=(
            --base-ref "origin/${{ github.base_ref }}"
            --baseline Governance/Frontmatter_Warning_Baseline.txt
          )
          if [[ "$BASELINE_EXPANSION_APPROVED" == "true" ]]; then
            args+=(--allow-added)
          fi
          uv run python scripts/check_frontmatter_baseline_monotonic.py "${args[@]}" \
            2>&1 | tee baseline-monotonic.log

      - name: Check split metadata freshness
        run: uv run python scripts/refresh_split_metadata.py --check

      - name: Run governance preflight
        id: full_preflight
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/governance_preflight.py \
            --skip-write-report \
            --strict-split-metadata 2>&1 | tee governance-preflight.log

      - name: Classify governance result
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_OUTCOME: ${{ steps.base_governance.outcome }}
          LOCAL_OUTCOME: ${{ steps.pr_frontmatter.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline_monotonic.outcome }}
          FULL_OUTCOME: ${{ steps.full_preflight.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def outcome(name: str) -> str:
              value = os.environ.get(name, "").strip()
              return value or "not-run"

          event_name = outcome("EVENT_NAME")
          base = outcome("BASE_OUTCOME")
          local = outcome("LOCAL_OUTCOME")
          baseline = outcome("BASELINE_OUTCOME")
          full = outcome("FULL_OUTCOME")

          if event_name != "pull_request":
              scope = "main_push"
              disposition = "inspect_full_preflight"
              verdict = "MAIN PUSH CHECK — inspect the full preflight result."
          elif local == "failure":
              scope = "pr_local"
              disposition = "do_not_merge"
              verdict = "PR_LOCAL / LOCAL DIRTY / DO NOT MERGE."
          elif baseline == "failure":
              scope = "baseline_expansion"
              disposition = "do_not_merge"
              verdict = "PR_LOCAL BASELINE DEBT EXPANSION / DO NOT MERGE."
          elif base == "failure" and full == "success":
              scope = "base_main_repaired"
              disposition = "governance_hotfix_only"
              verdict = "BASE_MAIN WAS BLOCKED; THIS PR REPAIRS IT / HOTFIX PATH."
          elif base == "failure":
              scope = "base_main"
              disposition = "governance_hotfix_only"
              verdict = "BASE_MAIN BLOCKED / HOTFIX ONLY."
          elif full == "failure":
              scope = "merged_repository_or_infrastructure"
              disposition = "do_not_merge"
              verdict = "LOCAL FRONTMATTER CLEAN; FULL REPOSITORY OR INFRA FAILURE / DO NOT MERGE."
          else:
              scope = "none"
              disposition = "normal_merge"
              verdict = "LOCAL CLEAN / MAIN HEALTHY / NORMAL MERGE."

          payload = {
              "schema_version": 1,
              "event_name": event_name,
              "failure_scope": scope,
              "merge_disposition": disposition,
              "base_main_health": base,
              "pr_local_frontmatter": local,
              "baseline_monotonicity": baseline,
              "merged_repository_preflight": full,
              "verdict": verdict,
          }
          Path("governance-attribution.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## Governance failure attribution\n\n")
              handle.write("| Scope | Outcome |\n")
              handle.write("|---|---|\n")
              handle.write(f"| base_main_governance | {base} |\n")
              handle.write(f"| pr_local_frontmatter | {local} |\n")
              handle.write(f"| baseline_monotonicity | {baseline} |\n")
              handle.write(f"| merged_repository_preflight | {full} |\n\n")
              handle.write(f"**Verdict:** {verdict}\n")

          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Upload governance preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-preflight-diagnostics
          path: |
            governance-preflight.log
            base-governance-preflight.log
            pr-frontmatter.log
            baseline-monotonic.log
            governance-attribution.json
          if-no-files-found: warn
          retention-days: 14
