name: Governance Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync-generated-context-bundles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate context bundles
        run: uv run python scripts/build_srt_context_bundles.py

      - name: Commit generated bundles if changed
        shell: bash
        run: |
          if git diff --quiet -- Operations/Context_Bundles; then
            echo "Context bundles already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Operations/Context_Bundles
          git commit -m "regenerate context bundles after Selection semantic hardening"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
