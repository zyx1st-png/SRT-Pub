name: Governance Preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  r2c-closeout:
    if: github.head_ref == 'governance/r2c-supersession-ledger-freeze-gate-20260912'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: governance/r2c-supersession-ledger-freeze-gate-20260912
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply R2-C STATUS closeout
        run: uv run python scripts/tmp_r2c_closeout.py

      - name: Commit clean source state
        shell: bash
        run: |
          git config user.name "zyx1st-png"
          git config user.email "zyx1st@gmail.com"
          git add STATUS.md
          git diff --cached --quiet || git commit -m "R2-C: close programme status under author option A"

      - name: Regenerate context bundles
        shell: bash
        run: |
          uv run python scripts/build_srt_context_bundles.py --generated-date 2026-09-12
          git add Operations/Context_Bundles
          git diff --cached --quiet || git commit -m "R2-C: regenerate context bundles after closeout"

      - name: Restore permanent workflow and remove helper
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/governance-preflight.yml
          git rm scripts/tmp_r2c_closeout.py
          git add .github/workflows/governance-preflight.yml
          git diff --cached --quiet || git commit -m "R2-C: remove temporary closeout machinery"

      - name: Validate final tree
        shell: bash
        run: |
          uv run python scripts/build_srt_context_bundles.py --check
          uv run python scripts/refresh_split_metadata.py --check
          uv run python scripts/governance_preflight.py --skip-write-report --strict-split-metadata

      - name: Push final closeout
        shell: bash
        run: git push origin HEAD:governance/r2c-supersession-ledger-freeze-gate-20260912
