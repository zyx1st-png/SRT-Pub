name: Temporary regenerate context bundles for PR 929

on:
  push:
    branches:
      - theory/d3d4-manifestation-strongest-neighbor-20260910

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Regenerate context bundles
        run: uv run python scripts/build_srt_context_bundles.py

      - name: Commit generated bundles when changed
        shell: bash
        run: |
          if git diff --quiet -- Operations/Context_Bundles; then
            echo "Context bundles already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Operations/Context_Bundles
          git commit -m "Regenerate context bundles after D3/D4 status sync"
          git push origin HEAD:theory/d3d4-manifestation-strongest-neighbor-20260910
