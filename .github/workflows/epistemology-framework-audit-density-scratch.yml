name: Epistemology Framework Audit Density Scratch

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: epistemology/domain-reconstruction-framework-20260904
      - name: Expand patch and forcing re-entry fields
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('Philosophy/SRT_Epistemology_Reconstruction_Framework.md')
          s = p.read_text(encoding='utf-8')
          old_log = '| Material Log / recent material indices | checked: `Operations/_SRT_MATERIAL_LOG.md` plus relevant July/August split logs (`2026-07_Part01`, `2026-08_Part02`, `2026-08_Part04`, `2026-08_Part06`) | used to verify Pipeline-1 routing/status; no log entry is treated as source evidence |'
          new_log = '| Material Log / recent material indices | checked: `Operations/_SRT_MATERIAL_LOG.md` plus relevant split logs across May–August (`2026-05_Part01`, `2026-06_Part01`, `2026-07_Part01`, `2026-08_Part02`, `2026-08_Part04`, `2026-08_Part06`) | used to verify Pipeline-1 routing/status; no log entry is treated as source evidence |'
          if old_log not in s:
              raise SystemExit('material-log row anchor not found')
          s = s.replace(old_log, new_log, 1)
          s = s.replace('| Fjelland / IAI — disunity of science | public philosophy pressure against globalizing local model success into total ontology | E3, E7 | pluralism / model-reality guardrail | not an SRT increment question / B-watchlist | deferred | `B_watchlist` public commentary; useful only as weak pressure, not baseline authority |\n### 5.2a', '| Fjelland / IAI — disunity of science | public philosophy pressure against globalizing local model success into total ontology | E3, E7 | pluralism / model-reality guardrail | not an SRT increment question / B-watchlist | deferred | `B_watchlist` public commentary; useful only as weak pressure, not baseline authority |\n\n### 5.2a', 1)
          pb64 = ''
          fb64 = ''
          patch_block = base64.b64decode(pb64).decode('utf-8')
          forcing_block = base64.b64decode(fb64).decode('utf-8')
          pstart = s.index('### 5.3 Patch / Hook re-entry matrix')
          pend = s.index('### 5.4 Forcing–CH project re-entry matrix')
          s = s[:pstart] + patch_block + s[pend:]
          fstart = s.index('### 5.4 Forcing–CH project re-entry matrix')
          fend = s.index('### 5.5 Material completeness statement')
          s = s[:fstart] + forcing_block + s[fend:]
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Philosophy/SRT_Epistemology_Reconstruction_Framework.md
          git commit -m "Harden Epistemology material re-entry audit fields"
          git push origin HEAD:epistemology/domain-reconstruction-framework-20260904
