name: Epistemology Material Re-entry Scan Scratch

on:
  push:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Scan epistemology material surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          terms = re.compile(r'epistem|knowledge|method|proof|mathemat|reason|evidence|justif|objectiv|certainty|uncertainty|measurement|incompatib|understanding|memory|historical|representation|logic|forcing|g[oö]del', re.I)
          high = re.compile(r'(very[_ -]?high|high)', re.I)

          def frontmatter(text):
              if not text.startswith('---\n'): return ''
              j = text.find('\n---\n', 4)
              return text[4:j] if j >= 0 else ''

          print('=== HIGH/VERY-HIGH MATERIAL CANDIDATES ===')
          cards=[]
          for p in sorted((ROOT/'Materials/2026').glob('SRC_*.md')):
              txt=p.read_text(encoding='utf-8',errors='ignore')
              fm=frontmatter(txt)
              if high.search(fm) and terms.search(fm+'\n'+txt[:5000]):
                  priority='?'
                  m=re.search(r'(?im)^(?:priority|relevance|material_priority|srt_priority):\s*(.+)$',fm)
                  if m: priority=m.group(1).strip()
                  domain=''
                  m=re.search(r'(?im)^domain:\s*(.+)$',fm)
                  if m: domain=m.group(1).strip()
                  cards.append((str(p),priority,domain))
          for row in cards: print('CARD\t'+'\t'.join(row))
          print('CARD_COUNT',len(cards))

          print('\n=== ACTIVE PHILOSOPHY PATCH/HOOK CANDIDATES ===')
          ph=[]
          for base in [ROOT/'Philosophy/patches', ROOT/'Philosophy/hooks']:
              if not base.exists(): continue
              for p in sorted(base.glob('*.md')):
                  txt=p.read_text(encoding='utf-8',errors='ignore')
                  fm=frontmatter(txt)
                  if terms.search(fm+'\n'+txt[:6000]) and re.search(r'(?im)^status:\s*(active|patch|patch_v0_1|pending|integration_plan)',fm):
                      ph.append(str(p))
          for p in ph: print('PH\t'+p)
          print('PH_COUNT',len(ph))

          print('\n=== EPISTEMOLOGY / METHOD OWNER-LIKE FILES ===')
          owner=[]
          for p in sorted((ROOT/'Philosophy').glob('*.md')):
              if terms.search(p.name): owner.append(str(p))
          for p in sorted((ROOT/'Philosophy/Papers').glob('*.md')):
              if terms.search(p.name): owner.append(str(p))
          for p in owner: print('OWNER\t'+p)
          print('OWNER_COUNT',len(owner))

          print('\n=== FORCING-CH EVIDENCE ASSETS ===')
          fdir=ROOT/'Philosophy/Papers/Forcing_CH_Evidence'
          files=sorted(fdir.glob('*.md')) if fdir.exists() else []
          for p in files: print('FORCING\t'+str(p))
          print('FORCING_COUNT',len(files))
          PY
