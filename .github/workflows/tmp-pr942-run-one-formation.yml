name: Temporary PR942 One Formation Runner

on:
  push:
    branches:
      - theory/r1-one-formation-canonical-landing-20260911

permissions:
  contents: write

jobs:
  land:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: theory/r1-one-formation-canonical-landing-20260911

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply bounded crosswalk edits
        run: python scripts/tmp_pr942_land_one_formation.py

      - name: Regenerate context bundles
        run: uv run python scripts/build_srt_context_bundles.py --generated-date 2026-09-11

      - name: Commit landing changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No landing changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core Core_Law CANONICAL_REGISTRY.md Operations/Context_Bundles
          git commit -m "Land R1 One formation owner crosswalks"
          git push origin HEAD:theory/r1-one-formation-canonical-landing-20260911
