name: Temporary Frontmatter Baseline Refresh

on:
  push:
    branches:
      - agent/backlog-reconciliation-20260805

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/backlog-reconciliation-20260805

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Regenerate warning baseline
        run: uv run python scripts/check_frontmatter.py --write-baseline Governance/Frontmatter_Warning_Baseline.txt

      - name: Commit refreshed baseline
        run: |
          if git diff --quiet -- Governance/Frontmatter_Warning_Baseline.txt; then
            echo "Baseline already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Governance/Frontmatter_Warning_Baseline.txt
          git commit -m "Refresh frontmatter warning baseline after backlog cleanup"
          git push origin HEAD:agent/backlog-reconciliation-20260805
