name: Temporary Refresh Context Bundles 958

on:
  push:
    branches:
      - theory/owner-landing-scope-audit-20260913

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'chore: add temporary context bundle refresh workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: theory/owner-landing-scope-audit-20260913

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Regenerate context bundles
        run: python scripts/build_srt_context_bundles.py

      - name: Commit generated bundles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Operations/Context_Bundles/
          if git diff --cached --quiet; then
            echo 'No generated bundle changes.'
            exit 0
          fi
          git commit -m 'chore: refresh generated context bundles after STATUS routing update'
          git push origin HEAD:theory/owner-landing-scope-audit-20260913
