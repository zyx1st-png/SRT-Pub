name: Epistemology Context Bundle Refresh Scratch

on:
  push:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: epistemology/framework-routing-sync-20260904
      - uses: astral-sh/setup-uv@v5
      - name: Regenerate context bundles mechanically
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/build_srt_context_bundles.py
          echo '--- generated delta ---'
          git status --short
          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^Operations/Context_Bundles/' || true)"
          if [ -n "$bad" ]; then
            echo 'ERROR: generator changed files outside Operations/Context_Bundles/' >&2
            echo "$bad" >&2
            exit 1
          fi
          if git diff --quiet -- Operations/Context_Bundles; then
            echo 'ERROR: expected a generated bundle delta but found none' >&2
            exit 1
          fi
          uv run python scripts/build_srt_context_bundles.py --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Operations/Context_Bundles
          git commit -m "Refresh context bundles after Epistemology routing sync"
          git push origin HEAD:epistemology/framework-routing-sync-20260904
