name: Cambridge PDF Metadata Probe Fresh

on:
  push:
    branches:
      - scratch/cambridge-pdf-meta-probe-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and test Cambridge-declared PDF routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,re,html,urllib.parse,os
          items=[
            ('CHWISTEK_HETPER','https://www.cambridge.org/core/journals/journal-of-symbolic-logic/article/abs/new-foundation-of-formal-metamathematics/81E64DC8298829C660E29B06AFD68CBC'),
            ('PEPIS','https://www.cambridge.org/core/journals/journal-of-symbolic-logic/article/abs/ein-verfahren-der-mathematischen-logik/3A68B8DA77EBE43CB6D09DDE8CF059C1'),
            ('REACH','https://www.cambridge.org/core/journals/journal-of-symbolic-logic/article/abs/name-relation-and-the-logical-antinomies/17107FF2C695CBA62BBEAA9C27F74AB8'),
            ('FITCH','https://www.cambridge.org/core/journals/journal-of-symbolic-logic/article/abs/consistency-of-the-ramified-principia/DE99BD1CD5BC6F11D340837BC157DB50'),
          ]
          for key,url in items:
              print(f'=== {key} ===')
              out=f'/tmp/{key}.html'
              fmt='HTML_HTTP=%{http_code} HTML_TYPE=%{content_type} HTML_SIZE=%{size_download} HTML_FINAL=%{url_effective}'
              cp=subprocess.run(['curl','-L','--connect-timeout','20','--max-time','90','-sS','-A','Mozilla/5.0','-o',out,'-w',fmt,url],capture_output=True,text=True)
              print(cp.stdout.strip())
              s=open(out,'rb').read().decode('utf-8','ignore') if os.path.exists(out) else ''
              candidates=[]
              pats=[
                r'<meta[^>]+name=["\']citation_pdf_url["\'][^>]+content=["\']([^"\']+)',
                r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']citation_pdf_url["\']',
                r'href=["\']([^"\']+\.pdf(?:\?[^"\']*)?)["\']',
                r'"pdfUrl"\s*:\s*"([^"]+)"',
                r'"downloadUrl"\s*:\s*"([^"]+\.pdf[^"]*)"',
              ]
              for pat in pats:
                  for m in re.finditer(pat,s,re.I):
                      v=html.unescape(m.group(1)).replace('\\u002F','/').replace('\\/','/')
                      v=urllib.parse.urljoin(url,v)
                      if v not in candidates: candidates.append(v)
              print('PDF_CANDIDATES='+str(len(candidates)))
              for i,v in enumerate(candidates[:10],1):
                  print(f'CANDIDATE_{i}={v}')
                  bout=f'/tmp/{key}_{i}.bin'
                  fmt2='PDF_HTTP=%{http_code} PDF_TYPE=%{content_type} PDF_SIZE=%{size_download} PDF_FINAL=%{url_effective}'
                  cp2=subprocess.run(['curl','-L','--connect-timeout','20','--max-time','90','-sS','-A','Mozilla/5.0','-o',bout,'-w',fmt2,v],capture_output=True,text=True)
                  print(cp2.stdout.strip())
                  ft=subprocess.run(['file','-b',bout],capture_output=True,text=True).stdout.strip() if os.path.exists(bout) else 'MISSING'
                  print('PDF_FILE='+ft)
          PY
