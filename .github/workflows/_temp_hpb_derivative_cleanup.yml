name: Temporary HP-B Derivative Cleanup

on:
  push:
    branches:
      - agent/hpb-derivative-cleanup-20260816

permissions:
  contents: write

jobs:
  apply-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dated provenance corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          audit = Path("01_Source_Intuition/BOOK/BOOK_QUALIA_NECESSITY_EMBEDDING_AUDIT_2026-06-06.md")
          text = audit.read_text(encoding="utf-8")
          anchor = '> 核心判断：感受质问题不是正文支线，而是全书必要性证明的一枚钉子。它要显示：仅靠对象、信息、功能、行为、报告，无法完整解释"被承受的现实"。因此本书必须引入选择、压缩、承担、具身位、L1/L2 落差这些结构。\n'
          note = '''\n> **2026-08-16 HP-B-B 更正 / supersession notice**\n>\n> 本审计是 2026-06-06 的历史编辑提案，早于 2026-08-16 的 phenomenal-necessity 作者裁决（`Operations/SRT_PHENOMENAL_NECESSITY_AUTHOR_DECISION_PACKET_2026-08-16.md`）。凡下文把 `Philosophy/SRT_HardProblem_Epistemology.md` 描述为“完整消解已完成”，把三因子写成足以决定具体感受质，或把解释跳跃全部等同于 `L2` 对 `L1` 的压缩损失，均已被 HP-B-B **实质取代，不再代表当前 SRT 立场**。\n>\n> 当前 owner 为 `claim_mode: mixed`：`B_s != B_p`，`B_s -> B_p` 仍开放；三因子仅是在 phenomenality 已独立成立前提下的 P3 结构锚定候选；对象化、位置差异与 `L2` 压缩只能解释第三人称描述为何不等于原 situated event 的一部分，不能单独推出 phenomenal necessity 或 qualitative character。下文保留原文仅用于保存 2026-06-06 的编辑决策 provenance，不应被 fresh session 读取为新的正文加固授权。\n'''
          if note.strip() not in text:
              if anchor not in text:
                  raise SystemExit("book audit anchor not found")
              text = text.replace(anchor, anchor + note, 1)
              audit.write_text(text, encoding="utf-8")

          conv = Path("01_Source_Intuition/Conversations/2026-07-13_SRT_意识解释力_补充说明.md")
          text = conv.read_text(encoding="utf-8")
          old1 = '来源：`Philosophy/SRT_HardProblem_Epistemology.md`（`claim_mode: dissolution`）。'
          new1 = '来源：`Philosophy/SRT_HardProblem_Epistemology.md`（2026-07-13 写作时为 `claim_mode: dissolution`；2026-08-16 经 HP-B-B 裁决后 owner 当前为 `claim_mode: mixed`）。'
          old2 = '| `Philosophy/SRT_HardProblem_Epistemology.md` | L1 哲学，dissolution |'
          new2 = '| `Philosophy/SRT_HardProblem_Epistemology.md` | L1 哲学；2026-07-13 写作时 dissolution，2026-08-16 HP-B-B 后 mixed |'
          if old1 in text:
              text = text.replace(old1, new1, 1)
          elif new1 not in text:
              raise SystemExit("conversation §4 source anchor not found")
          if old2 in text:
              text = text.replace(old2, new2, 1)
          elif new2 not in text:
              raise SystemExit("conversation source-table anchor not found")
          conv.write_text(text, encoding="utf-8")
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_Source_Intuition/BOOK/BOOK_QUALIA_NECESSITY_EMBEDDING_AUDIT_2026-06-06.md 01_Source_Intuition/Conversations/2026-07-13_SRT_意识解释力_补充说明.md
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Correct HP-B derivative provenance"
          git push origin "HEAD:${GITHUB_REF_NAME}"
