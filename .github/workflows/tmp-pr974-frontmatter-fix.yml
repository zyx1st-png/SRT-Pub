name: Temporary PR974 Frontmatter Fix

on:
  push:
    branches:
      - theory/selection-strongest-composite-rival-20260913

permissions:
  contents: write

jobs:
  fix-frontmatter:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: theory/selection-strongest-composite-rival-20260913
      - name: Fix frontmatter key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Operations/Audits/SRT_SELECTION_CSI_FOUR_SCALE_REALIZATION_PRESSURE_2026-09-14.md')
          text = p.read_text(encoding='utf-8')
          old = 'epistem_layer: os\n'
          new = 'epistemic_layer: os\n'
          if old not in text:
              raise SystemExit('expected frontmatter key not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Operations/Audits/SRT_SELECTION_CSI_FOUR_SCALE_REALIZATION_PRESSURE_2026-09-14.md
          git commit -m 'fix: correct four-scale audit frontmatter key'
          git push origin HEAD:theory/selection-strongest-composite-rival-20260913
