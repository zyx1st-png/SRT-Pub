name: TEMP Cycle1 Context Bundle Refresh

on:
  push:
    branches:
      - theory/author-reentry-cycle1-one-formation-20260905

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: theory/author-reentry-cycle1-one-formation-20260905

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore retained STATUS guardrail and commit locally
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('STATUS.md')
          text = p.read_text(encoding='utf-8')
          anchor = '已加下游护栏：符号重命名与 `q` / `o` 的形式选择做出前，`d/q/o` 不得进入书稿、公共内容、bridge 或论文。'
          if anchor not in text:
              needle = '- Pipeline 1 / SourceCard / Material Log 继续有效：外部材料可提供 factual evidence、resonance、contrast、pressure、mechanism example、domain constraint；不得写成“来源证明 Constitution”。'
              if needle not in text:
                  raise SystemExit('STATUS insertion anchor missing')
              text = text.replace(needle, needle + '\n- ' + anchor, 1)
              p.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Restore retained d/q/o status guardrail'
          fi

      - name: Regenerate context bundles from clean committed inputs
        shell: bash
        run: |
          uv run python scripts/build_srt_context_bundles.py
          git add Operations/Context_Bundles
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh context bundles for Cycle 1 closure'
          fi

      - name: Push refresh commits
        shell: bash
        run: |
          git push origin HEAD:theory/author-reentry-cycle1-one-formation-20260905
