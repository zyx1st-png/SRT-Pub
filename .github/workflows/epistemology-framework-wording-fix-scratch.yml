name: Epistemology Framework Wording Fix Scratch

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: epistemology/domain-reconstruction-framework-20260904
      - name: Tighten Draft #889 archive authorization wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Philosophy/SRT_Epistemology_Reconstruction_Framework.md')
          s = p.read_text(encoding='utf-8')
          old = 'bounded archive assembly = allowed by Draft #889 Phase-8A pilot, pending clean migration'
          new = 'Draft #889 pilot records bounded archive assembly = GO; actual archive execution remains paused until clean migration lands'
          if old not in s:
              raise SystemExit('authorization wording anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Philosophy/SRT_Epistemology_Reconstruction_Framework.md
          git commit -m "Clarify Epistemology archive authorization boundary"
          git push origin HEAD:epistemology/domain-reconstruction-framework-20260904
