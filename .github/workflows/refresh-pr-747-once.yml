name: Refresh PR 747 Once

on:
  push:
    branches:
      - agent/ph-consc03-subjectivity-decomposition

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ph-consc03-subjectivity-decomposition
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Merge latest main and resolve repository metadata conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "latest main already contained"
            exit 0
          fi
          set +e
          git merge --no-ff --no-commit origin/main
          rc=$?
          set -e
          if [[ $rc -ne 0 ]]; then
            python - <<'PY'
          import subprocess
          from pathlib import Path

          def sh(*args, check=True):
              return subprocess.run(args, text=True, capture_output=True, check=check)

          conflicts = sh('git','diff','--name-only','--diff-filter=U').stdout.splitlines()
          print('conflicts:', conflicts)
          for rel in conflicts:
              p = Path(rel)
              if rel.startswith('Operations/Context_Bundles/'):
                  sh('git','checkout','--theirs','--',rel)
                  sh('git','add','--',rel)
                  continue
              if rel.startswith('Registries/') and p.suffix == '.jsonl':
                  ours = sh('git','show',f':2:{rel}').stdout.splitlines()
                  theirs = sh('git','show',f':3:{rel}').stdout.splitlines()
                  seen=set(); out=[]
                  for line in [*theirs,*ours]:
                      if line not in seen:
                          seen.add(line); out.append(line)
                  p.write_text('\n'.join(out).rstrip()+'\n', encoding='utf-8')
                  sh('git','add','--',rel)
                  continue
              base = sh('git','show',f':1:{rel}',check=False).stdout
              ours = sh('git','show',f':2:{rel}',check=False).stdout
              theirs = sh('git','show',f':3:{rel}',check=False).stdout
              tmp=Path('/tmp'); a=tmp/'ours'; b=tmp/'base'; c=tmp/'theirs'
              a.write_text(ours,encoding='utf-8'); b.write_text(base,encoding='utf-8'); c.write_text(theirs,encoding='utf-8')
              merged = subprocess.run(['git','merge-file','-p','--union',str(a),str(b),str(c)],text=True,capture_output=True,check=False).stdout
              p.write_text(merged,encoding='utf-8')
              sh('git','add','--',rel)
          left=sh('git','diff','--name-only','--diff-filter=U').stdout.strip()
          if left:
              raise SystemExit('unresolved conflicts remain: '+left)
          PY
          fi
          git commit -m "Merge latest main into PR 747"
      - name: Refresh generated metadata if needed
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/refresh_split_metadata.py
          if ! uv run python scripts/build_srt_context_bundles.py --check; then
            uv run python scripts/build_srt_context_bundles.py
          fi
          if ! git diff --quiet; then
            git add -A
            git diff --cached --check
            git commit -m "Refresh generated governance metadata"
          fi
      - name: Verify governance
        run: |
          uv run python scripts/refresh_split_metadata.py --check
          uv run python scripts/governance_preflight.py --skip-write-report --strict-split-metadata
      - name: Push refreshed branch
        run: git push origin HEAD:agent/ph-consc03-subjectivity-decomposition
