name: Temporary R2-A review fix

on:
  push:
    branches:
      - governance/r2a-authority-truth-up-20260912

permissions:
  contents: write

jobs:
  fix-review-findings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/r2a-authority-truth-up-20260912
          fetch-depth: 0

      - name: Apply bounded R2-A routing fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('_SRT_INDEX.md')
          text = p.read_text(encoding='utf-8')
          start = text.index('## Authority Order\n')
          end = text.index('\n以下层默认不承担最终定义权：', start)
          replacement = (
              '## Authority Order\n\n'
              '本索引**不维护第二套完整 canonical 引用优先级**。完整的当前 citation priority 唯一回链：\n\n'
              '`CANONICAL_REGISTRY.md §C`\n\n'
              '涉及跨 owner 的本体生成顺序、非同一性、OPEN gate 与 old-canonical cleanup 时，按以下权威关系判读：\n\n'
              '`CANONICAL_REGISTRY.md` → `Core_Law/SRT_Generative_Ontology_Spine.md` → compatible local owners\n\n'
              '本页其余 anchor / entrypoint 清单只用于机器路由与 owner 定位，不构成另一套优先级链。\n'
          )
          text = text[:start] + replacement + text[end:]
          marker = '## Canonical Theory Anchors\n\n'
          note = (
              '## Canonical Theory Anchors\n\n'
              '> **Routing inventory only.** 以下条目帮助定位局部 owner；其排列不构成 citation-priority order。'
              ' 完整优先级仍以 `CANONICAL_REGISTRY.md §C` 为唯一 owner，跨 owner 本体关系先经过'
              ' `Core_Law/SRT_Generative_Ontology_Spine.md`。\n\n'
          )
          if marker not in text:
              raise SystemExit('missing Canonical Theory Anchors marker')
          text = text.replace(marker, note, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('AGENTS.md')
          text = p.read_text(encoding='utf-8')
          old = (
              'Authority routing is single-source: use `CANONICAL_REGISTRY.md §C` for the complete current citation priority. '
              'For ontology-order / canonical-cleanup work, load `Core_Law/SRT_Generative_Ontology_Spine.md` after the Registry '
              'and before compatible local owners; do not reconstruct a competing complete authority chain in runtime files.'
          )
          new = (
              'Authority routing is single-source: use `CANONICAL_REGISTRY.md §C` for the complete current citation priority. '
              'When adjudicating cross-owner ontology generation order, non-identities, OPEN gates or old-canonical overreach, '
              'use `Core_Law/SRT_Generative_Ontology_Spine.md` as the cross-owner owner before compatible local owners. '
              '`STATUS.md` may specify a task-local working read sequence; that sequence is not a second citation-priority chain. '
              'Do not reconstruct a competing complete authority chain in runtime files.'
          )
          if old not in text:
              raise SystemExit('expected AGENTS routing sentence not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('scripts/check_authority_routing.py')
          text = p.read_text(encoding='utf-8')
          anchor = (
              'require("AGENTS.md", "完整 canonical 引用优先级唯一 owner")\n'
              'require("AGENTS.md", "跨 owner 本体生成主轴")\n'
          )
          insert = (
              anchor + '\n'
              'require("_SRT_INDEX.md", "CANONICAL_REGISTRY.md §C")\n'
              'require("_SRT_INDEX.md", "Core_Law/SRT_Generative_Ontology_Spine.md")\n'
              'forbid("_SRT_INDEX.md", "默认权威顺序：")\n'
          )
          if anchor not in text:
              raise SystemExit('expected checker insertion anchor not found')
          p.write_text(text.replace(anchor, insert, 1), encoding='utf-8')
          PY

      - name: Remove temporary workflow before validation
        run: rm .github/workflows/tmp_r2a_review_fix.yml

      - name: Run governance preflight on repaired tree
        run: python scripts/governance_preflight.py

      - name: Commit repaired R2-A tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix R2-A independent-review routing gaps"
          git push origin HEAD:governance/r2a-authority-truth-up-20260912
