name: Refresh context bundles PR926

on:
  push:
    branches:
      - materials/bowler-structured-experience-20260908

permissions:
  contents: write

jobs:
  refresh-context-bundles:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'Refresh deterministic context bundles for PR 926')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate deterministic context bundles
        run: python3 scripts/build_srt_context_bundles.py

      - name: Commit refreshed bundles when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Operations/Context_Bundles; then
            echo "Context bundles already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Operations/Context_Bundles
          git commit -m "Refresh deterministic context bundles for PR 926"
          git push origin HEAD:${GITHUB_REF_NAME}
