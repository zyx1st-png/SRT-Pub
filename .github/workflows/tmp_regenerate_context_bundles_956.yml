name: tmp-regenerate-context-bundles-956

on:
  push:
    branches:
      - theory/creator-ai-skeleton-checkpoint-20260912
    paths:
      - .github/workflows/tmp_regenerate_context_bundles_956.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: theory/creator-ai-skeleton-checkpoint-20260912
          fetch-depth: 0
      - name: Regenerate context bundles from clean committed source
        run: |
          test -z "$(git status --porcelain)"
          python scripts/build_srt_context_bundles.py
          git status --short
      - name: Commit regenerated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Operations/Context_Bundles
          if git diff --cached --quiet; then
            echo "No bundle changes"
            exit 0
          fi
          git commit -m "Regenerate context bundles for creator-AI checkpoint"
          git push origin HEAD:theory/creator-ai-skeleton-checkpoint-20260912
