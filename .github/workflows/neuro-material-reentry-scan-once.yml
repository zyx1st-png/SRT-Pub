name: Neuroscience Framework Bundle Refresh Once

on:
  push:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: neuroscience-domain-reconstruction-framework-20260904
      - name: Add Framework to Neuroscience bundle inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_srt_context_bundles.py')
          s = p.read_text(encoding='utf-8')
          old = '"nav": ["Neuroscience/NEUROSCIENCE_COMPACT_REGISTRY.md", "Neuroscience/README.md"],'
          new = '"nav": ["Neuroscience/SRT_Neuroscience_Reconstruction_Framework.md", "Neuroscience/NEUROSCIENCE_COMPACT_REGISTRY.md", "Neuroscience/README.md"],'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          elif new not in s:
              raise SystemExit('Neuroscience bundle config anchor changed')
          PY
      - name: Regenerate and test bundles
        run: |
          python scripts/build_srt_context_bundles.py --generated-date 2026-09-04
          python scripts/test_build_context_bundles.py
          python scripts/build_srt_context_bundles.py --check
      - name: Commit builder and generated bundles
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build_srt_context_bundles.py Operations/Context_Bundles/
          git diff --cached --quiet && exit 0
          git commit -m "Load Neuroscience Framework in domain context bundle"
          git push origin HEAD:neuroscience-domain-reconstruction-framework-20260904
