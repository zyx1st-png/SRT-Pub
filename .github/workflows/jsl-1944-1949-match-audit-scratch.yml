name: JSL 1944-1949 Final Residual Probe Scratch

on:
  push:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8b/jsl-1944-1949-archive-assembly-20260904
      - name: Inspect publisher-native sections for three residual records
        shell: bash
        run: |
          python -m pip -q install requests beautifulsoup4
          python - <<'PY'
          import re, requests, unicodedata
          from bs4 import BeautifulSoup
          H={'User-Agent':'SRT-archive-assembly/0.1 (fixed-boundary metadata sweep)'}
          issues={
            '12-1':'https://www.cambridge.org/core/journals/journal-of-symbolic-logic/issue/F860AD8E256EDC0FC939BBADCBF05125',
            '12-4':'https://www.cambridge.org/core/journals/journal-of-symbolic-logic/issue/B568F2083281B2637DE70D66B000C4DA',
          }
          def norm(s):
              s=unicodedata.normalize('NFKD',s or '')
              s=''.join(c for c in s if not unicodedata.combining(c)).lower()
              return re.sub(r'[^a-z0-9]+',' ',s).strip()
          for key,u in issues.items():
              r=requests.get(u,headers=H,timeout=90); r.raise_for_status()
              s=BeautifulSoup(r.text,'html.parser')
              nums=[int(m.group(1)) for a in s.find_all('a') for m in [re.search(r'[?&]pageNum=(\d+)',a.get('href') or '')] if m]
              maxp=max(nums) if nums else 1
              print('ISSUE',key,'MAXP',maxp)
              for pn in range(1,maxp+1):
                  pr=requests.get(u+f'?pageNum={pn}',headers=H,timeout=90); pr.raise_for_status()
                  ps=BeautifulSoup(pr.text,'html.parser')
                  sec=''
                  for el in ps.select('h4.journal-article-listing-type, div.product-listing-with-inputs-content'):
                      if el.name=='h4':
                          sec=' '.join(el.stripped_strings); continue
                      a=el.select_one('li.title h3 a.part-link')
                      if not a: continue
                      for sup in a.find_all('sup'): sup.decompose()
                      title=' '.join(a.stripped_strings).strip()
                      txt=' '.join(el.stripped_strings)
                      nt=norm(txt)
                      hit=False
                      if key=='12-1' and ('errata' in norm(title) or sec.lower()=='errata' or re.search(r'\bpp?\.\s*32\b',txt,re.I)):
                          hit=True
                      if key=='12-4' and ('glivenko' in nt or 'brouwer' in nt or re.search(r'\bpp?\.\s*147(?:\D|$)',txt,re.I)):
                          hit=True
                      if hit:
                          print('HIT','ISSUE',key,'PAGEINDEX',pn,'SECTION',repr(sec),'TITLE',repr(title))
                          print('TEXT',txt[:5000])
              print('---')
          PY
