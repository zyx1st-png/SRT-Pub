name: JSL 1944-1949 Residual Section Resolver Scratch

on:
  push:

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8b/jsl-1944-1949-archive-assembly-20260904
      - name: Resolve Crossref records embedded inside Cambridge cards
        shell: bash
        run: |
          python -m pip -q install requests beautifulsoup4
          python - <<'PY'
          import re, unicodedata, requests
          from bs4 import BeautifulSoup
          from collections import defaultdict, Counter
          from difflib import SequenceMatcher

          H={'User-Agent':'SRT-archive-assembly/0.1 (fixed-boundary metadata sweep)'}
          BASE='https://www.cambridge.org/core/journals/journal-of-symbolic-logic/all-issues'

          def norm(s):
              s=unicodedata.normalize('NFKD', s or '')
              s=''.join(c for c in s if not unicodedata.combining(c)).lower()
              return re.sub(r'[^a-z0-9]+',' ',s).strip()

          crurl=('https://api.crossref.org/journals/0022-4812/works?'
                 'filter=from-pub-date:1944-01-01,until-pub-date:1949-12-31&rows=1000')
          raw=requests.get(crurl,headers=H,timeout=90); raw.raise_for_status()
          cr=[]
          for x in raw.json()['message']['items']:
              title=(x.get('title') or [''])[0]
              cr.append({'vol':str(x.get('volume') or ''),'iss':str(x.get('issue') or ''),
                         'page':str(x.get('page') or ''),'title':title,'nt':norm(title),'doi':x.get('DOI') or ''})

          allr=requests.get(BASE,headers=H,timeout=90); allr.raise_for_status()
          soup=BeautifulSoup(allr.text,'html.parser')
          current=None; found=[]
          for a in soup.find_all('a'):
              text=' '.join(a.stripped_strings)
              m=re.search(r'(1949-1950|1948|1947|1946|1945|1944)\s*-\s*Volume\s+(14|13|12|11|10|9)',text)
              if m: current=(m.group(1),m.group(2)); continue
              href=a.get('href') or ''
              im=re.search(r'Issue\s+(\d+)',text)
              if current and im and '/issue/' in href:
                  found.append((current[1],im.group(1),requests.compat.urljoin(BASE,href)))
              if current and re.search(r'1943\s*-\s*Volume\s+8',text): current=None
          seen=set(); issues=[]
          for vol,iss,u in found:
              if (vol,iss) in seen: continue
              seen.add((vol,iss))
              if vol=='14' and iss=='4': continue
              issues.append((vol,iss,u))

          cards=[]
          for vol,iss,u in issues:
              r=requests.get(u,headers=H,timeout=90); r.raise_for_status()
              s=BeautifulSoup(r.text,'html.parser')
              nums=[int(m.group(1)) for a in s.find_all('a') for m in [re.search(r'[?&]pageNum=(\d+)',a.get('href') or '')] if m]
              maxp=max(nums) if nums else 1
              seen_card=set()
              for pn in range(1,maxp+1):
                  pr=requests.get(u+f'?pageNum={pn}',headers=H,timeout=90); pr.raise_for_status()
                  ps=BeautifulSoup(pr.text,'html.parser')
                  current_sec=''
                  for el in ps.select('h4.journal-article-listing-type, div.product-listing-with-inputs-content'):
                      if el.name=='h4':
                          current_sec=' '.join(el.stripped_strings); continue
                      a=el.select_one('li.title h3 a.part-link')
                      if not a: continue
                      for sup in a.find_all('sup'): sup.decompose()
                      title=' '.join(a.stripped_strings).strip()
                      txt=' '.join(el.stripped_strings)
                      pm=re.search(r'\bpp?\.\s*([ivxlcdm\d]+(?:\s*[–-]\s*[ivxlcdm\d]+)?)',txt,re.I)
                      page=pm.group(1).replace(' ','').replace('–','-') if pm else ''
                      key=(norm(title),page,current_sec)
                      if key in seen_card: continue
                      seen_card.add(key)
                      cards.append({'vol':vol,'iss':iss,'title':title,'nt':norm(title),'page':page,
                                    'section':current_sec,'full':txt,'nf':norm(txt)})

          byci=defaultdict(list)
          for i,c in enumerate(cards): byci[(c['vol'],c['iss'])].append(i)
          used=set(); matches={}
          for j,x in enumerate(cr):
              cand=[i for i in byci[(x['vol'],x['iss'])] if i not in used]
              best=None
              exact=[i for i in cand if cards[i]['nt']==x['nt']]
              if len(exact)==1: best=exact[0]
              else:
                  page=[i for i in cand if x['page'] and cards[i]['page']==x['page']]
                  if len(page)==1: best=page[0]
                  else:
                      pool=page or cand
                      scored=sorted([(SequenceMatcher(None,x['nt'],cards[i]['nt']).ratio(),i) for i in pool],reverse=True)
                      if scored and scored[0][0]>=0.72: best=scored[0][1]
              if best is not None:
                  used.add(best); matches[j]=best

          unresolved=[(j,cr[j]) for j in range(len(cr)) if j not in matches]
          print('ONE_TO_ONE_UNRESOLVED',len(unresolved))
          resolved={}; blockers=[]
          for j,x in unresolved:
              cand=[cards[i] for i in byci[(x['vol'],x['iss'])]]
              embedded=[c for c in cand if x['nt'] and x['nt'] in c['nf']]
              if len(embedded)==1:
                  c=embedded[0]
                  resolved[j]=(c['section'],c['title'],c['page'],'embedded_text')
              else:
                  page_hits=[c for c in cand if x['page'] and (c['page']==x['page'] or x['page'] in c['full'])]
                  secs=sorted(set(c['section'] for c in page_hits if c['section']))
                  if page_hits and len(secs)==1:
                      resolved[j]=(secs[0],' | '.join(c['title'] for c in page_hits[:3]),' | '.join(c['page'] for c in page_hits[:3]),'page_section')
                  else:
                      blockers.append((j,x,[(c['section'],c['title'],c['page']) for c in page_hits[:5]]))

          print('RESIDUAL_RESOLVED',len(resolved),'RESIDUAL_BLOCKERS',len(blockers))
          for j,x in unresolved:
              if j in resolved:
                  sec,ct,cp,meth=resolved[j]
                  print('RESOLVED',x['vol'],x['iss'],x['page'],x['doi'],repr(x['title']),'SECTION',repr(sec),'METHOD',meth,'CARD',repr(ct),'CARDPAGE',repr(cp))
          for j,x,hits in blockers:
              print('BLOCKER',x['vol'],x['iss'],x['page'],x['doi'],repr(x['title']),'PAGE_HITS',hits)

          final_sections=Counter(cards[i]['section'] for i in matches.values())
          for sec,_,_,_ in resolved.values(): final_sections[sec]+=1
          print('TOTAL_SECTION_MAPPED',len(matches)+len(resolved),'OF',len(cr))
          print('FINAL_SECTION_COUNTS',dict(final_sections))
          PY
