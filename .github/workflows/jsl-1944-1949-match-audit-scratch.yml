name: JSL Sweep Taxonomy Profile Scratch

on:
  push:

jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8b/jsl-1944-1949-archive-assembly-20260904
      - name: Profile existing inventory vocabularies
        shell: bash
        run: |
          python - <<'PY'
          import csv, collections, pathlib
          base=pathlib.Path('Philosophy/Papers/Forcing_CH_Evidence')
          files=[base/'CONTROL_ARCHIVE_SWEEP_JSL_1938_1943_INVENTORY.tsv',base/'CONTROL_ARCHIVE_SWEEP_JSL_1950_1955_INVENTORY.tsv']
          for f in files:
              rows=list(csv.DictReader(f.open(encoding='utf-8'),delimiter='\t'))
              print('\nFILE',f.name,'ROWS',len(rows))
              for col in ['document_type','subfield','contemporaneous_review_status','technical_depth_availability','target_line_exclusion_status','full_text_status']:
                  c=collections.Counter(r[col] for r in rows)
                  print('COL',col)
                  for k,v in c.most_common(): print(v,repr(k))
              print('OTHER_TYPE_EXAMPLES')
              for r in rows:
                  if r['document_type'] not in {'primary technical publication','review'}:
                      print(repr(r['document_type']),repr(r['exact_title']),r['publication_year'],r['volume'],r['issue'],r['pages'])
              print('TARGET_EXCLUSION_NONBLANK')
              for r in rows:
                  if r['target_line_exclusion_status']:
                      print(repr(r['target_line_exclusion_status']),repr(r['exact_title']))
          PY
