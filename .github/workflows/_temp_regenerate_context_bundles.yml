name: Temp Regenerate Context Bundles

on:
  push:
    branches:
      - theory/cycle2-vg-wta-pressure-pass2-20260909

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[skip bundle regen]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate committed context bundles
        run: python scripts/build_srt_context_bundles.py

      - name: Commit regenerated bundles when changed
        shell: bash
        run: |
          if git diff --quiet -- Operations/Context_Bundles; then
            echo "Context bundles already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Operations/Context_Bundles
          git commit -m "Regenerate context bundles [skip bundle regen]"
          git push origin HEAD:theory/cycle2-vg-wta-pressure-pass2-20260909
