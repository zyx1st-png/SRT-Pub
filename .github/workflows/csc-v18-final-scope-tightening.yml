name: CSC v18 final scope tightening

on:
  push:
    branches:
      - publication/csc-artificial-life-v18-e1e2e3-20260915

permissions:
  contents: write

jobs:
  revise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scope tightening
        run: python papers/apply_v18_final_scope_tightening.py
      - name: Build guarded submission artifact
        working-directory: papers
        run: python build_artificial_life_v18_submission.py
      - name: Commit tightened manuscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/CostlySelectiveClosure_v18_ArtificialLife_candidate.md
          git commit -m "paper: tighten final v18 field-level framing"
          git push origin HEAD:publication/csc-artificial-life-v18-e1e2e3-20260915
