name: Temporary PR942 Frontmatter Fix

on:
  push:
    branches:
      - theory/r1-one-formation-canonical-landing-20260911

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: theory/r1-one-formation-canonical-landing-20260911
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fix frontmatter ratchet
        run: python scripts/tmp_pr942_fix_frontmatter.py
      - name: Regenerate context bundles
        run: uv run python scripts/build_srt_context_bundles.py --generated-date 2026-09-11
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core_Law/SRT_One_Formation.md CANONICAL_REGISTRY.md Operations/Context_Bundles
          git commit -m "Fix One formation frontmatter ratchet"
          git push origin HEAD:theory/r1-one-formation-canonical-landing-20260911
