name: P0 D2 boundary A helper

on:
  push:
    branches:
      - agent/srt-p0-d2-boundary-a-helper

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply author decision A
        run: |
          set -euo pipefail
          git fetch origin agent/srt-p0-d2-boundary-a
          git switch -C agent/srt-p0-d2-boundary-a origin/agent/srt-p0-d2-boundary-a
          git checkout origin/agent/srt-p0-d2-boundary-a-helper -- scripts/tmp_apply_p0_d2_boundary_a.py
          python scripts/tmp_apply_p0_d2_boundary_a.py
          rm scripts/tmp_apply_p0_d2_boundary_a.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Governance/SRT_CLAIM_LADDER.md Core/SRT_Core_21_Minimal_Axioms.md Core/SRT_OPEN_TENSIONS.md
          git commit -m 'Adopt P0 empirical-discrimination boundary A'
          uv run python scripts/build_srt_context_bundles.py
          git add Operations/Context_Bundles
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh context bundles for P0 D2 boundary'
          fi
          git push origin HEAD:agent/srt-p0-d2-boundary-a
