name: Temporary Context Bundle Generation

on:
  push:
    branches:
      - agent/status-reconciliation-20260805

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/status-reconciliation-20260805

      - name: Generate context bundles
        run: python scripts/build_srt_context_bundles.py

      - name: Commit generated bundles
        run: |
          if git diff --quiet -- Operations/Context_Bundles; then
            echo "Context bundles already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Operations/Context_Bundles
          git commit -m "Regenerate SRT context bundles for status reconciliation"
          git push origin HEAD:agent/status-reconciliation-20260805
