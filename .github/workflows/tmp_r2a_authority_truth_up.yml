name: tmp-r2a-authority-truth-up

on:
  push:
    branches:
      - governance/r2a-authority-truth-up-20260912

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Regenerate context bundles and remove R2-A helpers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/r2a-authority-truth-up-20260912
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.12
      - name: Apply authority truth-up
        run: uv run python scripts/tmp_apply_r2a_authority_truth_up.py
      - name: Move bundle authority parsing to Registry
        run: uv run python scripts/tmp_fix_r2a_bundle_authority_source.py
      - name: Validate permanent authority checker
        run: uv run python scripts/check_authority_routing.py
      - name: Commit source truth-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SRT_AI_START.md CLAUDE.md _SRT_MANIFEST.yaml _SRT_AGENT_RETRIEVAL_PROFILE.md AGENTS.md CANONICAL_REGISTRY.md Core_Law/SRT_One_Formation.md Core_Law/SRT_Generative_Ontology_Spine.md scripts/check_authority_routing.py scripts/governance_preflight.py scripts/build_srt_context_bundles.py scripts/test_build_context_bundles.py
          git commit -m "Apply R2-A authority truth-up"
      - name: Regenerate context bundles from clean source commit
        run: uv run python scripts/build_srt_context_bundles.py --generated-date 2026-09-12
      - name: Run governance preflight
        run: uv run python scripts/governance_preflight.py --skip-write-report
      - name: Remove temporary helpers and commit bundles
        run: |
          rm scripts/tmp_apply_r2a_authority_truth_up.py
          rm scripts/tmp_fix_r2a_bundle_authority_source.py
          rm .github/workflows/tmp_r2a_authority_truth_up.yml
          rm -f .r2a_trigger
          git add -A
          git commit -m "Regenerate context bundles and remove R2-A helpers"
          git push origin governance/r2a-authority-truth-up-20260912
# final-trigger-5
