name: CSC v19 submission check

on:
  workflow_dispatch:
  push:
    branches:
      - publication/csc-artificial-life-v19-consequence-scope-20260915
    paths:
      - '.github/workflows/csc-v19-submission-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build v19 submission
        working-directory: papers
        run: python build_artificial_life_v19_submission.py
      - name: Check article word range and basic references
        working-directory: papers
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('CostlySelectiveClosure_v19_ArtificialLife_submission.md')
          text = p.read_text()
          words = re.findall(r"[A-Za-z0-9]+(?:[-'][A-Za-z0-9]+)*", text)
          n = len(words)
          print('V19 WORD COUNT', n)
          print('ARTICLE RANGE 6000-12000', 6000 <= n <= 12000)
          refs = text.split('## References',1)[1].split('## Appendix A.',1)[0]
          body = text.split('## References',1)[0]
          first_authors = []
          for line in refs.splitlines():
              m = re.match(r'- ([A-Za-z][A-Za-z-]+),', line)
              if m:
                  first_authors.append(m.group(1))
          missing = [a for a in first_authors if a not in body]
          print('REFERENCE ENTRIES', len(first_authors))
          print('MISSING FIRST AUTHORS', missing)
          if missing:
              raise SystemExit(2)
          PY
