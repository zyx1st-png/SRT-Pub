name: Bundle Refresh After Bootstrap Commit

on:
  push:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bootstrap-domain-framework-sync-20260904
      - name: Regenerate committed-source bundles
        run: |
          python scripts/build_srt_context_bundles.py --generated-date 2026-09-04
          python scripts/test_build_context_bundles.py
          python scripts/build_srt_context_bundles.py --check
      - name: Commit generated refresh
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Operations/Context_Bundles/
          git diff --cached --quiet && exit 0
          git commit -m "Refresh bundles after committed bootstrap sources"
          git push origin HEAD:bootstrap-domain-framework-sync-20260904
