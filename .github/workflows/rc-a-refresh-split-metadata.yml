name: RC-A refresh split metadata

on:
  push:
    branches:
      - agent/rc-a-semantic-burndown-2026-08-17

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rc-a-semantic-burndown-2026-08-17
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Refresh registered split owner metadata
        run: uv run python scripts/refresh_split_metadata.py
      - name: Assert scoped change and commit
        run: |
          changed="$(git diff --name-only | grep -v '^\.github/workflows/rc-a-refresh-split-metadata.yml$' || true)"
          test "$changed" = "Core_Law/L1_Formalism_Split/README.md"
          rm .github/workflows/rc-a-refresh-split-metadata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'consolidation: refresh L1 formalism split metadata'
          git push origin HEAD:agent/rc-a-semantic-burndown-2026-08-17
