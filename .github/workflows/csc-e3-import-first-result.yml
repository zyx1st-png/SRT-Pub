name: CSC E3 import first confirmatory result

on:
  push:
    branches:
      - experiment/csc-v17-consequence-recovery-e3-20260915

permissions:
  contents: write

jobs:
  import-first-result:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download immutable first-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/zyx1st-png/SRT-Pub/actions/artifacts/10395001598/zip \
            -o /tmp/csc-e3-first.zip
          echo "54d567306ac87deaf36be553aea15a02ce2f20347a8a1e49be62d74a132e9630  /tmp/csc-e3-first.zip" | sha256sum -c -
          rm -rf /tmp/csc-e3-first
          mkdir -p /tmp/csc-e3-first
          unzip -q /tmp/csc-e3-first.zip -d /tmp/csc-e3-first
          SRC=/tmp/csc-e3-first/home/runner/work/SRT-Pub/SRT-Pub/papers/costly_selective_closure_supplement/results/consequence_recovery_results.json
          test -s "$SRC"
          cp "$SRC" papers/costly_selective_closure_supplement/results/consequence_recovery_results.json
      - name: Verify preserved result identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('papers/costly_selective_closure_supplement/results/consequence_recovery_results.json')
          d = json.loads(p.read_text())
          assert len(d['runs']) == 120
          assert d['primary_test']['tie_aware_spearman_rho'] == -0.7037203560314511
          assert d['primary_test']['blocked_by_seed_two_sided_p'] == 4.999750012499375e-05
          assert d['primary_test']['supported'] is False
          assert d['endpoint_k10_minus_k0']['mean_difference'] == -0.03734338661338661
          assert d['endpoint_k10_minus_k0']['paired_bootstrap_95_ci'] == [-0.09896980894105892, -0.0027866666666666665]
          assert d['strong_manuscript_support'] is False
          assert d['secondary_common_state_probe']['tie_aware_spearman_rho_descriptive'] == -0.8004443519054006
          print('PASS: exact first-run E3 result recovered from artifact 10395001598')
          PY
      - name: Commit preserved first result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/costly_selective_closure_supplement/results/consequence_recovery_results.json
          git commit -m "experiment: preserve first preregistered E3 result"
          git push origin HEAD:experiment/csc-v17-consequence-recovery-e3-20260915
