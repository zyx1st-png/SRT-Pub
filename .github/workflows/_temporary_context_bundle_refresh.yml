name: Temporary Context Bundle Refresh

on:
  push:
    branches:
      - agent/frontiers-attractor-reachability-bridge

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[context-bundle-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate context bundles
        run: python scripts/build_srt_context_bundles.py --generated-date 2026-08-18
      - name: Commit generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Operations/Context_Bundles
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "[context-bundle-refresh] Regenerate context bundles"
          git push
