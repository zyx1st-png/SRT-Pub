name: Temporary PR931 External Review Context Regeneration

on:
  push:
    branches:
      - theory/pr931-external-review-reconciliation-20260911

permissions:
  contents: write

jobs:
  regenerate-context-bundles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review-reconciliation head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: theory/pr931-external-review-reconciliation-20260911

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerate context bundles
        run: uv run python scripts/build_srt_context_bundles.py --generated-date 2026-09-11

      - name: Commit generated bundles if changed
        shell: bash
        run: |
          if git diff --quiet -- Operations/Context_Bundles; then
            echo "Context bundles already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Operations/Context_Bundles
          git commit -m "Regenerate context bundles after PR931 external review reconciliation"
          git push origin HEAD:theory/pr931-external-review-reconciliation-20260911
