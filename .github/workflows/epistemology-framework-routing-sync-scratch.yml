          if pathrow not in r: raise SystemExit('README path anchor missing')
          r=r.replace(pathrow,'| 1.55 | `SRT_Epistemology_Reconstruction_Framework.md` | Architecture-v2 Layer-2 problem map for Epistemology; use before defining a new epistemology deep well or treating `SRT_HardProblem_Epistemology.md` / forcing-CH as the whole domain. |\n'+pathrow,1)
          rd.write_text(r,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Philosophy/SRT_Epistemology_Reconstruction_Framework.md Philosophy/_PHILOSOPHY_MACHINE_INDEX.md Philosophy/README.md
          git commit -m "Sync Epistemology Framework landing status and routes"
          git push origin HEAD:epistemology/framework-routing-sync-20260904
