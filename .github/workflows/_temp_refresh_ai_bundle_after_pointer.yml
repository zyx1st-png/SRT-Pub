name: Temporary Post-Pointer Bundle Refresh

on:
  push:
    branches:
      - agent/srt-convergence-hpb-governance

permissions:
  contents: write

jobs:
  refresh-bundles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Regenerate bundles from committed pointer state
        run: uv run python scripts/build_srt_context_bundles.py
      - name: Commit generated outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Operations/Context_Bundles
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Refresh context bundles after freeze pointer landing"
          git push origin "HEAD:${GITHUB_REF_NAME}"
