name: Finalize PR 743 Material Log

on:
  push:
    branches:
      - agent/solms-affective-ai-srt-bridge

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/solms-affective-ai-srt-bridge
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Normalize combined August material log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          from pathlib import Path

          part = Path('Operations/Material_Log/2026-08_Part02.md')
          lines = part.read_text(encoding='utf-8').splitlines()
          row_solms = next(x for x in lines if x.startswith('| 2026-08-06 | Mark Solms'))
          row_damasio = next(x for x in lines if x.startswith('| 2026-08-07 | Antonio Damasio'))
          fm_end = lines.index('---', 1)
          fm = lines[:fm_end+1]
          normalized = fm + [
              '',
              '# Material Log 2026-08_Part02',
              '',
              '> Pipeline 1 official state routes through `../_SRT_MATERIAL_LOG.md`. This connector-safe continuation records the current August 2026 additions.',
              '',
              '| 日期 | 来源标题 / URL | 类型 | 审核结论 | 落点（文件 + 节位） | 融入状态 | 备注 |',
              '|-----|--------------|------|---------|-----------------|---------|------|',
              row_solms,
              row_damasio,
              '',
          ]
          part.write_text('\n'.join(normalized), encoding='utf-8')

          root = Path('Operations/_SRT_MATERIAL_LOG.md')
          rlines = root.read_text(encoding='utf-8').splitlines()
          out=[]
          for line in rlines:
              if line.startswith('| 2026-08_Part01 |'):
                  continue
              if line.startswith('| 2026-08_Part02 |'):
                  continue
              out.append(line)
          insert_at = next(i for i,x in enumerate(out) if x == '---' and i > 40)
          out[insert_at:insert_at] = [
              '| 2026-08_Part01 | [Material_Log/2026-08_Part01.md](Material_Log/2026-08_Part01.md) | 10 |',
              '| 2026-08_Part02 | [Material_Log/2026-08_Part02.md](Material_Log/2026-08_Part02.md) | 2 |',
              '',
          ]
          root.write_text('\n'.join(out).rstrip()+'\n', encoding='utf-8')
          PY
          git add Operations/Material_Log/2026-08_Part02.md Operations/_SRT_MATERIAL_LOG.md
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m "Normalize August material log after Solms and Damasio merge"; fi
      - name: Verify governance
        run: |
          uv run python scripts/refresh_split_metadata.py --check
          uv run python scripts/governance_preflight.py --skip-write-report --strict-split-metadata
      - name: Push finalized branch
        run: git push origin HEAD:agent/solms-affective-ai-srt-bridge
