name: Build ontological friction preprint PDF

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "papers/ontological_friction/paper_ontological_friction.md"
      - "papers/ontological_friction/make_preprint_variant.py"
      - "papers/ontological_friction/render_preprint_pdf.py"
      - "papers/ontological_friction/figures/**"
      - ".github/workflows/build_ontological_friction_preprint.yml"

permissions:
  contents: write

jobs:
  build-preprint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install --upgrade pip
          python -m pip install pypandoc pypdf reportlab
          google-chrome --version || google-chrome-stable --version

      - name: Generate journal-neutral preprint source
        run: python papers/ontological_friction/make_preprint_variant.py

      - name: Render and verify PDF
        run: python papers/ontological_friction/render_preprint_pdf.py

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ontological-friction-preprint-pdf
          path: papers/ontological_friction/paper_ontological_friction_preprint.pdf
          if-no-files-found: error

      - name: Commit generated preprint files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            papers/ontological_friction/paper_ontological_friction_preprint.md \
            papers/ontological_friction/paper_ontological_friction_preprint.pdf
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build PsyArXiv preprint PDF [skip ci]"
            git push
          fi
