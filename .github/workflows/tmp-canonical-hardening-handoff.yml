name: Temporary Canonical Hardening Handoff

on:
  push:
    branches:
      - status/canonical-hardening-handoff-20260911

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out handoff branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: status/canonical-hardening-handoff-20260911

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Route STATUS to canonical-hardening scope audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('STATUS.md')
          s = p.read_text()
          old = '''## Immediate routing

```text
1. treat #931 as a landed historical noncanonical checkpoint, not a final theory closure;
2. treat #933 as the author-adjudicated controlling reconciliation for its identified routing debts;
3. after #933 lands, do not reopen broad theory merely to extend this package;
4. any owner/canonical hardening must be a separate smaller future PR with its own gates;
5. keep Level 2 HOLD, whole-package non-substitutability and scientific-distinctiveness guards unchanged.
```

Do not reopen broad theory exploration merely to add more concepts. The current reconciliation is closed at the noncanonical level; remaining formal/empirical burdens stay explicitly open.
'''
          new = '''## Immediate routing — canonical-hardening next session

**Next-session controlling handoff:**

`Operations/Status_History/SRT_STATUS_2026-09-11_CANONICAL_HARDENING_NEXT_SESSION_HANDOFF.md`

```text
1. #931 is a landed historical noncanonical reconstruction checkpoint;
2. #933 is the author-adjudicated controlling reconciliation for Bearer / Active-selection routing debt;
3. broad theory exploration remains PAUSED;
4. next workline = CANONICAL-HARDENING SCOPE AUDIT;
5. do NOT edit canonical files at session start;
6. first produce an owner-by-owner H1/H2/B/O/R classification matrix;
7. only after hardening scope is reviewed/accepted should a small canonical-hardening PR be opened;
8. keep Level 2 HOLD, whole-package non-substitutability and scientific-distinctiveness guards unchanged.
```

The first hardening pass should prefer canonical clarification (`H1`) plus bridge/open classifications (`B` / `O`) and minimize genuinely new canonical relations (`H2`). Do not copy the #931 proposal wholesale into Core/Core_Law owners.
'''
          if old not in s:
              raise SystemExit('Immediate routing block not found; refuse blind STATUS rewrite')
          p.write_text(s.replace(old, new))
          PY

      - name: Regenerate context bundles
        run: python scripts/build_srt_context_bundles.py

      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-canonical-hardening-handoff.yml
          git add STATUS.md Operations/Context_Bundles
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Route next session to canonical-hardening scope audit"
            git push origin HEAD:status/canonical-hardening-handoff-20260911
          fi
