name: Szeged Kalmar Bibliography Item 17 Probe

on:
  push:
    branches:
      - scratch/bernays-saarland-directory-probe-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe likely filenames for bibliography item 17
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python - <<'PY'
          import urllib.request, urllib.parse, hashlib, os, subprocess, json
          base='https://www.inf.u-szeged.hu/kalmar/pdf/'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          names=[
            '17.pdf','17_jsl.pdf','17_jsl_39.pdf','17_jsl_1939.pdf','17_jsl_4.pdf','17_jsl_4_1.pdf','17_jsl_4_1_1_9.pdf',
            '17_j_symbolic_logic.pdf','17_j_symbolic_logic_39.pdf','17_j_symbolic_logic_1939.pdf','17_j_symbolic_logic_4.pdf','17_j_symbolic_logic_4_1.pdf','17_j_symbolic_logic_4_1_1_9.pdf',
            '17_j_symb_logic.pdf','17_j_symb_log.pdf','17_symbolic_logic.pdf','17_journal_symbolic_logic.pdf','17_journal_of_symbolic_logic.pdf','17_journal_of_symbolic_logic_1939.pdf',
            '17_kalmar.pdf','17_ackermann.pdf','17_decision_problem.pdf','17_on_the_reduction.pdf','17_on_the_reduction_of_the_decision_problem.pdf'
          ]
          def fetch(name):
              url=base+urllib.parse.quote(name)
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'application/pdf,*/*'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read()
                      return {'name':name,'url':url,'status':r.status,'final':r.geturl(),'type':r.headers.get('Content-Type',''),'bytes':len(b),'body':b}
              except Exception as e:
                  b=b''
                  if hasattr(e,'read'):
                      try:b=e.read()
                      except:pass
                  return {'name':name,'url':url,'status':getattr(e,'code',None),'error':repr(e),'bytes':len(b),'body':b}
          hits=[]
          for name in names:
              r=fetch(name); b=r.pop('body')
              r['magic']=repr(b[:12]); r['sha256']=hashlib.sha256(b).hexdigest() if b else None
              r['pdf']=b.startswith(b'%PDF')
              if r['pdf']:
                  path='/tmp/item17.pdf'; open(path,'wb').write(b)
                  info=subprocess.run(['pdfinfo',path],capture_output=True,text=True,errors='ignore').stdout
                  pages=None
                  for line in info.splitlines():
                      if line.startswith('Pages:'):
                          try:pages=int(line.split(':',1)[1].strip())
                          except:pass
                  r['pages']=pages
                  hits.append((name,path,r.copy()))
              print('PROBE=',json.dumps(r,ensure_ascii=False))
          print('PDF_HIT_COUNT=',len(hits))
          for name,path,r in hits:
              print('PDF_HIT=',json.dumps(r,ensure_ascii=False))
          PY
