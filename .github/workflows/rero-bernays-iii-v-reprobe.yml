name: Kalmar 1939 Cambridge Direct PDF Probe

on:
  push:
    branches:
      - scratch/bernays-saarland-directory-probe-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify constructed Cambridge direct PDF object for Kalmar 1939
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          url='https://www.cambridge.org/core/services/aop-cambridge-core/content/view/A52C0CE45E8EC86E16AB8C3A20390142/S0022481200047903a.pdf/on-the-reduction-of-the-decision-problem-first-paper-ackermann-prefix-a-single-binary-predicate.pdf'
          out='/tmp/kalmar1939.bin'
          echo "URL=$url"
          curl -L --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 120 -A 'Mozilla/5.0' -sS -D /tmp/headers.txt -o "$out" -w 'HTTP=%{http_code}\nTYPE=%{content_type}\nSIZE=%{size_download}\nFINAL=%{url_effective}\n' "$url" || true
          echo "FILE=$(file -b "$out" || true)"
          if file -b "$out" | grep -qi 'PDF document'; then
            echo "SHA256=$(sha256sum "$out" | awk '{print $1}')"
            pages=$(pdfinfo "$out" | awk -F: '/^Pages:/ {gsub(/ /,"",$2); print $2}')
            echo "PDFINFO_PAGES=$pages"
            echo '--- FIRST ---'
            pdftotext -f 1 -l 2 -layout "$out" - | sed -n '1,45p'
            echo '--- LAST ---'
            pdftotext -f "$pages" -l "$pages" -layout "$out" - | tail -n 45
            mkdir -p /tmp/render
            pdftoppm -png -r 72 "$out" /tmp/render/page >/dev/null 2>&1
            echo "RENDER_COUNT=$(find /tmp/render -type f -name 'page-*.png' | wc -l)"
            echo "UNIQUE_RENDER_HASHES=$(sha256sum /tmp/render/page-*.png | awk '{print $1}' | sort -u | wc -l)"
            alltext=$(pdftotext -layout "$out" - | tr '\n' ' ')
            echo "TITLE_MATCH=$(printf '%s' "$alltext" | grep -Fci 'ON THE REDUCTION OF THE DECISION PROBLEM' || true)"
            echo "AUTHOR_MATCH=$(printf '%s' "$alltext" | grep -Fci 'KALM' || true)"
          else
            echo '--- BODY PREFIX ---'
            head -c 1800 "$out" | tr '\n' ' ' || true
            echo
          fi
