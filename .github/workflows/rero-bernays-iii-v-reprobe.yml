name: Szeged Kalmar Link Context Mapper

on:
  push:
    branches:
      - scratch/bernays-saarland-directory-probe-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map each linked PDF to surrounding article-page text
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.parse, re, html, json
          page='https://www.inf.u-szeged.hu/kalmar/pages/munkassaga_cikkek.php'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          req=urllib.request.Request(page,headers={'User-Agent':ua})
          with urllib.request.urlopen(req,timeout=60) as r:
              raw=r.read().decode('utf-8','ignore')
          print('HTML_LEN=',len(raw))

          # For each explicit PDF href, capture a wide surrounding window and strip markup.
          rows=[]
          for m in re.finditer(r'href=["\']([^"\']*/pdf/[^"\']+\.pdf[^"\']*)["\']',raw,re.I):
              href=html.unescape(m.group(1))
              url=urllib.parse.urljoin(page,href)
              name=urllib.parse.unquote(url.rsplit('/',1)[-1])
              window=raw[max(0,m.start()-1400):min(len(raw),m.end()+1400)]
              # retain block separators before stripping tags
              window=re.sub(r'(?i)<br\s*/?>|</(?:p|li|div|tr|td|h\d)>',' | ',window)
              text=re.sub(r'<[^>]+>',' ',window)
              text=html.unescape(text)
              text=' '.join(text.split())
              row={'name':name,'url':url,'context':text[:2400]}
              rows.append(row)
              print('ROW=',json.dumps(row,ensure_ascii=False))

          print('COUNT=',len(rows))
          print('\n=== POSSIBLE 1930s / ENGLISH / LOGIC CONTEXTS ===')
          needles=['1938','1939','1940','decision','ackermann','symbolic','logic','entscheidungsproblem','reduction','predicate']
          for row in rows:
              low=row['context'].lower()
              hit=[n for n in needles if n in low]
              if hit:
                  print('CANDIDATE=',json.dumps({'name':row['name'],'hits':hit,'context':row['context']},ensure_ascii=False))
          PY
