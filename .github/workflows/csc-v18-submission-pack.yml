name: CSC v18 submission source package

on:
  push:
    branches:
      - publication/csc-artificial-life-v18-e1e2e3-20260915

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build guarded submission markdown
        working-directory: papers
        run: python build_artificial_life_v18_submission.py
      - name: Assemble reviewer-facing sources
        run: |
          mkdir -p /tmp/csc-v18-submission/figures
          cp papers/CostlySelectiveClosure_v18_ArtificialLife_submission.md /tmp/csc-v18-submission/
          cp papers/CostlySelectiveClosure_v18_ArtificialLife_COVER_LETTER.md /tmp/csc-v18-submission/
          cp papers/CostlySelectiveClosure_v18_ARTIFICIAL_LIFE_READINESS_GATE.md /tmp/csc-v18-submission/
          cp papers/costly_selective_closure_supplement/figures/figure1_design_v18.svg /tmp/csc-v18-submission/figures/
          cp papers/costly_selective_closure_supplement/figures/figure2_evidence_summary_v18.svg /tmp/csc-v18-submission/figures/
      - uses: actions/upload-artifact@v4
        with:
          name: csc-v18-reviewer-facing-sources
          path: /tmp/csc-v18-submission
          retention-days: 1
