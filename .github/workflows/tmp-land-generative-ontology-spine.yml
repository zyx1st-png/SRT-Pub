name: Temporary Generative Ontology Spine Landing

on:
  push:
    branches:
      - theory/generative-ontology-spine-canonical-20260911

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: theory/generative-ontology-spine-canonical-20260911

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply registry and freeze routing
        run: uv run python scripts/tmp_land_generative_ontology_spine.py

      - name: Regenerate context bundles
        run: uv run python scripts/build_srt_context_bundles.py --generated-date 2026-09-11

      - name: Commit deterministic landing updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CANONICAL_REGISTRY.md Governance/SRT_CANONICAL_FREEZE.md Operations/Context_Bundles/
          if ! git diff --cached --quiet; then
            git commit -m "Register canonical generative ontology spine"
            git push origin HEAD:theory/generative-ontology-spine-canonical-20260911
          fi
