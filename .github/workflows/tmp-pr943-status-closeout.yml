name: Temporary PR943 Status Closeout

on:
  push:
    branches:
      - ops/post-pr942-status-closeout-20260911

permissions:
  contents: write

jobs:
  closeout:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ops/post-pr942-status-closeout-20260911
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply status closeout
        run: python scripts/tmp_pr943_status_closeout.py
      - name: Regenerate context bundles
        run: uv run python scripts/build_srt_context_bundles.py --generated-date 2026-09-11
      - name: Commit closeout
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No closeout changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md Operations/Context_Bundles
          git commit -m "Close out status after PR942"
          git push origin HEAD:ops/post-pr942-status-closeout-20260911
