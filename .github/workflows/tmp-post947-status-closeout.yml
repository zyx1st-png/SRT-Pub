name: Temporary Post-947 STATUS Closeout

on:
  push:
    branches:
      - ops/post-pr947-spine-status-closeout-20260911

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ops/post-pr947-spine-status-closeout-20260911
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply STATUS closeout
        run: uv run python scripts/tmp_closeout_pr947_status.py
      - name: Commit STATUS first
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          git commit -m "Close STATUS after canonical generative spine landing"
      - name: Regenerate context bundles from clean inputs
        run: uv run python scripts/build_srt_context_bundles.py --generated-date 2026-09-11
      - name: Commit bundles and push
        run: |
          git add Operations/Context_Bundles/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh context bundles after post-947 STATUS closeout"
          fi
          git push origin HEAD:ops/post-pr947-spine-status-closeout-20260911
