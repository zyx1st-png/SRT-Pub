name: Epistemology Phase 8 Migration Patch Scratch

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: phase8/epistemology-deep-well-migration-20260904
      - name: Parent grandfathered pilot under Architecture v2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          charter = Path('Operations/Proposals/SRT_CONSTITUTION_PHASE8_EPISTEMOLOGY_DEEP_WELL_CHARTER_2026-09-04.md')
          audit = Path('Operations/Audits/SRT_CONSTITUTION_PHASE8A_EPISTEMOLOGY_BASELINE_ARCHIVE_GATE_AUDIT_2026-09-04.md')

          s = charter.read_text(encoding='utf-8')
          s = s.replace('version: v2\nrecord_stage: phase8a_complete_phase8b_archive_assembly_open', 'version: v3\nrecord_stage: phase8a_complete_framework_parented_phase8b_archive_assembly_open', 1)
          dep_anchor = 'dependency:\n  - Operations/SRT_CONSTITUTION_DOMAIN_SEQUENCE_AUTHOR_DECISION_2026-09-03.md\n'
          dep_insert = 'dependency:\n  - Philosophy/SRT_Epistemology_Reconstruction_Framework.md\n  - Operations/Proposals/SRT_CONSTITUTION_DOMAIN_ARCHITECTURE_V2_2026-09-04.md\n  - Operations/SRT_CONSTITUTION_DOMAIN_SEQUENCE_AUTHOR_DECISION_2026-09-03.md\n'
          if dep_anchor not in s:
              raise SystemExit('charter dependency anchor missing')
          s = s.replace(dep_anchor, dep_insert, 1)
          role_anchor = '> **Authorization**: Neuroscience Phase 9 is complete and the author has opened Epistemology as the second sequential deep well.\n>\n'
          role_insert = '> **Architecture-v2 parent**: this is a grandfathered **Layer-4 pilot** under `Philosophy/SRT_Epistemology_Reconstruction_Framework.md`, primarily `E2` (method/proof/model identity) + `E4` (historical availability/genealogy), with secondary `E3`/`E6` pressure. It no longer carries the burden of defining the Epistemology domain.\n>\n> **Authorization**: Neuroscience Phase 9 is complete and the author has opened Epistemology as the second sequential deep well.\n>\n'
          if role_anchor not in s:
              raise SystemExit('charter role anchor missing')
          s = s.replace(role_anchor, role_insert, 1)
          s = s.replace('> **Current state**: Phase 8A is complete. The strongest-baseline verdict is **UNRESOLVED with high Case-B pressure**; no Case-C content increment is licensed. `ARCHIVE-ENUMERATION-0 = NO-GO`, but bounded archive assembly inside the already frozen boundary is authorized as Phase 8B.', '> **Current state**: Phase 8A is complete. The strongest-baseline verdict is **UNRESOLVED with high Case-B pressure**; no Case-C content increment is licensed. `ARCHIVE-ENUMERATION-0 = NO-GO`. This migrated record makes bounded archive assembly inside the already frozen boundary the Phase-8B next step **once this migration lands on `main`**.', 1)
          s = s.replace('> **Scope**: one bounded epistemology-of-mathematical-practice question only. This is not a general theory of knowledge, not a philosophy-of-mathematics rewrite, and not a new forcing paper charter.', '> **Scope**: one bounded epistemology-of-mathematical-practice question only. Its parent problem family is supplied by the Epistemology Reconstruction Framework; this charter does not construct the domain worldview. It is not a general theory of knowledge, not a philosophy-of-mathematics rewrite, and not a new forcing paper charter.', 1)
          charter.write_text(s, encoding='utf-8')

          a = audit.read_text(encoding='utf-8')
          a = a.replace('version: v1\nrecord_stage: phase8a_complete_increment_unresolved_archive_enumeration_no_go', 'version: v2\nrecord_stage: phase8a_complete_framework_parented_increment_unresolved_archive_enumeration_no_go', 1)
          dep_anchor = 'dependency:\n  - Operations/Proposals/SRT_CONSTITUTION_PHASE8_EPISTEMOLOGY_DEEP_WELL_CHARTER_2026-09-04.md\n'
          dep_insert = 'dependency:\n  - Philosophy/SRT_Epistemology_Reconstruction_Framework.md\n  - Operations/Proposals/SRT_CONSTITUTION_DOMAIN_ARCHITECTURE_V2_2026-09-04.md\n  - Operations/Proposals/SRT_CONSTITUTION_PHASE8_EPISTEMOLOGY_DEEP_WELL_CHARTER_2026-09-04.md\n'
          if dep_anchor not in a:
              raise SystemExit('audit dependency anchor missing')
          a = a.replace(dep_anchor, dep_insert, 1)
          baseline_anchor = '> **Baseline result**: **UNRESOLVED with strong Case-B pressure**.'
          prefix = '> **Architecture-v2 status**: grandfathered **Layer-4 audit** under `Philosophy/SRT_Epistemology_Reconstruction_Framework.md`; primary parent families are `E2 + E4`, with secondary `E3 + E6`. The audit preserves the old Phase-8A verdict rather than retrofitting the Framework into its evidence.\n>\n'
          if baseline_anchor not in a:
              raise SystemExit('audit baseline anchor missing')
          a = a.replace(baseline_anchor, prefix + baseline_anchor, 1)
          a = a.replace('> **Programme consequence**: the Epistemology well remains open. Corpus assembly inside the already frozen boundary is authorized; another method protocol is not.', '> **Programme consequence**: the Epistemology well remains open. On landing of this migration, corpus assembly inside the already frozen boundary is authorized; another method protocol is not.', 1)
          audit.write_text(a, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Operations/Proposals/SRT_CONSTITUTION_PHASE8_EPISTEMOLOGY_DEEP_WELL_CHARTER_2026-09-04.md Operations/Audits/SRT_CONSTITUTION_PHASE8A_EPISTEMOLOGY_BASELINE_ARCHIVE_GATE_AUDIT_2026-09-04.md
          git commit -m "Parent Epistemology Phase 8 pilot under domain framework"
          git push origin HEAD:phase8/epistemology-deep-well-migration-20260904
