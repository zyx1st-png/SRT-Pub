name: CSC v18 final artifact check

on:
  push:
    branches:
      - publication/csc-artificial-life-v18-e1e2e3-20260915

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build guarded v18 submission markdown
        working-directory: papers
        run: python build_artificial_life_v18_submission.py
      - name: Validate length, evidence, figures, and references
        working-directory: papers
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          p = Path('CostlySelectiveClosure_v18_ArtificialLife_submission.md')
          t = p.read_text(encoding='utf-8')
          n = len(re.findall(r"[A-Za-z0-9]+(?:[-'][A-Za-z0-9]+)*", t))
          assert 6000 <= n <= 12000, n
          assert 'Failure Is Not One-Dimensional:' in t
          assert '**Experiment 1 was not preregistered**' in t
          assert 'timestamped repository preregistrations' in t
          assert 'figure2_evidence_summary_v18.svg' in t
          assert Path('costly_selective_closure_supplement/figures/figure2_evidence_summary_v18.svg').is_file()
          assert 'rho = +0.0548074683' in t
          assert 'rho = -0.7037203560' in t
          assert 'Repository note.' not in t

          body, refs = t.split('\n## References\n', 1)
          refs = refs.split('\n## Appendix A.', 1)[0]
          entries = [x for x in refs.splitlines() if x.startswith('- ')]
          unused = []
          for e in entries:
              m = re.match(r'- ([A-Za-zÀ-ÖØ-öø-ÿ\-]+)', e)
              if m and m.group(1) not in body:
                  unused.append(m.group(1))
          assert not unused, unused
          print('PASS: v18 final word count', n)
          print('PASS: reference entries', len(entries))
          PY
