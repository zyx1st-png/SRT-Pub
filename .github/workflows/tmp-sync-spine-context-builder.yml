name: Temporary Spine Context Builder Sync

on:
  push:
    branches:
      - theory/generative-ontology-spine-canonical-20260911

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: theory/generative-ontology-spine-canonical-20260911
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch canonical bundle inputs
        run: uv run python scripts/tmp_add_generative_spine_to_context_bundle.py
      - name: Regenerate context bundles and verify budgets
        run: uv run python scripts/build_srt_context_bundles.py --generated-date 2026-09-11
      - name: Commit source and generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_srt_context_bundles.py Operations/Context_Bundles/
          if ! git diff --cached --quiet; then
            git commit -m "Route generative ontology spine into context bundles"
            git push origin HEAD:theory/generative-ontology-spine-canonical-20260911
          fi
