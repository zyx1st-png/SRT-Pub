name: Paperzz Bernays Part II Source Probe

on:
  push:
    branches:
      - scratch/bernays-saarland-directory-probe-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Paperzz landing and any downloadable source object
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          page='https://paperzz.com/doc/7214206/a-system-of-axiomatic-set-theory%E2%80%94part-ii13-4.-the'
          curl -L --connect-timeout 20 --max-time 90 -A 'Mozilla/5.0' -sS -D /tmp/h.txt -o /tmp/page.html -w 'PAGE_HTTP=%{http_code}\nPAGE_TYPE=%{content_type}\nPAGE_SIZE=%{size_download}\nPAGE_FINAL=%{url_effective}\n' "$page" || true
          echo "PAGE_FILE=$(file -b /tmp/page.html || true)"
          python - <<'PY'
          from pathlib import Path
          import re, html, urllib.parse, subprocess, os
          page='https://paperzz.com/doc/7214206/a-system-of-axiomatic-set-theory%E2%80%94part-ii13-4.-the'
          s=Path('/tmp/page.html').read_bytes().decode('utf-8','ignore')
          print('TITLE_PRESENT=', 'A SYSTEM OF AXIOMATIC SET THEORY' in s.upper())
          candidates=[]
          pats=[
              r'href=["\']([^"\']*(?:download|\.pdf)[^"\']*)["\']',
              r'(https?://[^"\'<> ]+\.pdf[^"\'<> ]*)',
              r'"(?:downloadUrl|pdfUrl|fileUrl)"\s*:\s*"([^"]+)"',
          ]
          for pat in pats:
              for m in re.finditer(pat,s,re.I):
                  v=html.unescape(m.group(1)).replace('\\/','/')
                  v=urllib.parse.urljoin(page,v)
                  if v not in candidates: candidates.append(v)
          print('CANDIDATE_COUNT=',len(candidates))
          for i,v in enumerate(candidates[:20],1):
              print(f'CANDIDATE_{i}={v}')
              out=f'/tmp/cand{i}.bin'
              fmt='HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download} FINAL=%{url_effective}'
              cp=subprocess.run(['curl','-L','--connect-timeout','20','--max-time','90','-A','Mozilla/5.0','-sS','-o',out,'-w',fmt,v],capture_output=True,text=True)
              print(cp.stdout.strip())
              ft=subprocess.run(['file','-b',out],capture_output=True,text=True).stdout.strip() if os.path.exists(out) else 'MISSING'
              print('FILE='+ft)
              if 'PDF document' in ft:
                  sha=subprocess.run(['sha256sum',out],capture_output=True,text=True).stdout.split()[0]
                  info=subprocess.run(['pdfinfo',out],capture_output=True,text=True).stdout
                  print('SHA256='+sha)
                  for line in info.splitlines():
                      if line.startswith(('Pages:','Title:','Author:')): print(line)
                  txt=subprocess.run(['pdftotext','-layout',out,'-'],capture_output=True,text=True,errors='ignore').stdout
                  print('ARTICLE_TITLE_MATCH=', 'A SYSTEM OF AXIOMATIC SET THEORY' in txt.upper())
                  print('BERNAYS_MATCH=', 'BERNAYS' in txt.upper())
                  print('DOI_MATCH=', '2267281' in txt)
          PY
