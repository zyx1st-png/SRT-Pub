name: Google Books Alternate JSL Copy Probe

on:
  push:
    branches:
      - scratch/bernays-saarland-directory-probe-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check alternate volumes 1-8 copy access and Part II pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.parse, json, hashlib
          BOOK='3S0zZuE2hq0C'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      b=r.read(); return r.status,r.geturl(),r.headers.get('Content-Type',''),b
              except Exception as e:
                  b=b''
                  if hasattr(e,'read'):
                      try:b=e.read()
                      except:pass
                  return getattr(e,'code',None),url,'',b

          print('=== API ===')
          st,final,ct,b=get(f'https://www.googleapis.com/books/v1/volumes/{BOOK}')
          print('HTTP=',st,'TYPE=',ct,'LEN=',len(b),'FINAL=',final)
          if b:
              data=json.loads(b)
              vi=data.get('volumeInfo',{}); ai=data.get('accessInfo',{})
              print('TITLE=',vi.get('title'))
              print('PUBLISHED=',vi.get('publishedDate'))
              print('PAGECOUNT=',vi.get('pageCount'))
              print('SOURCE_IDENTIFIERS=',json.dumps(vi.get('industryIdentifiers',[]),ensure_ascii=False))
              print('ACCESS=',json.dumps({k:ai.get(k) for k in ['country','viewability','embeddable','publicDomain','textToSpeechPermission','webReaderLink']},ensure_ascii=False))
              print('PDF=',json.dumps(ai.get('pdf',{}),ensure_ascii=False))

          print('\n=== SEARCH WITHIN ===')
          pids=[]
          for term in ['A system of axiomatic set theory','Bernays','axiomatic set theory']:
              url=f'https://books.google.com/books?id={BOOK}&jscmd=SearchWithinVolume2&q='+urllib.parse.quote(term)
              st,final,ct,b=get(url)
              print('TERM=',term,'HTTP=',st,'TYPE=',ct,'LEN=',len(b),'FINAL=',final)
              txt=b.decode('utf-8','replace')
              print('HEAD=',repr(txt[:700]))
              try:
                  js=json.loads(txt)
                  print('RESULTS=',js.get('number_of_results'))
                  for it in js.get('search_results',[])[:10]:
                      print('RESULT=',json.dumps({k:it.get(k) for k in ['page_id','page_number','snippet_text']},ensure_ascii=False))
                      if it.get('page_id') and it['page_id'] not in pids:pids.append(it['page_id'])
              except Exception as e: print('JSON_ERROR=',repr(e))

          print('\n=== PAGE IMAGES ===')
          for pid in (pids+['PA1','PA2','PA6','PR1'])[:12]:
              url=f'https://books.google.com/books/content?id={BOOK}&pg={urllib.parse.quote(pid)}&img=1&zoom=2&hl=en'
              st,final,ct,b=get(url)
              print('PID=',pid,'HTTP=',st,'TYPE=',ct,'LEN=',len(b),'SHA256=',hashlib.sha256(b).hexdigest() if b else None,'MAGIC=',repr(b[:16]),'FINAL=',final)
          PY
