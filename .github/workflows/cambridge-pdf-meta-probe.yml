name: Internet Archive JSL 1941 Original Scan Probe

on:
  push:
    branches:
      - scratch/bernays-saarland-directory-probe-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Internet Archive for original JSL 1941 volume/issue scans
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.parse, urllib.request, json
          queries=[
            'title:("Journal of Symbolic Logic") AND year:1941',
            'title:("Journal of Symbolic Logic") AND (volume:6 OR description:"volume 6")',
            '"Journal of Symbolic Logic" AND 1941',
            '"A system of axiomatic set theory" AND Bernays',
            'identifier:*symbolic*logic* AND 1941',
          ]
          seen={}
          for q in queries:
              params={
                'q':q,
                'fl[]':['identifier','title','creator','date','year','description','collection','mediatype','access-restricted-item'],
                'rows':'100','page':'1','output':'json'
              }
              # urlencode doseq handles repeated fl[]
              url='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(params,doseq=True)
              print('\n=== QUERY ===',q)
              print('URL=',url)
              try:
                  with urllib.request.urlopen(url,timeout=60) as r:
                      data=json.load(r)
              except Exception as e:
                  print('ERROR=',repr(e)); continue
              print('NUM_FOUND=',data.get('response',{}).get('numFound'))
              for d in data.get('response',{}).get('docs',[]):
                  ident=d.get('identifier')
                  if not ident: continue
                  seen[ident]=d
                  print('ITEM=',json.dumps(d,ensure_ascii=False,sort_keys=True))
          print('\n=== UNIQUE_ITEMS ===',len(seen))
          for ident,d in seen.items():
              text=(' '.join(str(d.get(k,'')) for k in ['title','creator','date','year','description'])).lower()
              if 'symbolic logic' in text or 'axiomatic set theory' in text or 'bernays' in text:
                  murl=f'https://archive.org/metadata/{urllib.parse.quote(ident)}'
                  print('\n--- METADATA',ident,'---')
                  try:
                      with urllib.request.urlopen(murl,timeout=60) as r:
                          md=json.load(r)
                  except Exception as e:
                      print('META_ERROR=',repr(e)); continue
                  meta=md.get('metadata',{})
                  print('META=',json.dumps({k:meta.get(k) for k in ['identifier','title','creator','date','year','description','collection','mediatype','access-restricted-item']},ensure_ascii=False,sort_keys=True))
                  files=md.get('files',[])
                  candidates=[]
                  for f in files:
                      name=f.get('name','')
                      low=name.lower()
                      if low.endswith(('.pdf','.djvu','.djvu.xml','.text.pdf','.jp2.zip','.scandata.xml')) or 'pdf' in low:
                          candidates.append({k:f.get(k) for k in ['name','format','size','source','private','restricted','md5','sha1']})
                  print('FILE_CANDIDATES=',json.dumps(candidates[:80],ensure_ascii=False))
          PY
