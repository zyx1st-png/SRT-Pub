name: HathiTrust JSL 1941 Vol 6 Probe

on:
  push:
    branches:
      - scratch/bernays-saarland-directory-probe-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query HathiTrust bibliographic and item access metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.parse, json, re

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          ids=[
            ('oclc','1006157584'),
            ('oclc','1782331'),
            ('oclc','01782331'),
            ('lccn','41000486'),
            ('issn','00224812'),
            ('issn','0022-4812'),
          ]

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,text/html,*/*'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      b=r.read()
                      return {'status':r.status,'final':r.geturl(),'type':r.headers.get('Content-Type',''),'body':b}
              except Exception as e:
                  b=b''
                  if hasattr(e,'read'):
                      try:b=e.read()
                      except:pass
                  return {'status':getattr(e,'code',None),'final':url,'type':'','body':b,'error':repr(e)}

          all_items={}
          all_records={}
          print('=== HATHITRUST BIB API ===')
          for kind,val in ids:
              for mode in ['brief','full']:
                  url=f'https://catalog.hathitrust.org/api/volumes/{mode}/{kind}/{urllib.parse.quote(val)}.json'
                  r=get(url)
                  print('\nQUERY=',kind,val,'MODE=',mode)
                  print('HTTP=',r.get('status'),'TYPE=',r.get('type'),'LEN=',len(r.get('body',b'')),'FINAL=',r.get('final'),'ERROR=',r.get('error'))
                  body=r.get('body',b'')
                  if not body: continue
                  txt=body.decode('utf-8','replace')
                  print('HEAD=',repr(txt[:1200]))
                  try:
                      data=json.loads(txt)
                  except Exception as e:
                      print('JSON_ERROR=',repr(e)); continue
                  print('TOP_KEYS=',list(data.keys())[:30] if isinstance(data,dict) else type(data).__name__)
                  records=data.get('records',{}) if isinstance(data,dict) else {}
                  items=data.get('items',[]) if isinstance(data,dict) else []
                  print('RECORD_COUNT=',len(records),'ITEM_COUNT=',len(items))
                  for rk,rv in records.items():
                      all_records[rk]=rv
                      slim={k:rv.get(k) for k in ['recordURL','titles','isbns','issns','oclcs','lccns','publishDates'] if k in rv}
                      print('RECORD=',rk,json.dumps(slim,ensure_ascii=False))
                  for it in items:
                      htid=it.get('htid') or it.get('itemURL') or json.dumps(it,sort_keys=True)
                      all_items[str(htid)]=it
                      print('ITEM=',json.dumps(it,ensure_ascii=False,sort_keys=True))

          print('\n=== CONSOLIDATED ITEMS ===')
          print('UNIQUE_RECORDS=',len(all_records),'UNIQUE_ITEMS=',len(all_items))
          for k,it in all_items.items():
              enum=' '.join(str(it.get(x,'')) for x in ['enumcron','enum_chron','volume','year','date','description'])
              print('ITEM_KEY=',k)
              print('ENUM_TEXT=',repr(enum))
              print('RIGHTS=',it.get('rightsCode'),'ACCESS=',it.get('access'),'USRIGHTS=',it.get('usRightsString'))
              print('ORIG=',it.get('orig'),'SOURCE=',it.get('source'))
              print('ITEM_JSON=',json.dumps(it,ensure_ascii=False,sort_keys=True))

          # Direct item page/metadata probes for anything plausibly 1941/v.6, plus all unique items if small.
          print('\n=== ITEM PAGE ACCESS PROBES ===')
          candidates=[]
          for it in all_items.values():
              htid=it.get('htid')
              if not htid: continue
              e=' '.join(str(it.get(x,'')) for x in ['enumcron','enum_chron','volume','year','date','description']).lower()
              if ('1941' in e or re.search(r'\b(v\.?\s*)?6\b',e) or len(all_items)<=25):
                  if htid not in candidates:candidates.append(htid)
          for htid in candidates[:30]:
              for url in [
                  'https://babel.hathitrust.org/cgi/pt?id='+urllib.parse.quote(htid,safe=''),
                  'https://catalog.hathitrust.org/Record/'+urllib.parse.quote(htid,safe=''),
              ]:
                  r=get(url)
                  text=r.get('body',b'').decode('utf-8','ignore')
                  print('HTID=',htid,'URL=',url,'HTTP=',r.get('status'),'TYPE=',r.get('type'),'LEN=',len(r.get('body',b'')),'FINAL=',r.get('final'),'ERROR=',r.get('error'))
                  for needle in ['Full view','Limited (search-only)','Search in this text','Copyright','public domain','Page Image','Download']:
                      if needle.lower() in text.lower(): print('HAS=',needle)
          PY
