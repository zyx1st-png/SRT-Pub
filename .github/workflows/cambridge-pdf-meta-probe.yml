name: Szeged Kalmar 9-Page Sparse OCR Probe

on:
  push:
    branches:
      - scratch/bernays-saarland-directory-probe-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find exact 9-page scans and OCR only their first pages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr >/dev/null
          python - <<'PY'
          import urllib.request, urllib.parse, html, os, subprocess, hashlib, json
          from html.parser import HTMLParser

          PAGE='https://www.inf.u-szeged.hu/kalmar/pages/munkassaga_cikkek.php'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'

          class P(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]; self.cur=None; self.txt=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='a': self.cur=dict(attrs).get('href'); self.txt=[]
              def handle_data(self,data):
                  if self.cur is not None: self.txt.append(data)
              def handle_endtag(self,tag):
                  if tag.lower()=='a' and self.cur is not None:
                      self.links.append((self.cur,' '.join(''.join(self.txt).split())))
                      self.cur=None; self.txt=[]

          def download(url,path):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/pdf,*/*'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  with open(path,'wb') as f:
                      while True:
                          c=r.read(1024*1024)
                          if not c: break
                          f.write(c)
                  return r.status,r.headers.get('Content-Type',''),r.geturl()

          req=urllib.request.Request(PAGE,headers={'User-Agent':UA})
          with urllib.request.urlopen(req,timeout=60) as r:
              text=r.read().decode('utf-8','ignore')
          p=P(); p.feed(text)
          links=[]
          for href,label in p.links:
              u=urllib.parse.urljoin(PAGE,html.unescape(href))
              if '/kalmar/pdf/' in u.lower() and u not in [x[0] for x in links]:
                  links.append((u,label))
          print('LINKED_PDF_COUNT=',len(links))

          nine=[]
          for i,(url,label) in enumerate(links,1):
              name=urllib.parse.unquote(url.rsplit('/',1)[-1])
              path=f'/tmp/k{i:03d}.pdf'
              try:
                  st,ct,final=download(url,path)
              except Exception as e:
                  print('DOWNLOAD_ERROR=',name,repr(e)); continue
              if not open(path,'rb').read(5).startswith(b'%PDF'):
                  print('NOT_PDF=',name,ct); os.remove(path); continue
              info=subprocess.run(['pdfinfo',path],capture_output=True,text=True,errors='ignore').stdout
              pages=None
              for line in info.splitlines():
                  if line.startswith('Pages:'):
                      try: pages=int(line.split(':',1)[1].strip())
                      except: pass
              if pages==9:
                  sha=hashlib.sha256(open(path,'rb').read()).hexdigest()
                  nine.append((i,name,url,label,path,sha,os.path.getsize(path)))
                  print('NINE_PAGE=',json.dumps({'i':i,'name':name,'label':label,'bytes':os.path.getsize(path),'sha256':sha,'url':url},ensure_ascii=False))
              else:
                  os.remove(path)

          print('NINE_PAGE_COUNT=',len(nine))
          print('\n=== SPARSE FIRST-PAGE OCR ===')
          for i,name,url,label,path,sha,size in nine:
              prefix=f'/tmp/render_{i:03d}'
              cp=subprocess.run(['pdftoppm','-f','1','-singlefile','-r','220','-png',path,prefix],capture_output=True,text=True,timeout=90)
              png=prefix+'.png'
              if cp.returncode!=0 or not os.path.exists(png):
                  print('RENDER_ERROR=',name,cp.stderr[:500]); continue
              pngsha=hashlib.sha256(open(png,'rb').read()).hexdigest()
              ocr=subprocess.run(['tesseract',png,'stdout','-l','eng','--psm','6'],capture_output=True,text=True,errors='ignore',timeout=90).stdout
              norm='\n'.join(line.strip() for line in ocr.splitlines() if line.strip())
              low=norm.lower()
              flags={
                  'title_phrase':'on the reduction of the decision problem' in low,
                  'decision_problem':'decision problem' in low,
                  'ackermann':'ackermann' in low,
                  'symbolic_logic':'symbolic logic' in low,
                  'kalmar':'kalmar' in low or 'kalmár' in low,
                  'first_paper':'first paper' in low,
              }
              print('OCR_CANDIDATE=',json.dumps({
                  'name':name,'pdf_sha256':sha,'first_png_sha256':pngsha,
                  'first_png_bytes':os.path.getsize(png),'flags':flags,
                  'ocr_head':norm[:2500]
              },ensure_ascii=False))
              os.remove(path)
              try: os.remove(png)
              except: pass
          PY
