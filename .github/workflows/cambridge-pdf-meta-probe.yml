name: Google Books JSL Vol 6 Identifier Probe

on:
  push:
    branches:
      - scratch/bernays-saarland-directory-probe-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract bibliographic and scan-source identifiers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.parse, re, html, json
          BOOK='kJU0AAAAIAAJ'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      b=r.read(); return r.status,r.geturl(),r.headers.get('Content-Type',''),b
              except Exception as e:
                  b=b''
                  if hasattr(e,'read'):
                      try: b=e.read()
                      except: pass
                  return getattr(e,'code',None),url,'',b

          urls={
            'about':f'https://books.google.com/books/about/The_Journal_of_Symbolic_Logic.html?id={BOOK}',
            'bibtex':f'https://books.google.com/books/download/The_Journal_of_Symbolic_Logic.bibtex?id={BOOK}&output=bibtex',
            'endnote':f'https://books.google.com/books/download/The_Journal_of_Symbolic_Logic.enw?id={BOOK}&output=enw',
            'refman':f'https://books.google.com/books/download/The_Journal_of_Symbolic_Logic.ris?id={BOOK}&output=ris',
            'jscmd_view':f'https://books.google.com/books?id={BOOK}&jscmd=SearchWithinVolume2&q=A%20system%20of%20axiomatic%20set%20theory',
          }
          alltext=''
          for label,url in urls.items():
              st,final,ct,b=get(url)
              text=b.decode('utf-8','ignore')
              alltext+='\n'+text
              print('\n===',label,'===')
              print('HTTP=',st,'TYPE=',ct,'LEN=',len(b),'FINAL=',final)
              print('HEAD=',repr(text[:3000]))

          print('\n=== IDENTIFIER PATTERNS ===')
          pats={
            'oclc':r'(?i)(?:OCLC|oclc)[^A-Za-z0-9]{0,20}([0-9]{5,15})',
            'lccn':r'(?i)(?:LCCN|lccn)[^A-Za-z0-9]{0,20}([A-Za-z0-9\- ]{6,30})',
            'isbn':r'(?i)(?:ISBN|isbn)[^0-9Xx]{0,20}([0-9Xx\-]{10,20})',
            'issn':r'(?i)(?:ISSN|issn)[^0-9]{0,20}([0-9]{4}-[0-9Xx]{4})',
            'uc_lib':r'(?i)(University of California.{0,150})',
            'source_id':r'(?i)(?:source|scan|library|original)[^\n<>]{0,200}',
          }
          for name,pat in pats.items():
              vals=[]
              for m in re.finditer(pat,alltext):
                  v=' '.join(html.unescape(m.group(1) if m.lastindex else m.group(0)).split())
                  if v not in vals: vals.append(v)
              print(name.upper(),'=',json.dumps(vals[:40],ensure_ascii=False))

          # Also print nearby contexts for likely catalog/source vocabulary.
          print('\n=== CONTEXT WINDOWS ===')
          low=alltext.lower()
          for needle in ['oclc','lccn','issn','university of california','digitized','library','source','scan','catalog','bibtex']:
              pos=0; n=0
              while True:
                  i=low.find(needle,pos)
                  if i<0 or n>=10: break
                  print('NEEDLE=',needle,'CTX=',repr(alltext[max(0,i-250):i+500]))
                  pos=i+len(needle); n+=1
          PY
