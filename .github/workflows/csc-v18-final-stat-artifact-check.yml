name: CSC v18 final statistical transparency check

on:
  push:
    branches:
      - publication/csc-artificial-life-v18-e1e2e3-20260915

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build guarded submission artifact
        working-directory: papers
        run: python build_artificial_life_v18_submission.py | tee /tmp/build.txt
      - name: Install audit dependency
        run: pip install numpy==2.5.3
      - name: Reproduce E1 paired sensitivity audit
        run: python papers/costly_selective_closure_supplement/audit_e1_paired_sensitivity.py | tee /tmp/e1_audit.txt
      - name: Validate final artifact and audit
        working-directory: papers
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          t = Path('CostlySelectiveClosure_v18_ArtificialLife_submission.md').read_text(encoding='utf-8')
          n = len(re.findall(r"[A-Za-z0-9]+(?:[-'][A-Za-z0-9]+)*", t))
          assert 6000 <= n <= 12000, n
          required = [
              'Failure Is Not One-Dimensional:',
              '**Experiment 1 was not preregistered**',
              'two-sided **two-sample label-permutation test**',
              'paired sign-flip sensitivity analysis',
              'This sensitivity analysis is post-hoc',
              '24 of 30 paired differences are positive',
              '25 of 30 paired differences positive',
              'costly_selective_closure_supplement/audit_e1_paired_sensitivity.py',
              'rho = +0.0548074683',
              'rho = -0.7037203560',
              'figure2_evidence_summary_v18.svg',
          ]
          for x in required:
              assert x in t, x
          forbidden = [
              'The paired difference is approximately `0.511`, with the two-sided paired sign-flip',
              'two-sided paired sign-flip permutation test at the 20,000-resample resolution floor',
              'Repository note.',
          ]
          for x in forbidden:
              assert x not in t, x

          body, refs = t.split('\n## References\n', 1)
          refs = refs.split('\n## Appendix A.', 1)[0]
          entries = [x for x in refs.splitlines() if x.startswith('- ')]
          unused = []
          for e in entries:
              m = re.match(r'- ([A-Za-zÀ-ÖØ-öø-ÿ\-]+)', e)
              if m and m.group(1) not in body:
                  unused.append(m.group(1))
          assert not unused, unused

          audit = Path('/tmp/e1_audit.txt').read_text(encoding='utf-8')
          assert audit.count('"paired_signflip_p": 4.999750012499375e-05') == 2
          assert '"positive_paired_differences": 24' in audit
          assert '"zero_paired_differences": 2' in audit
          assert '"negative_paired_differences": 4' in audit
          assert '"positive_paired_differences": 25' in audit
          print('PASS: final v18 word count', n)
          print('PASS: reference entries', len(entries))
          print('PASS: E1 historical-test / paired-sensitivity distinction')
          PY
