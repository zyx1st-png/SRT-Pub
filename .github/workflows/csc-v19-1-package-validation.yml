name: CSC v19.1 package validation

on:
  push:
    branches:
      - publication/csc-v19-1-submission-package-20260916

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build submission text
        run: python papers/build_artificial_life_v19_1_submission.py

      - name: Build reviewer evidence package
        run: python papers/build_csc_v19_1_reviewer_package.py

      - name: Record build hashes
        run: |
          sha256sum papers/CostlySelectiveClosure_v19_1_ArtificialLife_submission.md
          sha256sum papers/CostlySelectiveClosure_v19_1_REVIEWER_EVIDENCE_PACKAGE.zip

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: csc-v19-1-submission-package-validation
          retention-days: 7
          path: |
            papers/CostlySelectiveClosure_v19_1_ArtificialLife_submission.md
            papers/CostlySelectiveClosure_v19_1_REVIEWER_EVIDENCE_PACKAGE.zip
            papers/CostlySelectiveClosure_v19_1_ArtificialLife_COVER_LETTER.md
