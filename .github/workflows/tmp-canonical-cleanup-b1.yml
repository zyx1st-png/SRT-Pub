name: Temporary Canonical Cleanup B1

on:
  push:
    branches:
      - theory/canonical-cleanup-b1-individuation-20260911

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: theory/canonical-cleanup-b1-individuation-20260911

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply B1 routing cleanup
        run: uv run python scripts/tmp_cleanup_b1_individuation_v2.py

      - name: Regenerate L1 Formalism reading split
        run: |
          uv run python scripts/create_reading_split.py \
            Core_Law/SRT_L1_Formalism.md \
            Core_Law/L1_Formalism_Split \
            --id SRT-L1-FORMALISM-SPLIT-INDEX \
            --title "SRT L1 Formalism: Minimal Coupled Dynamics for σ_{sr}, d_c, T_dir, and S" \
            --force

      - name: Regenerate context bundles
        run: uv run python scripts/build_srt_context_bundles.py

      - name: Commit deterministic cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CANONICAL_REGISTRY.md \
                  Governance/SRT_CLAIM_MODE_AUDIT.md \
                  Core_Law/SRT_L1_Formalism.md \
                  Core_Law/L1_Formalism_Split/ \
                  Core_Law/SRT_L1_Hardening_Notes.md \
                  _SRT_SYMBOL_TABLE.md \
                  Core/SRT_OPEN_TENSIONS.md \
                  Operations/Context_Bundles/
          if ! git diff --cached --quiet; then
            git commit -m "Retire legacy subject threshold routing"
            git push origin HEAD:theory/canonical-cleanup-b1-individuation-20260911
          fi
