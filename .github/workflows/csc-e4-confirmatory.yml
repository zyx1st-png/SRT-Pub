name: CSC E4 confirmatory run

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/csc-consequence-scope-e4-20260915
    paths:
      - '.github/workflows/csc-e4-confirmatory.yml'

jobs:
  confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy
      - name: Run first locked E4 confirmatory execution
        working-directory: papers/costly_selective_closure_supplement
        run: python run_consequence_scope.py
      - name: Validate locked result structure and print adjudication fields
        working-directory: papers/costly_selective_closure_supplement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/consequence_scope_results.json')
          x = json.loads(p.read_text())
          assert x['locked_design']['confirmatory_seeds'] == list(range(101,131))
          assert x['locked_design']['common_bank_size'] == 2000
          assert len(x['results']) == 180
          assert len(x['primary_rows']) == 180
          cells = {(r['scope'], r['latency']) for r in x['results']}
          assert cells == {('individual',2),('individual',5),('individual',10),('shared',2),('shared',5),('shared',10)}
          for cell in cells:
              rows = [r for r in x['results'] if (r['scope'],r['latency']) == cell]
              assert sorted(r['seed'] for r in rows) == list(range(101,131))
          print('E4 CONFIRMATORY STRUCTURE PASS')
          print(json.dumps(x['primary_scope_test'], indent=2))
          print(json.dumps(x['latency_level_primary_contrasts'], indent=2))
          print(json.dumps(x['secondary_rollout_scope_contrast'], indent=2))
          print('H-VICTIM diagnostics:')
          for key,val in x['diagnostics'].items():
              print(key, json.dumps({
                  'mean_failures': val['mean_failures'],
                  'mean_forced_agent_fraction': val['mean_forced_agent_fraction'],
                  'mean_both_forced_fraction': val['mean_both_forced_fraction'],
                  'mean_exactly_one_forced_fraction': val['mean_exactly_one_forced_fraction'],
                  'mean_eligible_fraction': val['mean_eligible_fraction'],
                  'failure_categories': val['failure_categories'],
                  'first_failure_categories': val['first_failure_categories'],
                  'partner_actions_during_individual_recovery': val['partner_actions_during_individual_recovery'],
              }, sort_keys=True))
          PY
      - name: Upload first E4 result artifact
        uses: actions/upload-artifact@v4
        with:
          name: csc-e4-first-confirmatory-result
          path: papers/costly_selective_closure_supplement/results/consequence_scope_results.json
          retention-days: 7
