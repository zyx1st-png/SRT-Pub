name: PR 699 Frontmatter Fix

on:
  push:
    branches:
      - agent/real-quantum-representation-guard-v2
  pull_request:
    types:
      - reopened

permissions:
  contents: write

jobs:
  normalize-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/real-quantum-representation-guard-v2
          fetch-depth: 0

      - name: Sync current main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Normalize frontmatter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("Materials/2026/SRC_2025_11_07_Physics_Real_Quantum_Representation_Composition_Quanta.md")
          text = source.read_text(encoding="utf-8")
          source_id = "SRC-2026-08-03-PHYSICS-REAL-QUANTUM-REPRESENTATION-COMPOSITION"
          anchor = f"source_id: {source_id}\n"
          insertion = (
              anchor
              + f"id: {source_id}\n"
              + "type: material_source_card\n"
              + "status: active\n"
              + "layer: operations\n"
              + "epistemic_layer: os\n"
          )
          if f"id: {source_id}" not in text.splitlines():
              if anchor not in text:
                  raise SystemExit(f"missing source_id anchor in {source}")
              text = text.replace(anchor, insertion, 1)
          if "    status: preprint_v2\n" not in text:
              raise SystemExit(f"missing nested preprint status in {source}")
          text = text.replace("    status: preprint_v2\n", "    source_stage: preprint_v2\n", 1)
          source.write_text(text, encoding="utf-8")

          material_log = Path("Operations/Material_Log/2026-08_Part01.md")
          text = material_log.read_text(encoding="utf-8")
          old = "status: active_v1\n"
          new = "status: active\nversion: v1\n"
          if old not in text:
              raise SystemExit(f"missing status anchor in {material_log}")
          material_log.write_text(text.replace(old, new, 1), encoding="utf-8")

          patch = Path("Physics/patches/SRT_Phys_REP01_Representation_Covariance_and_Composition_Guard_v0_1.md")
          text = patch.read_text(encoding="utf-8")
          old = "status: active_v0_1\n"
          new = "status: active\nversion: v0_1\n"
          if old not in text:
              raise SystemExit(f"missing status anchor in {patch}")
          patch.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Check split metadata freshness
        run: uv run python scripts/refresh_split_metadata.py --check

      - name: Run governance preflight
        run: uv run python scripts/governance_preflight.py --skip-write-report --strict-split-metadata

      - name: Commit validated fix and remove bootstrap
        shell: bash
        run: |
          rm .github/workflows/pr699-frontmatter-fix.yml
          git add -A
          git commit -m "governance: normalize PR 699 frontmatter"
          git push origin HEAD:agent/real-quantum-representation-guard-v2
