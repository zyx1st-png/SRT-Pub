name: CSC v18 apply E1 statistical-method correction

on:
  push:
    branches:
      - publication/csc-artificial-life-v18-e1e2e3-20260915

permissions:
  contents: write

jobs:
  revise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply manuscript correction
        run: python papers/apply_v18_e1_stat_label_fix.py
      - name: Verify permanent sensitivity audit
        run: python papers/costly_selective_closure_supplement/audit_e1_paired_sensitivity.py
      - name: Commit corrected manuscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/CostlySelectiveClosure_v18_ArtificialLife_candidate.md
          git commit -m "paper: correct E1 historical test label and add paired sensitivity"
          git push origin HEAD:publication/csc-artificial-life-v18-e1e2e3-20260915
