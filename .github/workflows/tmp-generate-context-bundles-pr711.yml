name: Temporary Context Bundle Regeneration PR 711

on:
  push:
    branches:
      - agent/choice-trace-author-decisions-2026-08-04

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/choice-trace-author-decisions-2026-08-04
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Regenerate context bundles
        run: python scripts/build_srt_context_bundles.py

      - name: Commit generated bundles
        run: |
          if git diff --quiet -- Operations/Context_Bundles; then
            echo 'Context bundles already fresh.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Operations/Context_Bundles
          git commit -m 'Regenerate context bundles for author decision status sync'
          git push origin HEAD:agent/choice-trace-author-decisions-2026-08-04
