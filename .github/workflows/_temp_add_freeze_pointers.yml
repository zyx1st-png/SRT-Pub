name: Temporary Synthesis Freeze Pointer Update

on:
  push:
    branches:
      - agent/srt-convergence-hpb-governance

permissions:
  contents: write

jobs:
  apply-freeze-pointers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Add usage-site freeze pointers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          neuro = Path("Neuroscience/_SRT_Neuroscience_Hardening_Index.md")
          text = neuro.read_text(encoding="utf-8")
          anchor = "> Canonical caution: indexed files are bridge/hardening notes unless explicitly promoted into a canonical SRT document.\n"
          note = "\n> **Synthesis-target freeze · 2026-08-16:** references below to `SRT_Neuroscience_Hardening_N1_N13_v0_2.md`, Neural CompactCore, or other future synthesis targets are historical engineering routes, **not current construction authorization**. The 2026-08-11 bounded neuroscience cluster probe is Case A / STOP. Reopen synthesis only if a named reactivation gate in `Operations/SRT_SYNTHESIS_TARGET_FREEZE_2026-08-16.md` fires.\n"
          if note.strip() not in text:
              if anchor not in text:
                  raise SystemExit("Neuroscience anchor not found")
              text = text.replace(anchor, anchor + note, 1)
              neuro.write_text(text, encoding="utf-8")

          ai = Path("AI/README.md")
          text = ai.read_text(encoding="utf-8")
          anchor = "> **[休眠层声明 · 2026-07-20]** 本层（`AI/`）自 2026-05 起无活跃修订，按\"带冻结戳的图书馆\"治理：可检索、可引用、被活跃任务触碰时可修（touch-based repair，见 `Governance/_SRT_DOC_ENGINEERING_GUIDE.md`），但不进入例行治理与状态面。本层符号与定义**未随 2026-05 之后的 canonical 变更同步**；引用时以 `CANONICAL_REGISTRY.md`、`_SRT_SYMBOL_TABLE.md` 及各 canonical 锚点为准。\n"
          note = "\n> **Synthesis-target freeze · 2026-08-16:** AI CompactCore / future synthesis references are not default landing authorization for new patches or hooks. The 2026-08-11 AI cluster probe is Case A / STOP; reopen synthesis only if a named reactivation gate in `../Operations/SRT_SYNTHESIS_TARGET_FREEZE_2026-08-16.md` fires. Historical target references remain provenance, not active backlog.\n"
          if note.strip() not in text:
              if anchor not in text:
                  raise SystemExit("AI README anchor not found")
              text = text.replace(anchor, anchor + note, 1)
              ai.write_text(text, encoding="utf-8")
          PY

      - name: Refresh generated context bundles
        run: uv run python scripts/build_srt_context_bundles.py

      - name: Commit pointer and generated updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI/README.md Neuroscience/_SRT_Neuroscience_Hardening_Index.md Operations/Context_Bundles
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Expose synthesis freeze at AI and neuroscience entry points"
          git push origin "HEAD:${GITHUB_REF_NAME}"
