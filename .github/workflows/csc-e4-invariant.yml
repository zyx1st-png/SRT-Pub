name: CSC E4 invariant check

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/csc-consequence-scope-e4-20260915
    paths:
      - '.github/workflows/csc-e4-invariant.yml'

jobs:
  invariant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy
      - name: Run invariant-only suite
        working-directory: papers/costly_selective_closure_supplement
        run: python test_consequence_scope_invariants.py

# rerun after import-path-only repair; no confirmatory seeds are used here
