name: Observed Calibration Synthetic

on:
  pull_request:
    paths:
      - "Experiments/neuro_sleep_null_calibration/**"
      - ".github/workflows/observed-calibration-synthetic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.0"
      - uses: astral-sh/setup-uv@v5
      - name: Install locked science dependencies and test-only tools
        run: uv pip install --system -r Experiments/neuro_sleep_null_calibration/g0-runtime-macos-arm64.lock pytest ruff
      - name: Static checks
        run: |
          ruff check Experiments/neuro_sleep_null_calibration/observed_calibration*.py Experiments/neuro_sleep_null_calibration/observed_remediation*.py Experiments/neuro_sleep_null_calibration/h3_120_closure.py Experiments/neuro_sleep_null_calibration/test_observed*.py
          python -m py_compile Experiments/neuro_sleep_null_calibration/observed_calibration*.py Experiments/neuro_sleep_null_calibration/observed_remediation*.py Experiments/neuro_sleep_null_calibration/h3_120_closure.py
      - name: Generated sample identity
        run: |
          python Experiments/neuro_sleep_null_calibration/observed_calibration_runner.py --validate-sample
          python Experiments/neuro_sleep_null_calibration/observed_calibration_remediation.py --validate-packet
      - name: Synthetic sources, canonical Q and real supervised fault tests
        run: >-
          python -m pytest -x -p no:cacheprovider -q --junitxml=/tmp/srt-remediation-ci.xml
          Experiments/neuro_sleep_null_calibration/test_observed_remediation_identity.py
          Experiments/neuro_sleep_null_calibration/test_observed_remediation_budget.py
          Experiments/neuro_sleep_null_calibration/test_observed_calibration_remediation.py
          Experiments/neuro_sleep_null_calibration/test_observed_calibration.py
          Experiments/neuro_sleep_null_calibration/test_g0_q_protocol.py
      - name: Retain synthetic failure and process-group evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observed-remediation-synthetic-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            /tmp/srt-remediation-*
            /tmp/srt-observed-synthetic-*
