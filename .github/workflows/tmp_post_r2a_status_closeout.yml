name: Temporary post-R2-A status closeout

on:
  push:
    branches:
      - status/r2a-session-handoff-20260912

permissions:
  contents: write

jobs:
  closeout-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: status/r2a-session-handoff-20260912
          fetch-depth: 0

      - name: Merge live main and patch STATUS only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          from pathlib import Path
          p = Path('STATUS.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('updated: 2026-09-11', 'updated: 2026-09-12', 1)

          fast = '## Fast Status\n\n'
          overlay = (
              '## Fast Status\n\n'
              '### 0. R2-A authority-cleanup closeout — 2026-09-12\n\n'
              '```text\n'
              '#951 retrospective provenance closeout = MERGED / 62707551602a9d56ac9ec898ea6a66f098b5e543\n'
              '#952 R2-A authority truth-up = MERGED / e33476e06de3471d11c1994595669552764983ab\n'
              'R2-A F1/F4/F6/F8/F10/F11 = COMPLETE\n'
              'R2-B F2/F5/F9 = NEXT UNOPENED GATE / NOT STARTED BY THIS CLOSEOUT\n'
              'R2-C F3/F7 = SEPARATE / NOT STARTED\n'
              '#949 creator–AI final-skeleton alignment = OPEN DRAFT / REQUIRED BEFORE ANY L0 CANONICAL REWRITE\n'
              'L0 canonical rewrite = HOLD\n'
              '```\n\n'
          )
          if fast not in text:
              raise SystemExit('Fast Status marker missing')
          text = text.replace(fast, overlay, 1)
          text = text.replace('latest merged canonical checkpoint:', 'latest merged ontology-formation checkpoint:', 1)

          old_phase = (
              'current phase:\n'
              'POST-#947 STATUS / CONTEXT CLOSEOUT\n'
              '-> then OLD-CANONICAL REVERSE AUDIT FROM NEW SPINE'
          )
          new_phase = (
              'current phase:\n'
              'R2-A AUTHORITY PROPAGATION = COMPLETE\n'
              'R2-B (F2/F5/F9) = NEXT UNOPENED GATE / NOT STARTED IN THIS CLOSEOUT\n'
              'R2-C (F3/F7) = SEPARATE / NOT STARTED\n'
              'OLD-CANONICAL REVERSE AUDIT = QUEUED AFTER R2-A/B/C\n'
              '#949 creator–AI final-skeleton gate = REQUIRED BEFORE ANY L0 CANONICAL REWRITE\n'
              'L0 canonical rewrite = HOLD'
          )
          if old_phase not in text:
              raise SystemExit('old phase block missing')
          text = text.replace(old_phase, new_phase, 1)

          route = '### 2. Current controlling route\n\n'
          route_note = (
              '### 2. Current controlling route\n\n'
              '> `CANONICAL_REGISTRY.md §C` is the single owner of complete citation priority. '
              'The list below is a **task-local working read sequence**, not a second authority chain; '
              'cross-owner adjudication still resolves through Registry §C -> Generative Ontology Spine -> compatible local owners.\n\n'
          )
          if route not in text:
              raise SystemExit('controlling route marker missing')
          text = text.replace(route, route_note, 1)

          old_23 = ('#947 is now the controlling cross-owner canonical spine. #940/#942 remain compatible local landings; '
                    '#938 remains a noncanonical reconstruction checkpoint. #947 canonically fixes the P+E Bearer semantic route '
                    'but does not close Bearer->actual 承担 / concern / agency / subject / cognition / phenomenality, nor does it '
                    're-ratify every historical L0 primitive or downstream canonical claim.')
          new_23 = ('#947 remains the semantic cross-owner canonical spine. #952 now closes the R2-A authority-propagation layer: '
                    'Registry §C owns the complete citation-priority chain, the Spine owns cross-owner generation order / non-identity '
                    '/ OPEN routing, and compatible local owners retain local definitions. #940/#942 remain compatible local landings; '
                    '#938 remains a noncanonical reconstruction checkpoint. Neither #951 nor #952 closes Bearer->actual 承担 / concern '
                    '/ agency / subject / cognition / phenomenality, nor do they authorize an L0 canonical rewrite.')
          if old_23 not in text:
              raise SystemExit('section 23 paragraph missing')
          text = text.replace(old_23, new_23, 1)

          immediate = '## Immediate routing\n\n'
          immediate_note = (
              '## Immediate routing\n\n'
              '> **2026-09-12 R2-A closeout override:** the legacy reverse-audit queue below remains useful as the eventual audit path, '
              'but it is not the immediate next execution sequence. R2-B (`F2/F5/F9`) and R2-C (`F3/F7`) must be separately closed '
              'before that reverse audit proceeds. This closeout does not enter either group. #949 creator–AI final-skeleton alignment '
              'still precedes any L0 canonical rewrite.\n\n'
          )
          if immediate not in text:
              raise SystemExit('Immediate routing marker missing')
          text = text.replace(immediate, immediate_note, 1)
          p.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/tmp_post_r2a_status_closeout.yml
          git add STATUS.md .github/workflows/tmp_post_r2a_status_closeout.yml
          git diff --cached --check
          git commit -m "Refresh STATUS after R2-A authority closeout"

      - name: Regenerate context bundles from clean STATUS source commit
        shell: bash
        run: |
          python scripts/build_srt_context_bundles.py
          python scripts/governance_preflight.py
          git checkout HEAD -- Operations/Archive_Records/Large_File_Audit_2026-05-09.md || true
          git add Operations/Context_Bundles
          git diff --cached --check
          git commit -m "Regenerate context bundles after R2-A STATUS closeout"

      - name: Push closeout commits
        run: git push origin HEAD:status/r2a-session-handoff-20260912
