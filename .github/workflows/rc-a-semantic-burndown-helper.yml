name: RC-A semantic burn-down helper

on:
  push:
    branches:
      - agent/rc-a-semantic-burndown-2026-08-17

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/rc-a-semantic-burndown-2026-08-17
          fetch-depth: 0

      - name: Apply asserted replacements
        run: python scripts/rc_a_semantic_burndown_once.py

      - name: Validate diff
        run: |
          git diff --check
          git diff --stat

      - name: Remove one-shot helpers and commit
        run: |
          rm .github/workflows/rc-a-semantic-burndown-helper.yml
          rm scripts/rc_a_semantic_burndown_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'consolidation: sync active RC-A owner dependencies'
          git push origin HEAD:agent/rc-a-semantic-burndown-2026-08-17
